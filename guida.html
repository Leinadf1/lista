<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guida TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        h1 { color: #58a6ff; font-size: 22px; }
        #back-btn {
            align-self: flex-start;
            margin-bottom: 20px;
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
            background: #21262d;
            padding: 6px 12px;
            border-radius: 8px;
        }
        #loading { margin: 30px; font-size: 16px; color: #f1e05a; }
        .channel-row {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 800px;
        }
        .channel-name {
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 6px;
        }
        .program {
            font-size: 14px;
            margin: 2px 0;
        }
        .program-time {
            color: #8b949e;
            display: inline-block;
            width: 70px;
        }
        .program-title {
            color: #c9d1d9;
        }
        .program-next {
            color: #58a6ff;
        }
        #search {
            width: 100%;
            max-width: 800px;
            padding: 8px;
            margin-bottom: 20px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <a href="index.html" id="back-btn">← Torna alla Dashboard</a>
    <h1>GUIDA TV</h1>
    <input type="text" id="search" placeholder="Cerca canale... (es. Sky, DAZN, Eurosport)" oninput="filterChannels()">
    <div id="loading">Caricamento programmazione...</div>
    <div id="guide-container" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>

    <script>
        const EPG_URL = "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz";
        let allChannels = [];

        async function loadEPG() {
            try {
                const response = await fetch(EPG_URL);
                if (!response.ok) throw new Error("Errore nel download dell'EPG");
                const arrayBuffer = await response.arrayBuffer();
                const decompressed = pako.ungzip(new Uint8Array(arrayBuffer));
                const xmlText = new TextDecoder('utf-8').decode(decompressed);
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                // Mappa display-name per channel id
                const channelNames = {};
                const channelNodes = xmlDoc.getElementsByTagName('channel');
                for (let ch of channelNodes) {
                    const id = ch.getAttribute('id');
                    const display = ch.getElementsByTagName('display-name')[0]?.textContent;
                    if (id && display) channelNames[id] = display;
                }

                // Raccogli i programmi
                const programmes = xmlDoc.getElementsByTagName('programme');
                const channelMap = new Map();

                for (let prog of programmes) {
                    const channelId = prog.getAttribute('channel');
                    const start = prog.getAttribute('start');
                    const stop = prog.getAttribute('stop');
                    const title = prog.getElementsByTagName('title')[0]?.textContent || 'Senza titolo';

                    if (!channelId || !start || !stop) continue;
                    if (!channelMap.has(channelId)) channelMap.set(channelId, []);
                    channelMap.get(channelId).push({ start, stop, title });
                }

                const now = new Date();
                const guideData = [];

                for (let [channelId, progs] of channelMap) {
                    const name = channelNames[channelId] || channelId;
                    // Ordina per inizio
                    progs.sort((a, b) => a.start.localeCompare(b.start));

                    // Trova il programma corrente e il successivo
                    let current = null;
                    let next = null;
                    for (let i = 0; i < progs.length; i++) {
                        const start = new Date(progs[i].start);
                        const stop = new Date(progs[i].stop);
                        if (start <= now && now < stop) {
                            current = progs[i];
                            if (i + 1 < progs.length) next = progs[i + 1];
                            break;
                        }
                        // Se siamo prima del primo programma del giorno, prendi il primo come next
                        if (start > now && i === 0) {
                            next = progs[i];
                            break;
                        }
                    }
                    if (current || next) {
                        guideData.push({ name, current, next });
                    }
                }

                allChannels = guideData;
                renderGuide(guideData);
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                document.getElementById('loading').textContent = 'Errore: ' + err.message;
            }
        }

        function renderGuide(channels) {
            const container = document.getElementById('guide-container');
            container.innerHTML = '';
            for (let ch of channels) {
                const row = document.createElement('div');
                row.className = 'channel-row';
                row.innerHTML = `
                    <div class="channel-name">${ch.name}</div>
                    ${ch.current ? `<div class="program"><span class="program-time">${formatTime(ch.current.start)} - ${formatTime(ch.current.stop)}</span><span class="program-title">${ch.current.title}</span></div>` : '<div class="program">Nessun programma in onda</div>'}
                    ${ch.next ? `<div class="program program-next"><span class="program-time">${formatTime(ch.next.start)} - ${formatTime(ch.next.stop)}</span><span class="program-title">${ch.next.title}</span></div>` : ''}
                `;
                container.appendChild(row);
            }
        }

        function formatTime(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        }

        function filterChannels() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
            renderGuide(filtered);
        }

        loadEPG();
    </script>
</body>
</html>
