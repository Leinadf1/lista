<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Multi-Player IPTV MPD ClearKey</title>
  <!-- Shaka Player CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #0f0f0f; color: white; font-family: sans-serif; overflow: hidden; }
    
    #sidebar { width: 280px; background: #181818; overflow-y: auto; padding: 12px; border-right: 1px solid #282828; display: flex; flex-direction: column; }
    #sidebar h3 { font-size: 13px; margin-bottom: 10px; text-transform: uppercase; color: #aaa; letter-spacing: 0.5px; }
    
    #drop-zone {
      border: 2px dashed #007acc; border-radius: 6px; padding: 12px; text-align: center;
      background: #222; cursor: pointer; margin-bottom: 12px; font-size: 12px; color: #ccc;
    }
    #drop-zone.dragover { background: #007acc22; border-color: #00a2ff; color: #fff; }

    #channels-list { flex: 1; overflow-y: auto; }
    .channel-btn {
      width: 100%; padding: 10px 12px; margin-bottom: 6px; background: #222; border: 1px solid #333;
      color: white; text-align: left; cursor: pointer; border-radius: 6px; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    }
    .channel-btn:hover { background: #007acc; border-color: #007acc; }

    #grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 6px; background: #000; }
    .player-box { background: #121212; position: relative; border: 2px solid #222; border-radius: 6px; overflow: hidden; }
    .player-box.selected { border-color: #007acc; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .slot-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Playlist MPD (F1)</h3>
    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
      📂 Trascina qui la playlist .m3u
    </div>
    <input type="file" id="file-input" accept=".m3u,.m3u8" style="display: none;">
    <div id="channels-list"></div>
  </div>

  <div id="grid">
    <div class="player-box selected" onclick="selectSlot(0)"><video id="video-0" autoplay muted controls></video><div class="slot-label">SCHERMO 1</div></div>
    <div class="player-box" onclick="selectSlot(1)"><video id="video-1" autoplay muted controls></video><div class="slot-label">SCHERMO 2</div></div>
    <div class="player-box" onclick="selectSlot(2)"><video id="video-2" autoplay muted controls></video><div class="slot-label">SCHERMO 3</div></div>
    <div class="player-box" onclick="selectSlot(3)"><video id="video-3" autoplay muted controls></video><div class="slot-label">SCHERMO 4</div></div>
  </div>

  <script>
    shaka.polyfill.installAll();

    let activeSlot = 0;
    const shakaPlayers = [null, null, null, null];

    async function initPlayers() {
      for (let i = 0; i < 4; i++) {
        const video = document.getElementById(`video-${i}`);
        const player = new shaka.Player(video);
        player.addEventListener('error', (e) => console.error('Errore Shaka:', e));
        shakaPlayers[i] = player;
      }
    }

    function selectSlot(index) {
      activeSlot = index;
      document.querySelectorAll('.player-box').forEach((box, i) => {
        box.classList.toggle('selected', i === index);
      });
    }

    async function playChannel(channel) {
      const player = shakaPlayers[activeSlot];
      if (!player) return;

      // Configurazione ClearKey per il DRM
      if (channel.keyId && channel.key) {
        player.configure({
          drm: {
            clearKeys: {
              [channel.keyId]: channel.key
            }
          }
        });
      }

      try {
        await player.load(channel.url);
      } catch (e) {
        console.error("Errore di riproduzione:", e);
      }
    }

    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      const channels = [];
      let currentName = '';
      let currentKeyId = '';
      let currentKey = '';
      let isMpd = false;

      lines.forEach(line => {
        line = line.trim();

        if (line.startsWith('#EXTINF:')) {
          const parts = line.split(',');
          currentName = parts[parts.length - 1] || 'Canale';
          currentKeyId = '';
          currentKey = '';
          isMpd = false;
        } else if (line.includes('manifest_type=mpd')) {
          isMpd = true;
        } else if (line.includes('license_key=')) {
          const keyPair = line.split('license_key=')[1].trim();
          const [kId, kVal] = keyPair.split(':');
          currentKeyId = kId;
          currentKey = kVal;
        } else if (line.endsWith('.mpd') || (line.includes('.mpd?') && !line.startsWith('#'))) {
          // Filtra ed estrae solo gli stream MPD
          channels.push({
            name: currentName,
            url: line,
            keyId: currentKeyId,
            key: currentKey
          });
          currentName = '';
        }
      });

      return channels;
    }

    function renderChannels(channels) {
      const listEl = document.getElementById('channels-list');
      listEl.innerHTML = '';

      channels.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        btn.innerText = ch.name;
        btn.onclick = () => playChannel(ch);
        listEl.appendChild(btn);
      });
    }

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const channels = parseM3U(e.target.result);
        renderChannels(channels);
      };
      reader.readAsText(file);
    }

    // Drag & drop setup
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    document.addEventListener('DOMContentLoaded', initPlayers);
  </script>
</body>
</html>
