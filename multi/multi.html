<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Multi-Player IPTV MPD ClearKey</title>
  <!-- Shaka Player CDN (Versione standard senza UI) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #0f0f0f; color: white; font-family: sans-serif; overflow: hidden; }
    
    /* Sidebar canali */
    #sidebar { width: 300px; background: #181818; overflow-y: auto; padding: 12px; border-right: 1px solid #282828; display: flex; flex-direction: column; gap: 10px; }
    #sidebar h3 { font-size: 13px; text-transform: uppercase; color: #aaa; letter-spacing: 0.5px; }
    
    .url-box { display: flex; gap: 6px; }
    .url-input { flex: 1; background: #222; border: 1px solid #333; color: white; padding: 8px; border-radius: 4px; font-size: 12px; }
    .url-input:focus { outline: none; border-color: #007acc; }
    .btn-load { background: #007acc; border: none; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-load:hover { background: #0099ff; }

    #drop-zone {
      border: 2px dashed #444; border-radius: 6px; padding: 10px; text-align: center;
      background: #222; cursor: pointer; font-size: 11px; color: #aaa;
    }
    #drop-zone.dragover { background: #007acc22; border-color: #00a2ff; color: #fff; }

    #channels-list { flex: 1; overflow-y: auto; }
    .channel-btn {
      width: 100%; padding: 10px 12px; margin-bottom: 6px; background: #222; border: 1px solid #333;
      color: white; text-align: left; cursor: pointer; border-radius: 6px; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    }
    .channel-btn:hover { background: #007acc; border-color: #007acc; }

    /* Griglia Player (2x2) */
    #grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 6px; background: #000; }
    .player-box { background: #121212; position: relative; border: 2px solid #222; border-radius: 6px; overflow: hidden; }
    .player-box.selected { border-color: #007acc; }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Nasconde il timestamp numerico sballato generato da Chrome */
    video::-webkit-media-controls-time-remaining-display,
    video::-webkit-media-controls-current-time-display {
      display: none !important;
    }

    .slot-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; pointer-events: none; z-index: 10; }
    
    /* Overlay badge LIVE / Ritardo temporale */
    .live-badge {
      position: absolute;
      bottom: 10px;
      left: 60px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-family: sans-serif;
      font-weight: bold;
      color: #fff;
      pointer-events: none;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #ff0000;
      border-radius: 50%;
      display: inline-block;
    }
    .live-badge.on-edge .live-dot {
      background-color: #00ff00;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Playlist MPD (F1)</h3>

    <div class="url-box">
      <input type="text" id="m3u-url" class="url-input" placeholder="URL Playlist">
      <button class="btn-load" onclick="fetchPlaylistFromUrl()">Ricarica</button>
    </div>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
      📂 Oppure trascina qui il file .m3u
    </div>
    <input type="file" id="file-input" accept=".m3u,.m3u8" style="display: none;">

    <div id="channels-list"></div>
  </div>

  <div id="grid">
    <div class="player-box selected" onclick="selectSlot(0)">
      <video id="video-0" autoplay muted controls></video>
      <div class="slot-label">SCHERMO 1</div>
      <div class="live-badge" id="badge-0"><span class="live-dot"></span><span id="txt-0">LIVE</span></div>
    </div>
    <div class="player-box" onclick="selectSlot(1)">
      <video id="video-1" autoplay muted controls></video>
      <div class="slot-label">SCHERMO 2</div>
      <div class="live-badge" id="badge-1"><span class="live-dot"></span><span id="txt-1">LIVE</span></div>
    </div>
    <div class="player-box" onclick="selectSlot(2)">
      <video id="video-2" autoplay muted controls></video>
      <div class="slot-label">SCHERMO 3</div>
      <div class="live-badge" id="badge-2"><span class="live-dot"></span><span id="txt-2">LIVE</span></div>
    </div>
    <div class="player-box" onclick="selectSlot(3)">
      <video id="video-3" autoplay muted controls></video>
      <div class="slot-label">SCHERMO 4</div>
      <div class="live-badge" id="badge-3"><span class="live-dot"></span><span id="txt-3">LIVE</span></div>
    </div>
  </div>

  <script>
    const DEFAULT_GIST_URL = "https://gist.github.com/Leinadf1/4246b01b8870f49e2cfa50fda49a767e";

    shaka.polyfill.installAll();

    let activeSlot = 0;
    const shakaPlayers = [null, null, null, null];

    async function initPlayers() {
      for (let i = 0; i < 4; i++) {
        const video = document.getElementById(`video-${i}`);
        const player = new shaka.Player(video);

        player.configure({
          manifest: {
            dash: {
              ignoreMinBufferTime: true
            }
          }
        });

        // Aggiorna il badge del tempo senza alterare il motore Shaka
        video.addEventListener('timeupdate', () => updateLiveLatency(i));

        player.addEventListener('error', (e) => console.error(`Errore Slot ${i}:`, e));
        shakaPlayers[i] = player;
      }

      document.getElementById('m3u-url').value = DEFAULT_GIST_URL;
      fetchPlaylistFromUrl(DEFAULT_GIST_URL);
    }

    function selectSlot(index) {
      activeSlot = index;
      document.querySelectorAll('.player-box').forEach((box, i) => {
        box.classList.toggle('selected', i === index);
      });
    }

    async function playChannel(channel) {
      const player = shakaPlayers[activeSlot];
      if (!player) return;

      // Resetta le chiavi precedenti
      player.configure({ drm: { clearKeys: {} } });

      if (channel.keyId && channel.key) {
        player.configure({
          drm: {
            clearKeys: {
              [channel.keyId]: channel.key
            }
          }
        });
      }

      try {
        await player.load(channel.url);
      } catch (e) {
        console.error("Errore durante il caricamento dello stream:", e);
      }
    }

    // Calcolo dinamico della latenza dal punto LIVE
    function updateLiveLatency(index) {
      const video = document.getElementById(`video-${index}`);
      const txtEl = document.getElementById(`txt-${index}`);
      const badgeEl = document.getElementById(`badge-${index}`);
      
      if (!video || !video.seekable.length || !txtEl) return;

      const liveEdge = video.seekable.end(video.seekable.length - 1);
      const currentTime = video.currentTime;
      const delay = Math.floor(liveEdge - currentTime);

      if (delay <= 5) {
        txtEl.innerText = "LIVE";
        badgeEl.classList.add('on-edge');
      } else {
        badgeEl.classList.remove('on-edge');
        const mins = Math.floor(delay / 60);
        const secs = String(delay % 60).padStart(2, '0');
        txtEl.innerText = mins > 0 ? `-${mins}:${secs}` : `-${secs}s`;
      }
    }

    async function fetchPlaylistFromUrl(customUrl = null) {
      let url = customUrl || document.getElementById('m3u-url').value.trim();
      if (!url) return;

      if (url.includes('gist.github.com') && !url.includes('/raw')) {
        url = url.replace('gist.github.com', 'gist.githubusercontent.com') + '/raw';
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Impossibile scaricare la lista');
        const text = await response.text();
        const channels = parseM3U(text);
        renderChannels(channels);
      } catch (err) {
        console.error("Errore nel caricamento dell'URL:", err);
      }
    }

    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      const channels = [];
      let currentName = '';
      let currentKeyId = '';
      let currentKey = '';

      lines.forEach(line => {
        line = line.trim();

        if (line.startsWith('#EXTINF:')) {
          const parts = line.split(',');
          currentName = parts[parts.length - 1] || 'Canale';
          currentKeyId = '';
          currentKey = '';
        } else if (line.includes('license_key=')) {
          const keyPair = line.split('license_key=')[1].trim();
          const [kId, kVal] = keyPair.split(':');
          currentKeyId = kId;
          currentKey = kVal;
        } else if (line.endsWith('.mpd') || (line.includes('.mpd?') && !line.startsWith('#'))) {
          channels.push({
            name: currentName,
            url: line,
            keyId: currentKeyId,
            key: currentKey
          });
          currentName = '';
        }
      });

      return channels;
    }

    function renderChannels(channels) {
      const listEl = document.getElementById('channels-list');
      listEl.innerHTML = '';

      channels.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        btn.innerText = ch.name;
        btn.onclick = () => playChannel(ch);
        listEl.appendChild(btn);
      });
    }

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const channels = parseM3U(e.target.result);
        renderChannels(channels);
      };
      reader.readAsText(file);
    }

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    document.addEventListener('DOMContentLoaded', initPlayers);
  </script>
</body>
</html>
