<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Multi-Player IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #121212; color: white; font-family: sans-serif; }
    
    /* Sidebar canali */
    #sidebar { width: 220px; background: #1e1e1e; overflow-y: auto; padding: 10px; border-right: 1px solid #333; }
    #sidebar h3 { font-size: 14px; margin-bottom: 10px; text-transform: uppercase; color: #888; }
    .channel-btn {
      width: 100%; padding: 8px 10px; margin-bottom: 6px; background: #2a2a2a; border: 1px solid #444;
      color: white; text-align: left; cursor: pointer; border-radius: 4px; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .channel-btn:hover { background: #007acc; }

    /* Griglia Player (2x2) */
    #grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; padding: 4px; }
    .player-box { background: #000; position: relative; border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
    .player-box.selected { border: 2px solid #007acc; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .slot-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Canali</h3>
    <div id="channels-list">Caricamento...</div>
  </div>

  <div id="grid">
    <div class="player-box selected" onclick="selectSlot(0)"><video id="video-0" controls autoplay muted></video><div class="slot-label">Schermo 1</div></div>
    <div class="player-box" onclick="selectSlot(1)"><video id="video-1" controls autoplay muted></video><div class="slot-label">Schermo 2</div></div>
    <div class="player-box" onclick="selectSlot(2)"><video id="video-2" controls autoplay muted></video><div class="slot-label">Schermo 3</div></div>
    <div class="player-box" onclick="selectSlot(3)"><video id="video-3" controls autoplay muted></video><div class="slot-label">Schermo 4</div></div>
  </div>

  <script>
    const GIST_URL = 'https://gist.github.com/Leinadf1/4246b01b8870f49e2cfa50fda49a767e/raw/F1_CAM_APPLE_TV.m3u';
    let activeSlot = 0;
    const hlsInstances = [null, null, null, null];

    // Seleziona il riquadro attivo su cui caricare il canale
    function selectSlot(index) {
      activeSlot = index;
      document.querySelectorAll('.player-box').forEach((box, i) => {
        box.classList.toggle('selected', i === index);
      });
    }

    // Parse del file M3U
    function parseM3U(content) {
      const lines = content.split('\n');
      const channels = [];
      let currentName = '';

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const parts = line.split(',');
          currentName = parts[parts.length - 1] || 'Canale';
        } else if (line && !line.startsWith('#')) {
          channels.push({ name: currentName || 'Senza Nome', url: line });
          currentName = '';
        }
      });
      return channels;
    }

    // Carica canale nel player attivo
    function playChannel(url) {
      const video = document.getElementById(`video-${activeSlot}`);

      if (hlsInstances[activeSlot]) {
        hlsInstances[activeSlot].destroy();
      }

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hlsInstances[activeSlot] = hls;
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
      }
    }

    // Download del Gist M3U
    fetch(GIST_URL)
      .then(res => res.text())
      .then(data => {
        const channels = parseM3U(data);
        const listEl = document.getElementById('channels-list');
        listEl.innerHTML = '';

        channels.forEach(ch => {
          const btn = document.createElement('button');
          btn.className = 'channel-btn';
          btn.innerText = ch.name;
          btn.onclick = () => playChannel(ch.url);
          listEl.appendChild(btn);
        });
      })
      .catch(err => {
        document.getElementById('channels-list').innerText = 'Errore nel caricamento della playlist.';
        console.error(err);
      });
  </script>
</body>
</html>
