<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Multi-Player IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #0f0f0f; color: white; font-family: sans-serif; }
    
    #sidebar { width: 260px; background: #181818; overflow-y: auto; padding: 12px; border-right: 1px solid #282828; }
    #sidebar h3 { font-size: 13px; margin-bottom: 12px; text-transform: uppercase; color: #aaa; letter-spacing: 0.5px; }
    .channel-btn {
      width: 100%; padding: 10px 12px; margin-bottom: 6px; background: #222; border: 1px solid #333;
      color: white; text-align: left; cursor: pointer; border-radius: 6px; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px;
    }
    .channel-btn:hover { background: #007acc; border-color: #007acc; }

    #grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 6px; background: #000; }
    .player-box { background: #121212; position: relative; border: 2px solid #222; border-radius: 6px; overflow: hidden; }
    .player-box.selected { border-color: #007acc; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .slot-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; pointer-events: none; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Canali F1 / Apple TV</h3>
    <div id="channels-list">Caricamento in corso...</div>
  </div>

  <div id="grid">
    <div class="player-box selected" onclick="selectSlot(0)"><video id="video-0" controls autoplay muted></video><div class="slot-label">SCHERMO 1</div></div>
    <div class="player-box" onclick="selectSlot(1)"><video id="video-1" controls autoplay muted></video><div class="slot-label">SCHERMO 2</div></div>
    <div class="player-box" onclick="selectSlot(2)"><video id="video-2" controls autoplay muted></video><div class="slot-label">SCHERMO 3</div></div>
    <div class="player-box" onclick="selectSlot(3)"><video id="video-3" controls autoplay muted></video><div class="slot-label">SCHERMO 4</div></div>
  </div>

  <script>
    const GIST_URL = 'https://gist.github.com/Leinadf1/4246b01b8870f49e2cfa50fda49a767e/raw/F1_CAM_APPLE_TV.m3u';
    let activeSlot = 0;
    const hlsInstances = [null, null, null, null];

    function selectSlot(index) {
      activeSlot = index;
      document.querySelectorAll('.player-box').forEach((box, i) => {
        box.classList.toggle('selected', i === index);
      });
    }

    function playChannel(url) {
      const video = document.getElementById(`video-${activeSlot}`);

      if (hlsInstances[activeSlot]) {
        hlsInstances[activeSlot].destroy();
      }

      if (Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hlsInstances[activeSlot] = hls;
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
      }
    }

    // Chiamata POST verso la tua API Vercel
    async function loadChannels() {
      const listEl = document.getElementById('channels-list');
      try {
        const response = await fetch('/api/get-list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: GIST_URL })
        });

        const data = await response.json();
        listEl.innerHTML = '';

        // Se l'API restituisce un array di canali o il testo/m3u
        const channels = Array.isArray(data) ? data : (data.channels || []);

        if (channels.length === 0 && typeof data === 'string') {
          // Nel caso in cui la tua API restituisca il testo grezzo M3U
          parseAndRenderM3U(data);
          return;
        }

        channels.forEach(ch => {
          const btn = document.createElement('button');
          btn.className = 'channel-btn';
          btn.innerText = ch.name || ch.title || 'Canale';
          btn.onclick = () => playChannel(ch.url || ch.stream);
          listEl.appendChild(btn);
        });

      } catch (err) {
        console.error("Errore durante la chiamata API:", err);
        listEl.innerText = "Errore nel caricamento della lista dall'API.";
      }
    }

    function parseAndRenderM3U(m3uText) {
      const listEl = document.getElementById('channels-list');
      listEl.innerHTML = '';
      const lines = m3uText.split('\n');
      let currentName = '';

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          currentName = line.split(',')[1] || 'Canale';
        } else if (line && !line.startsWith('#')) {
          const btn = document.createElement('button');
          btn.className = 'channel-btn';
          btn.innerText = currentName || 'Canale';
          const streamUrl = line;
          btn.onclick = () => playChannel(streamUrl);
          listEl.appendChild(btn);
          currentName = '';
        }
      });
    }

    loadChannels();
  </script>
</body>
</html>
