<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Multi-Player IPTV MPD ClearKey</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #0f0f0f; color: white; font-family: sans-serif; overflow: hidden; }
    
    #sidebar { width: 300px; background: #181818; overflow-y: auto; padding: 12px; border-right: 1px solid #282828; display: flex; flex-direction: column; gap: 10px; }
    #sidebar h3 { font-size: 13px; text-transform: uppercase; color: #aaa; }
    
    .url-box { display: flex; gap: 6px; }
    .url-input { flex: 1; background: #222; border: 1px solid #333; color: white; padding: 8px; border-radius: 4px; font-size: 12px; }
    .btn-load { background: #007acc; border: none; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

    #drop-zone { border: 2px dashed #444; border-radius: 6px; padding: 10px; text-align: center; background: #222; cursor: pointer; font-size: 11px; color: #aaa; }
    #channels-list { flex: 1; overflow-y: auto; }
    
    .channel-btn { width: 100%; padding: 10px 12px; margin-bottom: 6px; background: #222; border: 1px solid #333; color: white; text-align: left; cursor: pointer; border-radius: 6px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .channel-btn:hover { background: #007acc; border-color: #007acc; }

    #grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 6px; background: #000; }
    .player-box { background: #121212; position: relative; border: 2px solid #222; border-radius: 6px; overflow: hidden; }
    .player-box.selected { border-color: #007acc; }
    
    iframe { width: 100%; height: 100%; border: none; }
    .slot-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; pointer-events: none; z-index: 20; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Playlist MPD (F1)</h3>
    <div class="url-box">
      <input type="text" id="m3u-url" class="url-input" placeholder="URL Playlist">
      <button class="btn-load" onclick="fetchPlaylistFromUrl()">Ricarica</button>
    </div>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">📂 Oppure trascina qui il file .m3u</div>
    <input type="file" id="file-input" accept=".m3u,.m3u8" style="display: none;">

    <div id="channels-list"></div>
  </div>

  <div id="grid">
    <div class="player-box selected" onclick="selectSlot(0)">
      <iframe id="iframe-0" src="player.html"></iframe>
      <div class="slot-label">SCHERMO 1</div>
    </div>
    <div class="player-box" onclick="selectSlot(1)">
      <iframe id="iframe-1" src="player.html"></iframe>
      <div class="slot-label">SCHERMO 2</div>
    </div>
    <div class="player-box" onclick="selectSlot(2)">
      <iframe id="iframe-2" src="player.html"></iframe>
      <div class="slot-label">SCHERMO 3</div>
    </div>
    <div class="player-box" onclick="selectSlot(3)">
      <iframe id="iframe-3" src="player.html"></iframe>
      <div class="slot-label">SCHERMO 4</div>
    </div>
  </div>

  <script>
    const DEFAULT_GIST_URL = "https://gist.github.com/Leinadf1/4246b01b8870f49e2cfa50fda49a767e";
    let activeSlot = 0;

    function selectSlot(index) {
      activeSlot = index;
      document.querySelectorAll('.player-box').forEach((box, i) => {
        box.classList.toggle('selected', i === index);
      });
    }

    function playChannel(channel) {
      const targetIframe = document.getElementById(`iframe-${activeSlot}`);
      if (targetIframe && targetIframe.contentWindow) {
        // Invia il canale all'iframe selezionato
        targetIframe.contentWindow.postMessage({
          type: 'PLAY_CHANNEL',
          channel: channel
        }, '*');
      }
    }

    async function fetchPlaylistFromUrl(customUrl = null) {
      let url = customUrl || document.getElementById('m3u-url').value.trim();
      if (!url) return;

      if (url.includes('gist.github.com') && !url.includes('/raw')) {
        url = url.replace('gist.github.com', 'gist.githubusercontent.com') + '/raw';
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Impossibile scaricare la lista');
        const text = await response.text();
        const channels = parseM3U(text);
        renderChannels(channels);
      } catch (err) {
        console.error("Errore nel caricamento dell'URL:", err);
      }
    }

    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      const channels = [];
      let currentName = '', currentKeyId = '', currentKey = '';

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const parts = line.split(',');
          currentName = parts[parts.length - 1] || 'Canale';
          currentKeyId = ''; currentKey = '';
        } else if (line.includes('license_key=')) {
          const keyPair = line.split('license_key=')[1].trim();
          const [kId, kVal] = keyPair.split(':');
          currentKeyId = kId; currentKey = kVal;
        } else if (line.endsWith('.mpd') || (line.includes('.mpd?') && !line.startsWith('#'))) {
          channels.push({ name: currentName, url: line, keyId: currentKeyId, key: currentKey });
          currentName = '';
        }
      });
      return channels;
    }

    function renderChannels(channels) {
      const listEl = document.getElementById('channels-list');
      listEl.innerHTML = '';
      channels.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        btn.innerText = ch.name;
        btn.onclick = () => playChannel(ch);
        listEl.appendChild(btn);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('m3u-url').value = DEFAULT_GIST_URL;
      fetchPlaylistFromUrl(DEFAULT_GIST_URL);
    });
  </script>
</body>
</html>
