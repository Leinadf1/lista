<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html, .shaka-video-container { width: 100%; height: 100%; background: #000; overflow: hidden; }
    video { width: 100% !important; height: 100% !important; object-fit: contain; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <script>
    shaka.polyfill.installAll();
    let player, ui;

    async function init() {
      const video = document.getElementById('video');
      const container = document.getElementById('container');

      player = new shaka.Player(video);
      ui = new shaka.ui.Overlay(player, container, video);

      // Filtro di rete per ripulire la richiesta ed evitare i blocchi di sessione
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Disabilita l'invio automatizzato di cookie che causano il blocco 400
        request.allowCredentials = false;
      });

      player.configure({
        manifest: { 
          dash: { 
            ignoreMinBufferTime: true,
            autoCorrectDrift: true
          } 
        },
        streaming: { 
          bufferBehind: 10, 
          bufferingGoal: 5,
          rebufferingGoal: 2,
          jumpLargeGaps: true
        }
      });

      window.addEventListener('message', async (e) => {
        if (!e.data || e.data.type !== 'PLAY_CHANNEL') return;
        
        const { url, keyId, key } = e.data.channel;
        try {
          await player.unload();
          
          player.configure({
            drm: { clearKeys: (keyId && key) ? { [keyId]: key } : {} }
          });
          
          await player.load(url);
          video.play();
        } catch (err) {
          console.error("Errore caricamento player:", err);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
