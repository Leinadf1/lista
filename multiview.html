<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Multiview 2×2</title>
<link rel="preload" href="https://raw.githubusercontent.com/Leinadf1/lista/main/Formula1-Bold_web_0.ttf" as="font" type="font/ttf" crossorigin>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
@font-face {
  font-family: 'Formula1 Display Bold';
  src: url('https://raw.githubusercontent.com/Leinadf1/lista/main/Formula1-Bold_web_0.ttf') format('truetype');
  font-weight: bold; font-style: normal; font-display: swap;
}
.material-icons {
  font-family: 'Material Icons' !important;
  font-weight: normal !important; font-style: normal !important;
  font-size: 24px; line-height: 1; letter-spacing: normal;
  text-transform: none; display: inline-block; white-space: nowrap;
  word-wrap: normal; direction: ltr;
  -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { margin: 0; height: 100%; background: #000; }
body {
  margin: 0; height: 100dvh; background: #000; color: #c9d1d9;
  font-family: 'Formula1 Display Bold', 'Inter', sans-serif;
  overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; }
img { display: block; }

#mv-header {
  flex: 0 0 auto; height: 38px; display: flex; align-items: center;
  gap: 6px; padding: 0 10px; background: #050505; border-bottom: 1px solid #111;
}
#mv-header .mv-title { font-size: 12px; font-weight: 800; color: #888; letter-spacing: .8px; text-transform: uppercase; }
#mv-header .mv-src {
  font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 11px;
  background: #111; color: #666; max-width: 180px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#mv-header .mv-src.custom { color: #e0b400; }
#mv-header .mv-spacer { flex: 1; }
.mv-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; background: #111; color: #aaa;
  border: 1px solid #222; border-radius: 12px;
  font-size: 11px; font-weight: 700; letter-spacing: .4px;
  transition: background .15s; white-space: nowrap;
}
.mv-btn:hover { background: #1a1a1a; color: #fff; }

#mv-main { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; }
#mv-grid {
  flex: 1; display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 2px; background: #141414; min-width: 0; min-height: 0;
}
#mv-grid:fullscreen, #mv-grid:-webkit-full-screen { width: 100vw; height: 100vh; gap: 2px; background: #141414; }

.mv-tile { position: relative; background: #000; overflow: hidden; min-width: 0; min-height: 0; }
.mv-tile.empty {
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; background: #0a0a0a;
}
.mv-tile.empty:hover { background: #111; }
.mv-add-inner { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #444; pointer-events: none; }
.mv-add-circle {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid #333;
  color: #666; font-size: 24px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
}
.mv-add-label { font-size: 10px; letter-spacing: .8px; text-transform: uppercase; font-weight: 700; }

.mv-video-layer { position: absolute; inset: 0; background: #000; overflow: hidden; }
.mv-video-layer .shaka-container { position: relative; width: 100%; height: 100%; background: #000; }
.mv-video-layer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

/* ★ Click-shield: copre SOLO i tile inattivi per intercettare il click audio ★ */
.mv-click-shield {
  position: absolute;
  inset: 0;
  z-index: 7;
  background: transparent;
  cursor: pointer;
}

.mv-ui {
  position: absolute; top: 0; left: 0; right: 0; z-index: 8;
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
.mv-tile.ui-active .mv-ui { opacity: 1; pointer-events: auto; }
.mv-ui-name {
  flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: #fff;
  letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 1px 3px rgba(0,0,0,.9);
}
.mv-ui-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.mv-ibtn {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,.12); color: #fff;
  font-size: 12px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; border: 1px solid rgba(255,255,255,.1);
  transition: background .15s, transform .15s;
}
.mv-ibtn:hover { background: rgba(255,255,255,.28); transform: scale(1.08); }
.mv-ibtn.close:hover { background: #c00; border-color: #c00; }

.mv-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px;
  background: #000; z-index: 5; color: #666;
  font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
}
.mv-loading.hidden { display: none; }
.mv-spinner {
  width: 28px; height: 28px; border: 2px solid #222; border-top-color: #58a6ff;
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.mv-err {
  position: absolute; inset: 0; z-index: 9;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 14px; text-align: center;
  background: rgba(0,0,0,.92); color: #ff9999; font-size: 12px;
}
.mv-err.hidden { display: none; }
.mv-err-actions { display: flex; gap: 6px; }
.mv-err-btn {
  padding: 5px 12px; border-radius: 5px; font-size: 11px; font-weight: 700;
  border: 1px solid #333; background: #111; color: #fff;
}
.mv-err-btn.retry { background: #0a3; border-color: #0a3; }

/* Shaka UI compact */
.shaka-current-time, .shaka-duration, .shaka-current-time-divider,
.shaka-overflow-menu button span, .shaka-settings-menu button span,
.shaka-back-to-overflow-button span {
  font-family: 'Formula1 Display Bold', 'Inter', sans-serif !important;
}
.mv-tile .shaka-video-container { border-radius: 0 !important; width: 100% !important; height: 100% !important; position: relative !important; }
.mv-tile .shaka-video-container video { position: static !important; width: 100% !important; height: 100% !important; object-fit: contain !important; background: #000 !important; display: block !important; }
.mv-tile .shaka-scrim-container { background: linear-gradient(transparent, rgba(0,0,0,.7)) !important; }
.mv-tile .shaka-controls-container .shaka-bottom-controls { padding: 0 6px 4px 6px !important; }
.mv-tile .shaka-controls-container .shaka-controls-button-panel button { padding: 0 !important; margin: 0 2px !important; width: 24px !important; height: 24px !important; min-width: 24px !important; }
.mv-tile .shaka-controls-container .shaka-controls-button-panel button i.material-icons { font-size: 17px !important; width: 17px !important; height: 17px !important; }
.mv-tile .shaka-current-time, .mv-tile .shaka-duration, .mv-tile .shaka-current-time-divider { font-size: 10.5px !important; font-weight: 700 !important; padding: 0 2px !important; line-height: 1 !important; }
.mv-tile .shaka-controls-container .shaka-seek-bar-container { margin: 3px 6px 0 !important; height: 3px !important; min-height: 3px !important; }
.mv-tile .shaka-controls-container .shaka-range-container, .mv-tile .shaka-controls-container .shaka-range-element { height: 3px !important; min-height: 3px !important; }
.mv-tile .shaka-controls-container .shaka-seek-bar-container .shaka-range-element::-webkit-slider-thumb { width: 11px !important; height: 11px !important; margin-top: -4px !important; }
.mv-tile .shaka-controls-container .shaka-overflow-menu, .mv-tile .shaka-controls-container .shaka-settings-menu { font-size: 11px !important; padding: 3px !important; }
.mv-tile .shaka-controls-container .shaka-overflow-menu button, .mv-tile .shaka-controls-container .shaka-settings-menu button { padding: 6px 10px !important; font-size: 11px !important; height: auto !important; line-height: 1.2 !important; }
.mv-tile .shaka-play-button-container { width: 50px !important; height: 50px !important; }
.mv-tile .shaka-play-button-container svg, .mv-tile .shaka-play-button-container i.material-icons { width: 24px !important; height: 24px !important; font-size: 24px !important; }
.mv-tile .shaka-play-button-container .shaka-play-button { background: rgba(255,255,255,.9) !important; color: #000 !important; padding: 12px !important; }
.mv-tile .shaka-cast-button, .mv-tile .shaka-pip-button, .mv-tile .shaka-airplay-button,
.mv-tile .shaka-playbackrate-button, .mv-tile .shaka-client-side-ad-ui, .mv-tile .shaka-ad-controls { display: none !important; }
.mv-tile .shaka-volume-bar-container { width: 44px !important; }

/* Modali */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 14px; }
.modal-mask.hidden { display: none; }
.modal-box { background: #0d1117; border: 1px solid #30363d; border-radius: 12px; padding: 18px; max-width: 700px; width: 100%; max-height: 90dvh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.modal-head h3 { margin: 0; font-size: 15px; font-weight: 800; color: #f0f6fc; }
.modal-head .sub { font-size: 11.5px; color: #8b949e; margin-top: 3px; }
.modal-close { background: rgba(255,255,255,.06); color: #c9d1d9; border-radius: 50%; width: 28px; height: 28px; font-size: 17px; line-height: 1; flex: 0 0 auto; }
.modal-close:hover { background: rgba(255,255,255,.14); color: #fff; }
.pick-search { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #8b949e; margin-bottom: 10px; }
.pick-search input { flex: 1; background: none; border: none; outline: none; color: #f0f6fc; font-size: 13.5px; font-family: inherit; min-width: 0; }
.pick-list { flex: 1; overflow-y: auto; padding-right: 4px; min-height: 200px; }
.pick-cat { font-size: 10.5px; font-weight: 800; color: #f1e05a; text-transform: uppercase; letter-spacing: 1px; padding: 12px 4px 6px; border-bottom: 1px solid #21262d; margin-bottom: 6px; display: flex; justify-content: space-between; }
.pick-cat small { color: #8b949e; font-weight: 600; }
.pick-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; background: none; border: 1px solid transparent; border-radius: 8px; color: #c9d1d9; text-align: left; font-size: 13px; font-family: inherit; transition: background .12s; }
.pick-row:hover:not(:disabled) { background: #161b22; border-color: #30363d; color: #f0f6fc; }
.pick-row:disabled { opacity: .35; cursor: not-allowed; }
.pick-row img { width: 30px; height: 30px; object-fit: contain; flex: 0 0 auto; }
.pick-row .pick-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.pick-row .pick-inuse { font-size: 10.5px; color: #8b949e; font-weight: 500; }
.pick-empty { text-align: center; color: #6a737d; padding: 40px 10px; font-style: italic; font-size: 12.5px; }
.src-opt { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
.src-opt:hover { border-color: #58a6ff; }
.src-opt input[type=radio] { accent-color: #58a6ff; }
.src-opt.col { flex-direction: column; align-items: stretch; gap: 8px; }
.src-opt-row { display: flex; align-items: center; gap: 10px; }
.src-url { width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #f0f6fc; padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; display: none; }
.src-url.active { display: block; }
.src-url:focus { border-color: #58a6ff; }
.src-hint { font-size: 11px; color: #8b949e; margin-top: 8px; line-height: 1.5; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; padding-top: 12px; border-top: 1px solid #21262d; }
.err-text { color: #ff7b7b; font-size: 11.5px; margin-top: 8px; min-height: 15px; }

@media (max-width: 700px), (pointer: coarse) {
  #mv-header { height: 34px; gap: 4px; padding: 0 8px; }
  .mv-title { display: none; }
  .mv-btn { padding: 4px 9px; font-size: 10px; }
  .mv-src { max-width: 110px; font-size: 9.5px; }
  .mv-ui { opacity: 1; pointer-events: auto; background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent); }
  .mv-ui-name { font-size: 11px; }
  .mv-ibtn { width: 22px; height: 22px; font-size: 11px; }
}
</style>
</head>
<body>

<header id="mv-header">
  <span class="mv-title">⊞ Multiview</span>
  <span class="mv-src" id="srcBadge">Sorgente non impostata</span>
  <span class="mv-spacer"></span>
  <button class="mv-btn" id="btnReloadAll" title="Ricarica tutti">🔄</button>
  <button class="mv-btn" id="btnSource" title="Sorgente canali">⚙️</button>
  <button class="mv-btn" id="btnFullscreen" title="Fullscreen (F)">⛶</button>
</header>

<main id="mv-main"><div id="mv-grid"></div></main>

<div class="modal-mask hidden" id="pickerModal">
  <div class="modal-box">
    <div class="modal-head">
      <div><h3 id="pickerTitle">Scegli canale</h3><div class="sub">Seleziona cosa trasmettere in questo riquadro</div></div>
      <button class="modal-close" id="pickerClose">×</button>
    </div>
    <div class="pick-search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="pickerSearch" placeholder="Cerca per nome o categoria…" autocomplete="off">
    </div>
    <div class="pick-list" id="pickerList"></div>
  </div>
</div>

<div class="modal-mask hidden" id="sourceModal">
  <div class="modal-box" style="max-width:500px">
    <div class="modal-head">
      <div><h3>Sorgente canali</h3><div class="sub">Scegli da dove caricare la lista</div></div>
      <button class="modal-close" id="sourceClose">×</button>
    </div>
    <label class="src-opt"><input type="radio" name="srcType" value="backend"><span>Backend del sito <small style="color:#8b949e">(password richiesta)</small></span></label>
    <label class="src-opt col">
      <span class="src-opt-row"><input type="radio" name="srcType" value="url"><span>URL M3U personalizzato</span></span>
      <input type="text" class="src-url" id="srcUrl" placeholder="https://esempio.com/lista.m3u">
    </label>
    <div class="src-hint">Con <strong>Backend</strong> usi i canali del sito.<br>Con <strong>URL M3U</strong> puoi usare qualsiasi lista pubblica.</div>
    <div class="err-text" id="srcErr"></div>
    <div class="modal-actions">
      <button class="mv-btn" id="srcCancel">Annulla</button>
      <button class="mv-btn" id="srcSave" style="background:#0a3;color:#fff;border-color:#0a3;font-weight:800;">Salva e carica</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   MULTIVIEW v11 — click-audio via shield, mute sync via setMuted
   ============================================================ */

const IFRAME_GROUPS = ['PRIME VIDEO', 'DAZN PRIMEVIDEO DE'];
const SOURCE_KEY = 'mv_source_v11';
const PROXY_BASE = 'https://dazn-ua-proxy.stefanoaccuont.workers.dev/';
const proxyCategories = ['serie bkt','laliga ea sports','serie a enilive','amichevoli','jupiler pro league','liga portugal betclic','nerozone','dazn nerozone'];
const UI_HIDE_MS = 3000;

let allChannels = [];
let tiles = [null, null, null, null];
let activeAudio = -1;
let pickSlot = -1;
let sourceConfig = null;

const $ = id => document.getElementById(id);
const normalizeName = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/gi, '');
function decodeBase64UTF8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const shouldUseIframe = ch => IFRAME_GROUPS.includes((ch.group || '').toUpperCase().trim());
function buildIframeSrc(ch) {
  const e = Object.entries(ch.drm || {})[0];
  if (!e || !ch.url) return null;
  const [kid, key] = e;
  const p = new URLSearchParams({'embed-url': ch.url, 'kid': kid, 'key': key, 'autoplay': 'true', 'live': 'true', 'start': 'live', 'startAt': 'live', 'start-at': 'live', 'starttime': 'live', 'seekable': 'false', 'dvr': 'false'});
  return `https://hugoedgar.com/drm-player/?${p.toString()}`;
}

/* SORGENTE */
function loadSourceConfig() {
  try { sourceConfig = JSON.parse(localStorage.getItem(SOURCE_KEY) || 'null'); } catch (e) { sourceConfig = null; }
  updateSrcBadge();
}
function saveSourceConfig(cfg) { sourceConfig = cfg; localStorage.setItem(SOURCE_KEY, JSON.stringify(cfg)); updateSrcBadge(); }
function updateSrcBadge() {
  const el = $('srcBadge');
  if (!sourceConfig) { el.textContent = 'Sorgente non impostata'; el.classList.remove('custom'); return; }
  if (sourceConfig.type === 'backend') { el.textContent = 'Backend sito'; el.classList.remove('custom'); }
  else { try { el.textContent = 'M3U · ' + new URL(sourceConfig.url).hostname; } catch (e) { el.textContent = 'M3U personalizzato'; } el.classList.add('custom'); }
}
async function fetchM3UFromSource(cfg) {
  if (cfg.type === 'backend') {
    const psw = prompt("Password per il backend del sito:");
    if (!psw) throw new Error('Password richiesta');
    const r = await fetch('/api/get-list', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: psw }) });
    if (!r.ok) throw new Error('Password errata o sessione già attiva');
    return decodeBase64UTF8(await r.text());
  }
  const r = await fetch(cfg.url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.text();
}

/* PARSER M3U */
function parseM3U(m3u) {
  const out = [];
  const lines = m3u.split('\n');
  let ch = { name:'', logo:'', group:'LISTA', drm:{}, url:'', streamHeaders:{}, userAgent:null, tvgId:null, id:'' };
  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
      const val = line.split('=').slice(1).join('=');
      try { ch.drm = JSON.parse(val); } catch (e) { const parts = val.split(':'); if (parts.length === 2) ch.drm[parts[0].toLowerCase()] = parts[1].toLowerCase(); }
    } else if (line.startsWith('#KODIPROP:inputstream.adaptive.stream_headers=')) {
      const val = line.split('=').slice(1).join('=');
      if (val) val.split('&').forEach(p => { const [k, v] = p.split('='); if (k && v) ch.streamHeaders[k.trim()] = v.trim(); });
    } else if (line.startsWith('#EXTVLCOPT:http-user-agent=')) {
      ch.userAgent = line.substring(line.indexOf('=') + 1).trim();
    } else if (line.startsWith('#EXTINF:')) {
      const logo = line.match(/tvg-logo="([^"]+)"/i), group = line.match(/group-title="([^"]+)"/i), name = line.match(/,(.*)$/), tvgId = line.match(/tvg-id="([^"]+)"/i);
      if (logo) ch.logo = logo[1];
      if (group) ch.group = group[1];
      if (name) ch.name = name[1].trim();
      if (tvgId) ch.tvgId = tvgId[1];
      const nn = normalizeName(ch.name);
      if (nn === 'skyunoplus') ch.tvgId = 'Sky.Uno.+..it';
      else if (nn === 'skyuno') ch.tvgId = 'Sky.Uno.it';
      else if (nn === 'skycinemastories') ch.tvgId = 'Sky.Cinema.Due.it';
    } else if (line.startsWith('http')) {
      let url = line;
      const gN = (ch.group || '').toLowerCase().replace(/[\s\-_]/g, ''), nN = (ch.name || '').toLowerCase().replace(/[\s\-_]/g, '');
      const isNero = gN.includes('nerozone') || nN.includes('nerozone') || gN.includes('daznnero') || nN.includes('daznnero');
      const isDazn1 = nN === 'dazn1' && gN === 'daznlineari';
      const isDaznSvi = gN.includes('daznsvizzeri'), isDaznPVDE = gN.includes('daznprimevideode'), isDaznAny = gN.includes('dazn') || nN.includes('dazn');
      const isProxyCat = proxyCategories.includes((ch.group || '').toLowerCase().trim());
      if (!url.startsWith(PROXY_BASE) && (isProxyCat || isNero || (!isDazn1 && !isDaznSvi && !isDaznPVDE && isDaznAny))) url = PROXY_BASE + url;
      ch.url = url;
      ch.id = `${ch.name}|${ch.group}|${url}`;
      out.push({ ...ch });
      ch = { name:'', logo:'', group:'LISTA', drm:{}, url:'', streamHeaders:{}, userAgent:null, tvgId:null, id:'' };
    }
  }
  return out;
}
async function initFromSource(cfg, silent) {
  const m3u = await fetchM3UFromSource(cfg);
  const parsed = parseM3U(m3u);
  if (!parsed.length) throw new Error('Nessun canale trovato');
  allChannels = parsed;
  if (!silent) saveSourceConfig(cfg);
  console.log(`[MV] ${parsed.length} canali caricati`);
}

/* IFRAME */
function sendIframeLive(fr) {
  if (!fr || !fr.contentWindow) return;
  const msgs = [{type:'seek',value:'live'}, {type:'seekToLive'}, {type:'goToLive'}, {action:'live'}, {action:'goToLive'}, {command:'live'}, {type:'liveEdge'}, {type:'live'}, {method:'live'}];
  msgs.forEach(m => { try { fr.contentWindow.postMessage(m,'*'); } catch(e){} });
}
function startIframeLiveLoop(fr) {
  let n = 0;
  const iv = setInterval(() => { const still = tiles.some(t => t && t.iframe === fr); if (!still || n >= 30) { clearInterval(iv); return; } sendIframeLive(fr); n++; }, 500);
  [100, 800, 1500, 3000].forEach(d => setTimeout(() => sendIframeLive(fr), d));
}

/* GRID */
function renderGrid() {
  const g = $('mv-grid');
  g.innerHTML = '';
  for (let i = 0; i < 4; i++) g.appendChild(buildTileEl(i));
}

function buildTileEl(idx) {
  const t = tiles[idx];
  const ch = t && t.ch;
  const el = document.createElement('div');
  el.className = 'mv-tile' + (ch ? '' : ' empty');
  el.dataset.slot = idx;

  if (!ch) {
    el.innerHTML = `<div class="mv-add-inner"><div class="mv-add-circle">+</div><div class="mv-add-label">Riquadro ${idx+1}</div></div>`;
    el.addEventListener('click', () => openPicker(idx));
    return el;
  }

  el.innerHTML = `
    <div class="mv-video-layer"></div>
    <div class="mv-ui">
      <span class="mv-ui-name">${esc(ch.name)}</span>
      <div class="mv-ui-actions">
        <button class="mv-ibtn" data-act="reload" title="Ricarica">🔄</button>
        <button class="mv-ibtn" data-act="swap" title="Cambia canale">⇄</button>
        <button class="mv-ibtn close" data-act="remove" title="Rimuovi">×</button>
      </div>
    </div>
    <div class="mv-loading"><div class="mv-spinner"></div><span>Connessione…</span></div>
    <div class="mv-err hidden"></div>
  `;

  if (t && t.container) el.querySelector('.mv-video-layer').appendChild(t.container);
  if (t && t.iframe) el.querySelector('.mv-video-layer').appendChild(t.iframe);

  bindTileEvents(el, idx);

  // ★ Se NON è il tile attivo → aggiungi shield ★
  if (activeAudio !== idx) {
    addShield(el, idx);
  }

  return el;
}

function addShield(el, idx) {
  const shield = document.createElement('div');
  shield.className = 'mv-click-shield';
  shield.addEventListener('click', e => {
    e.stopPropagation();
    e.preventDefault();
    setAudio(idx);
    activateUI(el);
  });
  el.appendChild(shield);
}

function bindTileEvents(el, idx) {
  el.addEventListener('mousemove', () => activateUI(el));
  el.addEventListener('touchstart', () => activateUI(el), { passive: true });
  el.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (btn) {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'reload') reloadTile(idx);
      else if (act === 'swap') openPicker(idx);
      else if (act === 'remove') removeTile(idx);
      activateUI(el);
      return;
    }
    activateUI(el);
  });
}

function activateUI(el) {
  el.classList.add('ui-active');
  clearTimeout(el._uiTimer);
  el._uiTimer = setTimeout(() => el.classList.remove('ui-active'), UI_HIDE_MS);
}

/* TILE */
function newTileObj(ch) { return { ch, video: null, player: null, ui: null, controls: null, container: null, iframe: null, loading: false, recovering: false }; }
function destroyTile(t) {
  if (!t) return;
  try { if (t.player) t.player.destroy(); } catch (e) {}
  t.player = null; t.ui = null; t.controls = null;
  if (t.iframe) { try { t.iframe.remove(); } catch(e){} }
  t.iframe = null;
  if (t.video) { try { t.video.pause(); t.video.src = ''; t.video.load(); } catch(e){} }
  t.video = null; t.container = null;
}
function removeTile(idx) {
  if (tiles[idx]) destroyTile(tiles[idx]);
  tiles[idx] = null;
  if (activeAudio === idx) activeAudio = -1;
  refreshSlot(idx);
  if (activeAudio < 0) {
    const firstWithCh = tiles.findIndex(x => x && x.ch);
    if (firstWithCh >= 0) setAudio(firstWithCh);
  } else applyAudioState();
}
function reloadTile(idx) {
  const t = tiles[idx];
  if (!t || !t.ch) return;
  const ch = t.ch;
  destroyTile(t);
  tiles[idx] = newTileObj(ch);
  refreshSlot(idx);
  loadTile(idx, ch);
}
function refreshSlot(idx) {
  const old = document.querySelector(`.mv-tile[data-slot="${idx}"]`);
  const nw = buildTileEl(idx);
  if (old) old.replaceWith(nw);
}

async function loadTile(idx, ch) {
  const t = tiles[idx];
  if (!t || t.loading) return;
  t.loading = true;
  const el = document.querySelector(`.mv-tile[data-slot="${idx}"]`);
  if (!el) { t.loading = false; return; }
  const loading = el.querySelector('.mv-loading');
  const errBox = el.querySelector('.mv-err');
  if (loading) loading.classList.remove('hidden');
  if (errBox) errBox.classList.add('hidden');

  if (t.iframe) { try { t.iframe.remove(); } catch(e){} t.iframe = null; }
  if (t.player) { try { t.player.destroy(); } catch(e){} t.player = null; }

  const layer = el.querySelector('.mv-video-layer');
  if (!layer) { t.loading = false; return; }

  // IFRAME
  if (shouldUseIframe(ch)) {
    const src = buildIframeSrc(ch);
    if (!src) { t.loading = false; if (loading) loading.classList.add('hidden'); showTileError(idx, 'Parametri DRM mancanti', false); return; }
    const fr = document.createElement('iframe');
    fr.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
    fr.setAttribute('allowfullscreen', '');
    fr.src = src;
    t.iframe = fr;
    layer.appendChild(fr);
    fr.addEventListener('load', () => startIframeLiveLoop(fr));
    startIframeLiveLoop(fr);
    if (loading) loading.classList.add('hidden');
    t.loading = false;
    return;
  }

  // SHAKA
  if (!window.shaka || !shaka.Player.isBrowserSupported()) {
    t.loading = false; if (loading) loading.classList.add('hidden'); showTileError(idx, 'Shaka non supportato', false); return;
  }
  try { shaka.polyfill.installAll(); } catch (e) {}

  const container = document.createElement('div');
  container.className = 'shaka-container';
  container.setAttribute('data-shaka-player-container', '');

  const video = document.createElement('video');
  video.setAttribute('data-shaka-player', '');
  video.setAttribute('playsinline', '');
  video.setAttribute('autoplay', '');
  video.playsInline = true;
  video.autoplay = true;
  video.muted = true;

  container.appendChild(video);
  layer.appendChild(container);
  t.video = video;
  t.container = container;

  const player = new shaka.Player(video);
  t.player = player;

  try {
    const ui = new shaka.ui.Overlay(player, container, video);
    const controls = ui.getControls();
    t.ui = ui;
    t.controls = controls;
  } catch (e) { console.warn('[MV] UI Shaka init fallita:', e); }

  player.addEventListener('streaming', () => {
    if (player.isLive && player.isLive()) {
      try { const r = player.seekRange(); if (r && isFinite(r.end)) video.currentTime = r.end; } catch (e) {}
    }
  });

  player.addEventListener('error', ev => {
    const d = ev && ev.detail;
    if (d && d.severity === 2 && !t.recovering) {
      t.recovering = true;
      setTimeout(() => { t.recovering = false; reloadTile(idx); }, 2500);
    }
  });

  player.configure({
    drm: { clearKeys: ch.drm || {} },
    streaming: {
      jumpLargeGaps: true,
      liveSync: { enabled: true, targetLatency: 5, maxPlaybackRate: 1.06, minPlaybackRate: 0.94 },
      bufferingGoal: 12, rebufferingGoal: 1.5, updateIntervalSeconds: 2,
      retryParameters: { timeout: 12000, maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5 }
    },
    manifest: { retryParameters: { timeout: 12000, maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5 } }
  });
  if (ch.streamHeaders && Object.keys(ch.streamHeaders).length) {
    player.configure({ streaming: { customHttpHeaders: ch.streamHeaders } });
  }

  try {
    await player.load(ch.url);

    // ★ Applica lo stato audio tramite Shaka controls (NON toccare video.muted) ★
    applyAudioState();

    if (player.isLive()) {
      try { const r = player.seekRange(); if (r && isFinite(r.end)) video.currentTime = r.end; } catch (e) {}
    }

    const tracks = player.getAudioLanguagesAndRoles();
    const it = tracks.find(x => (x.language && (x.language.toLowerCase().startsWith('it') || x.language.toLowerCase() === 'ita')) || (x.label && x.label.toLowerCase().includes('ital')));
    if (it && it.language) { try { player.selectAudioLanguage(it.language); } catch (e) {} }

    video.play().catch(() => { video.muted = true; video.play().catch(()=>{}); });
    if (loading) loading.classList.add('hidden');
  } catch (err) {
    console.error('[MV] load tile', idx, err);
    if (loading) loading.classList.add('hidden');
    showTileError(idx, 'Riproduzione non riuscita', true);
  } finally {
    t.loading = false;
  }
}

function showTileError(idx, msg, actions) {
  const el = document.querySelector(`.mv-tile[data-slot="${idx}"]`);
  if (!el) return;
  const err = el.querySelector('.mv-err');
  if (!err) return;
  err.innerHTML = `<div>${esc(msg)}</div>${actions ? `<div class="mv-err-actions"><button class="mv-err-btn retry" data-act="reload">Riprova</button><button class="mv-err-btn" data-act="swap">Cambia</button></div>` : ''}`;
  err.classList.remove('hidden');
}

/* AUDIO — niente bordo verde, solo setMuted su controls */
function setAudio(idx) {
  activeAudio = idx;
  applyAudioState();
}
function applyAudioState() {
  tiles.forEach((t, i) => {
    if (!t) return;
    const el = document.querySelector(`.mv-tile[data-slot="${i}"]`);
    if (!el) return;
    const isAudio = (i === activeAudio);

    // Shield: rimuovi se attivo, aggiungi se inattivo
    const shield = el.querySelector('.mv-click-shield');
    if (isAudio && shield) shield.remove();
    else if (!isAudio && !shield) addShield(el, i);

    // ★ Sync mute SOLO tramite controls Shaka (o fallback video.muted)
    const muted = !isAudio;
    if (t.controls) {
      try {
        t.controls.setMuted(muted);
        if (!muted) { t.controls.setVolume(1); }
      } catch (e) {}
    } else if (t.video) {
      t.video.muted = muted;
      if (!muted) t.video.volume = 1;
    }

    // Riprendi se era in pausa e ora ha audio
    if (isAudio && t.video && t.video.paused && t.video.readyState >= 2) {
      t.video.play().catch(()=>{});
    }
  });
}

/* WATCHDOG */
const lastTimes = new Map();
const stallCounts = new Map();
setInterval(() => {
  tiles.forEach((t, i) => {
    if (!t || !t.video || !t.player || t.loading) return;
    const v = t.video;
    if (v.paused || v.ended || v.seeking || v.readyState < 2) { stallCounts.delete(i); return; }
    const cur = v.currentTime;
    const prev = lastTimes.get(i);
    lastTimes.set(i, cur);
    if (prev !== undefined && Math.abs(cur - prev) < 0.2) {
      const s = (stallCounts.get(i) || 0) + 1;
      stallCounts.set(i, s);
      if (s >= 3) {
        stallCounts.delete(i);
        try { if (t.player.isLive && t.player.isLive()) { t.player.goToLive(); v.play().catch(()=>{}); } else reloadTile(i); } catch (e) { reloadTile(i); }
      }
    } else stallCounts.delete(i);
  });
}, 3500);

/* PICKER */
function openPicker(idx) {
  pickSlot = idx;
  const t = tiles[idx];
  $('pickerTitle').textContent = t && t.ch ? `Cambia canale — Riquadro ${idx+1}` : `Scegli canale — Riquadro ${idx+1}`;
  $('pickerSearch').value = '';
  renderPicker('');
  $('pickerModal').classList.remove('hidden');
  setTimeout(() => $('pickerSearch').focus(), 60);
}
function closePicker() { $('pickerModal').classList.add('hidden'); pickSlot = -1; }
function renderPicker(q) {
  const list = $('pickerList');
  if (!allChannels.length) { list.innerHTML = `<div class="pick-empty">Nessun canale caricato. Imposta una sorgente con ⚙️</div>`; return; }
  const inUse = new Set(tiles.filter(Boolean).map(t => t.ch.id));
  q = q.trim().toLowerCase();
  const groups = new Map();
  allChannels.forEach(ch => {
    const hay = (ch.name + ' ' + ch.group).toLowerCase();
    if (q && !hay.includes(q)) return;
    const g = (ch.group || 'ALTRO').toUpperCase();
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(ch);
  });
  if (!groups.size) { list.innerHTML = `<div class="pick-empty">Nessun risultato per "${esc(q)}"</div>`; return; }
  const order = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b, 'it'));
  let html = '';
  order.forEach(g => {
    html += `<div class="pick-cat">${esc(g)} <small>${groups.get(g).length}</small></div>`;
    groups.get(g).forEach(ch => {
      const used = inUse.has(ch.id);
      html += `<button class="pick-row" data-id="${esc(ch.id)}" ${used ? 'disabled' : ''}>${ch.logo ? `<img src="${esc(ch.logo)}" onerror="this.style.display='none'">` : `<span style="width:30px;height:30px;display:inline-block"></span>`}<span class="pick-name">${esc(ch.name)}</span>${used ? '<span class="pick-inuse">già aggiunto</span>' : ''}</button>`;
    });
  });
  list.innerHTML = html;
  list.querySelectorAll('.pick-row:not([disabled])').forEach(b => {
    b.addEventListener('click', () => {
      const ch = allChannels.find(c => c.id === b.dataset.id);
      if (!ch || pickSlot < 0) return;
      const idx = pickSlot;
      closePicker();
      if (tiles[idx]) destroyTile(tiles[idx]);
      tiles[idx] = newTileObj(ch);
      refreshSlot(idx);
      loadTile(idx, ch);
      if (activeAudio < 0) setAudio(idx);
      else applyAudioState();
    });
  });
}

/* SOURCE MODAL */
function openSourceModal() {
  const err = $('srcErr'); err.textContent = '';
  const type = sourceConfig ? sourceConfig.type : 'url';
  document.querySelector(`input[name="srcType"][value="${type}"]`).checked = true;
  const url = $('srcUrl');
  url.value = sourceConfig && sourceConfig.type === 'url' ? sourceConfig.url : '';
  url.classList.toggle('active', type === 'url');
  $('sourceModal').classList.remove('hidden');
}
function closeSourceModal() { $('sourceModal').classList.add('hidden'); }
document.querySelectorAll('input[name="srcType"]').forEach(r => {
  r.addEventListener('change', () => {
    $('srcUrl').classList.toggle('active', r.value === 'url' && r.checked);
    if (r.value === 'url' && r.checked) setTimeout(() => $('srcUrl').focus(), 50);
  });
});

/* UI */
$('btnReloadAll').addEventListener('click', () => { tiles.forEach((t, i) => { if (t && t.ch) reloadTile(i); }); });
$('btnFullscreen').addEventListener('click', () => {
  const el = $('mv-grid');
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
});
$('btnSource').addEventListener('click', openSourceModal);
$('pickerClose').addEventListener('click', closePicker);
$('pickerModal').addEventListener('click', e => { if (e.target.id === 'pickerModal') closePicker(); });
$('pickerSearch').addEventListener('input', e => renderPicker(e.target.value));
$('sourceClose').addEventListener('click', closeSourceModal);
$('srcCancel').addEventListener('click', closeSourceModal);
$('sourceModal').addEventListener('click', e => { if (e.target.id === 'sourceModal') closeSourceModal(); });
$('srcSave').addEventListener('click', async () => {
  const err = $('srcErr'); err.textContent = '';
  const type = document.querySelector('input[name="srcType"]:checked').value;
  const cfg = type === 'url' ? { type: 'url', url: $('srcUrl').value.trim() } : { type: 'backend' };
  if (type === 'url' && !/^https?:\/\//i.test(cfg.url)) { err.textContent = 'Inserisci un URL valido (http/https)'; return; }
  const btn = $('srcSave'); btn.disabled = true; btn.textContent = 'Caricamento…';
  try {
    await initFromSource(cfg, false);
    for (let i = 0; i < 4; i++) { if (tiles[i]) destroyTile(tiles[i]); tiles[i] = null; }
    activeAudio = -1;
    renderGrid();
    closeSourceModal();
  } catch (e) { err.textContent = 'Errore: ' + e.message; } finally { btn.disabled = false; btn.textContent = 'Salva e carica'; }
});

/* KEYBOARD */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') { closePicker(); closeSourceModal(); }
    return;
  }
  if (e.key >= '1' && e.key <= '4') {
    e.preventDefault();
    const i = parseInt(e.key) - 1;
    if (tiles[i] && tiles[i].ch) setAudio(i);
    else if (!tiles[i]) openPicker(i);
    return;
  }
  const t = activeAudio >= 0 ? tiles[activeAudio] : null;
  const v = t && t.video;
  const p = t && t.player;

  if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault(); e.stopPropagation();
    if (v) { v.paused ? v.play().catch(()=>{}) : v.pause(); }
    return;
  }
  if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); if (v) v.currentTime = Math.max(0, v.currentTime - 10); return; }
  if (e.key === 'ArrowRight') {
    e.preventDefault(); e.stopPropagation();
    if (v) {
      let maxT = v.currentTime + 10;
      if (p && p.isLive && p.isLive()) { try { maxT = Math.min(p.seekRange().end, maxT); } catch (er) {} }
      else if (isFinite(v.duration)) maxT = Math.min(v.duration, maxT);
      v.currentTime = maxT;
    }
    return;
  }
  if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); if (v) { v.volume = Math.min(1, v.volume + 0.1); v.muted = false; if (t.controls) t.controls.setMuted(false); } return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); if (v) v.volume = Math.max(0, v.volume - 0.1); return; }
  if (e.key === 'm' || e.key === 'M') {
    if (v) {
      const newMuted = !v.muted;
      if (t.controls) { try { t.controls.setMuted(newMuted); } catch(e){} } else { v.muted = newMuted; }
    }
    return;
  }
  if (e.key === 'f' || e.key === 'F') { $('btnFullscreen').click(); return; }
  if (e.key === 'r' || e.key === 'R') { if (activeAudio >= 0) reloadTile(activeAudio); return; }
  if (e.key === 'l' || e.key === 'L') { if (p && p.isLive && p.isLive()) { try { p.goToLive(); } catch(e){} } return; }
  if (e.key === 'Escape') {
    if (!$('pickerModal').classList.contains('hidden')) closePicker();
    else if (!$('sourceModal').classList.contains('hidden')) closeSourceModal();
    else if (document.fullscreenElement) document.exitFullscreen();
  }
}, true);

/* BOOT */
(async function boot() {
  renderGrid();
  loadSourceConfig();
  if (sourceConfig) {
    try { await initFromSource(sourceConfig, true); } catch (e) { console.warn('[MV] auto-load fallito:', e); openSourceModal(); }
  } else { openSourceModal(); }
})();
</script>
</body>
