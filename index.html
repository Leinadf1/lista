<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>CHANNELS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; }
    body { background-color: var(--bg); color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .header { border-bottom: 1px solid #1e232d; padding-bottom: 15px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card { background: var(--card); border: 1px solid #1e232d; padding: 15px; cursor: pointer; border-radius: 4px; }
    .card:hover { border-color: #333; }
    .card img { max-height: 40px; margin-bottom: 10px; display: block; }
    .card .name { font-size: 13px; font-weight: bold; }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .close-btn { align-self: flex-end; margin-bottom: 10px; background: #333; color: white; border: 1px solid #444; padding: 5px 15px; cursor: pointer; }
    #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    input { background: #000; border: 1px solid #333; color: white; padding: 10px; margin-bottom: 10px; text-align: center; }
    .hidden { display: none !important; }
</style>
</head>
<body>

<div id="lock">
    <h2 style="font-size:14px; color:#444;">ACCESSO PROTETTO</h2>
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()" style="padding:10px 20px; cursor:pointer; background:var(--blue); border:none; font-weight:bold;">ENTRA</button>
</div>

<div id="app" class="hidden">
    <div class="header"><h1>📺 CHANNELS</h1></div>
    <div id="grid" class="grid"></div>
</div>

<div id="overlay">
    <div style="width: 90%; max-width: 800px; display: flex; flex-direction: column;">
        <button class="close-btn" onclick="closePlayer()">CHIUDI ✕</button>
        <div data-shaka-player-container style="width:100%; aspect-ratio:16/9;">
            <video autoplay data-shaka-player id="video" style="width:100%; height:100%;"></video>
        </div>
    </div>
</div>

<script>
const proxy = "https://corsproxy.io/?url=";
let player, controls, ui;

// Inizializzazione Shaka UI IDENTICA al tuo esempio Eurosport
async function initPlayer() {
    const video = document.getElementById('video');
    ui = video['ui'];
    controls = ui.getControls();
    player = controls.getPlayer();

    player.addEventListener('error', e => console.error('Player error:', e.detail));
}

async function play(manifest, kid, key, name) {
    document.getElementById('overlay').style.display = 'flex';
    
    // Configurazione ClearKey
    player.configure({
        drm: { clearKeys: { [kid]: key } }
    });

    try {
        // Caricamento con Proxy che ha funzionato nello screenshot
        await player.load(proxy + encodeURIComponent(manifest.trim()));
    } catch (e) {
        console.error('Errore caricamento:', e);
    }
}

function login() {
    if(document.getElementById('pw').value === "1234") {
        document.getElementById('lock').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        loadList();
    }
}

async function loadList() {
    const res = await fetch("lista_privata.m3u");
    const data = await res.text();
    const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
    const grid = document.getElementById('grid');

    blocks.forEach(b => {
        if (b.includes('#EXTINF')) {
            const name = b.split(',').pop().split('\n')[0].trim();
            const logo = b.match(/tvg-logo="([^"]+)"/)?.[1] || "";
            const url = b.match(/https?:\/\/\S+/)?.[0];
            const keys = b.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

            if (url && keys) {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => play(url, keys[1], keys[2], name);
                card.innerHTML = `<img src="${logo}" onerror="this.style.display='none'"><div class="name">${name}</div>`;
                grid.appendChild(card);
            }
        }
    });
}

function closePlayer() {
    player.unload();
    document.getElementById('overlay').style.display = 'none';
}

// Aspetta che Shaka UI sia caricata per agganciare il player
document.addEventListener('shaka-ui-loaded', initPlayer);
</script>
</body>
</html>
