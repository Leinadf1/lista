<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; --yellow: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #lock input { padding: 12px; background: #000; border: 1px solid #333; color: #fff; margin-bottom: 10px; text-align: center; }
        #lock button { padding: 10px 40px; background: var(--blue); border: none; cursor: pointer; font-weight: bold; }
        #app { display: none; }
        .header { border-bottom: 1px solid #1e232d; margin-bottom: 25px; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: var(--card); border-radius: 6px; padding: 15px; border: 1px solid #1e232d; cursor: pointer; }
        .logo-box { height: 60px; margin-bottom: 10px; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .sub { font-size: 10px; color: var(--blue); text-transform: uppercase; font-weight: bold; }
        #player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; z-index: 10000; align-items: center; justify-content: center; }
        .player-container { width: 95%; max-width: 900px; }
        .shaka-video-container { width: 100%; aspect-ratio: 16/9; }
        .shaka-range-element { color: var(--yellow) !important; } 
    </style>
</head>
<body>

<div id="lock">
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()">ENTRA</button>
</div>

<div id="app">
    <div class="header"><h1>📺 CHANNELS</h1></div>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-container">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <h3 id="p-name" style="margin:0;">Canale</h3>
            <button onclick="closePlayer()" style="background:#333; color:#fff; border:none; padding:5px 10px; cursor:pointer;">✕ CLOSE</button>
        </div>
        <div id="video-container" class="shaka-video-container"><video id="video" autoplay crossorigin="anonymous"></video></div>
    </div>
</div>

<script>
    let player, ui;

    function login() {
        if(document.getElementById('pw').value === "1234") {
            document.getElementById('lock').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadM3U();
        } else { alert("Password Errata"); }
    }

    async function loadM3U() {
        const res = await fetch("./lista_privata.m3u");
        const text = await res.text();
        const grid = document.getElementById('grid');
        const blocks = text.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');

        blocks.forEach(block => {
            if (block.includes('#EXTINF')) {
                const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                const ua = block.match(/user-agent=(.*?)\n/i)?.[1]?.trim() || "";
                const url = block.match(/https?:\/\/\S+/)?.[0];
                const name = block.split(',').pop().split('\n')[0].trim();
                const logo = block.match(/tvg-logo="(.*?)"/)?.[1] || "";
                const group = block.match(/group-title="(.*?)"/)?.[1] || "";

                if (url && keyMatch) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => play(url, name, keyMatch[1], keyMatch[2], ua);
                    card.innerHTML = `<div class="logo-box"><img src="${logo}"></div><div style="font-weight:bold">${name}</div><div class="sub">${group}</div>`;
                    grid.appendChild(card);
                }
            }
        });
    }

    async function play(url, name, kid, key, ua) {
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('p-name').innerText = name;
        const video = document.getElementById('video');

        if (player) await player.destroy();
        player = new shaka.Player(video);
        ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);
        
        // Configurazione barra gialla
        ui.configure({'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'fullscreen']});

        player.configure({ drm: { clearKeys: { [kid]: key } } });

        // Tenta col Proxy (necessario per bypassare CORS e User-Agent)
        const proxiedUrl = `/api/proxy?url=${encodeURIComponent(url)}&ua=${encodeURIComponent(ua)}`;

        try {
            await player.load(proxiedUrl);
        } catch(e) {
            console.error("Proxy fallito, provo diretto...", e.code);
            try { await player.load(url); } catch(i) { 
                alert("Errore 4000: Il file api/proxy.js non è attivo o il vercel.json manca."); 
            }
        }
    }

    function closePlayer() {
        if(player) player.destroy();
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
