<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard PRO - Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        h1 { font-size: 24px; color: #58a6ff; margin: 0; }
        #chan-count { color: #8b949e; font-weight: bold; }
        
        .player-container { width: 100%; max-width: 850px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 35px; border: 1px solid #30363d; position: sticky; top: 10px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        video { width: 100%; aspect-ratio: 16/9; }

        .category-container { width: 100%; max-width: 1200px; margin-bottom: 40px; }
        .category-title { font-size: 18px; color: #f1e05a; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; border-left: 4px solid #58a6ff; padding-left: 10px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .channel-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; cursor: pointer; transition: 0.2s; overflow: hidden; display: flex; flex-direction: column; }
        .channel-card:hover { transform: translateY(-5px); border-color: #58a6ff; }
        .channel-card.active { border: 2px solid #58a6ff; background-color: #21262d; }
        
        .logo-box { width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; background: #21262d; padding: 10px; box-sizing: border-box; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .info-box { padding: 12px; text-align: center; border-top: 1px solid #30363d; background: #161b22; min-height: 48px; display: flex; align-items: center; justify-content: center; }
        .name { font-size: 12px; font-weight: 600; color: #f0f6fc; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="header">
        <h1>Dashboard</h1>
        <div id="chan-count">Inizializzazione...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="main-list"></div>

<script>
const SOURCE_URL = "https://raw.githubusercontent.com/Leinadf1/lista/main/lista_privata.m3u";

const CANALI_FISSI = [
    { name: "EUROSPORT 4K", group: "EUROSPORT", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020019/tim-ouah/CHN43FN/MONOGRAM_ESP4K_WHITE_V2-BjK0", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport4k)/manifest.mpd", drm: {"9ceae06c6ad34aada83ba86c0b511452":"406862beb4af1ef8fe04ba15d9936360","fcd924bd2e45470fa2ae50ef05e357c0":"266db84d3572bc889185274a90ff31df","dea135e33341468f8a4e8da806d8a6e6":"fb7423db39e6fab75056f8c83f415847","31911db90ee3410f8b38e45659d01fb1":"ac316ab7dfd2b50faf6d44633e4fedd5","a16f2a39adbb4974b8910cec8a651a09":"c2d55e0111af955f47214af209a2c468"} },
    { name: "EUROSPORT 1", group: "EUROSPORT", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020000/tim-ouah/CHN43FN/MONOGRAM_ESP1_WHITE_V2-Lv2g", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport1)/manifest.mpd", drm: {"46e559c2f9f645ce8d80c7fa20446bdb":"597d214d66342ee042bccffeb165e750"} },
    { name: "EUROSPORT 2", group: "EUROSPORT", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020001/tim-ouah/CHN43FN/MONOGRAM_ESP2_WHITE_V2-Zp7E", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport2)/manifest.mpd", drm: {"e8372283a523444c84646c4172b1bc0f":"969a90e1a1a6424a68fe4b5d776368ec"} },
    { name: "EUROSPORT 3", group: "EUROSPORT", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020002/tim-ouah/CHN43FN/MONOGRAM_ESP360_WHITE_V4-yiID", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport3)/manifest.mpd", drm: {"1e2398b0eeb04829b4711e14b4a91244":"11e26659ebfecf6a22ed56da340448cd"} },
    { name: "EUROSPORT 4", group: "EUROSPORT", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020003/tim-ouah/CHN43FN/MONOGRAM_ESP360_WHITE_V4-3YSY", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport4)/manifest.mpd", drm: {"9dd7be79e44f4d08a91ec5d1553f17b8":"8a62369f81a4b6e5f2d4846f7bd5e7d1"} },
    { name: "EUROSPORT 5", group: "EUROSPORT", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020004/tim-ouah/CHN43FN/MONOGRAM_ESP360_WHITE_V4-sv5m", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport5)/manifest.mpd", drm: {"b48e7e6d96da479da65e435ce65faeb1":"48c703879ce4deedb5a2124a30a13bc4"} },
    { name: "EUROSPORT 6", group: "EUROSPORT", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020005/tim-ouah/CHN43FN/MONOGRAM_ESP360_WHITE_V4-H53i", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport6)/manifest.mpd", drm: {"ead1c567a3df48619799b2e78b18fdfa":"1de9d9af5651296aa67913979ad8c694"} }
];

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const mainList = document.getElementById('main-list');
    const countHeader = document.getElementById('chan-count');

    player.configure({ 
        streaming: { jumpLargeGaps: true },
        manifest: { dash: { ignoreMinBufferTime: true } }
    });

    const categories = {};

    function getCategoryGrid(groupName) {
        const name = (groupName || "ALTRI").toUpperCase().trim();
        if (!categories[name]) {
            const container = document.createElement('div');
            container.className = 'category-container';
            container.innerHTML = `<div class="category-title">${name}</div><div class="grid" id="grid-${name.replace(/[^A-Z0-9]/g, '-')}"></div>`;
            mainList.appendChild(container);
            categories[name] = container.querySelector('.grid');
        }
        return categories[name];
    }

    function createCard(ch) {
        const grid = getCategoryGrid(ch.group);
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `
            <div class="logo-box"><img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/100x50?text=TV'"></div>
            <div class="info-box"><div class="name">${ch.name}</div></div>
        `;
        
        card.onclick = async () => {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            try {
                await player.unload();
                if (ch.drm && Object.keys(ch.drm).length > 0) {
                    player.configure({ drm: { clearKeys: ch.drm } });
                } else {
                    player.configure({ drm: { clearKeys: {} } });
                }
                await player.load(ch.url);
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch(e) { console.error("Errore Shaka:", e); }
        };
        grid.appendChild(card);
    }

    let loadedCount = 0;

    try {
        const response = await fetch(SOURCE_URL + "?t=" + Date.now());
        const text = await response.text();
        
        // Split basato su licenza clearkey per isolare i blocchi DRM correttamente
        const sections = text.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');

        sections.forEach(section => {
            if (!section.includes('.mpd') && !section.includes('.m3u8')) return;

            // NOME: Dopo l'ultima virgola della riga EXTINF
            const nameMatch = section.match(/#EXTINF:[^,]+,(.*)/);
            let channelName = nameMatch ? nameMatch[1].split('\n')[0].trim() : "Canale";

            // URL e METADATI
            const urlMatch = section.match(/https?:\/\/[^\s"|]+/i);
            const groupMatch = section.match(/group-title="([^"]+)"/i);
            const logoMatch = section.match(/tvg-logo="([^"]+)"/i);

            // DRM: Supporto sia JSON che formato KEY:KID
            let drmKeys = {};
            const jsonMatch = section.match(/license_key=({.*?})/s);
            const pairMatch = section.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

            if (jsonMatch) {
                try { drmKeys = JSON.parse(jsonMatch[1]); } catch(e) {}
            } else if (pairMatch) {
                drmKeys[pairMatch[1].toLowerCase()] = pairMatch[2].toLowerCase();
            }

            if (urlMatch) {
                loadedCount++;
                createCard({
                    name: channelName,
                    url: urlMatch[0].trim(),
                    drm: drmKeys,
                    logo: logoMatch ? logoMatch[1] : "",
                    group: groupMatch ? groupMatch[1] : "ALTRI"
                });
            }
        });

    } catch(e) { console.error("Errore caricamento lista:", e); }

    // Carica Eurosport fissi
    CANALI_FISSI.forEach(ch => createCard(ch));

    countHeader.innerText = (loadedCount + CANALI_FISSI.length) + " CANALI PRONTI";
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
