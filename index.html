<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS WEB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>
    <style>
        :root { --bg: #0f1218; --accent: #ffcc00; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .card { background: #1c212a; border-radius: 8px; padding: 12px; border: 1px solid #2d3440; cursor: pointer; text-align: center; }
        .card img { max-width: 100%; height: 50px; object-fit: contain; }
        #player-overlay { position: fixed; inset: 0; background: black; display: none; z-index: 10000; flex-direction: column; }
        .shaka-range-element { color: var(--accent) !important; }
    </style>
</head>
<body>

<div id="grid" class="grid"></div>

<div id="player-overlay">
    <div style="padding:10px; background:#111; display:flex; justify-content:space-between; align-items:center;">
        <span id="p-name" style="font-weight:bold">Canale</span>
        <button onclick="location.reload()" style="background:red; color:white; border:none; padding:5px 15px; cursor:pointer; border-radius:4px;">CHIUDI</button>
    </div>
    <div id="video-container" style="width:100%; height:100%;"><video id="video" autoplay style="width:100%; height:100%;"></video></div>
</div>

<script>
    let player;
    // Questo è il segreto: un proxy che "finge" di essere un browser autorizzato
    const PROXY = "https://corsproxy.io/?"; 

    async function init() {
        const res = await fetch("./lista_privata.m3u");
        const data = await res.text();
        const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');

        blocks.forEach(block => {
            if (block.includes('#EXTINF')) {
                const url = block.match(/https?:\/\/\S+/)?.[0];
                const key = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                const name = block.split(',').pop().split('\n')[0].trim();
                const logo = block.match(/tvg-logo="(.*?)"/)?.[1] || "";
                const ua = block.match(/user-agent=(.*?)\n/i)?.[1]?.trim() || "";
                
                if (url && key) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<img src="${logo}"><div>${name}</div>`;
                    card.onclick = () => play(url, name, key[1], key[2], ua);
                    document.getElementById('grid').appendChild(card);
                }
            }
        });
    }

    async function play(url, name, kid, key, ua) {
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('p-name').innerText = name;
        
        const video = document.getElementById('video');
        player = new shaka.Player(video);
        const ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);
        
        // Carica le chiavi DRM
        player.configure({ drm: { clearKeys: { [kid]: key } } });

        // Forza il player a passare per il proxy esterno (bypass CORS e Errore 4000)
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            const originalUrl = request.uris[0];
            if (!originalUrl.includes(PROXY)) {
                request.uris = [PROXY + encodeURIComponent(originalUrl)];
                // Aggiungiamo lo User-Agent se presente
                if (ua) request.headers['User-Agent'] = ua;
            }
        });

        try {
            await player.load(url);
        } catch(e) {
            console.error(e);
            alert("Errore: " + e.code + ". Il flusso potrebbe essere offline.");
        }
    }

    init();
</script>
</body>
</html>
