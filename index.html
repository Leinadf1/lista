<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Single Stream Player</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">

<style>
body { background-color: #262626; color: white; font-family: Arial, sans-serif; }
.center { margin: auto; width: 50%; text-align: center; }
video { width: 100%; height: 100%; }

/* Stile per i bottoni dei canali */
.channels-container { 
    display: flex; 
    flex-wrap: wrap; 
    gap: 10px; 
    justify-content: center; 
    margin-top: 20px; 
    padding: 20px;
}
.chan-btn { 
    background: #444; 
    color: white; 
    border: 1px solid #666; 
    padding: 10px 15px; 
    cursor: pointer; 
    border-radius: 4px; 
}
.chan-btn:hover { background: #666; }
</style>
</head>

<body>
<div class="center">
    <h2 id="current-channel">Seleziona un canale</h2>
</div>

<div class="center" style="max-width:40em" data-shaka-player-container data-shaka-player-cast-receiver-id="07AEE832">
    <video autoplay data-shaka-player id="video"></video>
</div>

<div id="list" class="channels-container"></div>

<script>
// Usiamo corsproxy per evitare blocchi sui flussi m3u
const proxy = "https://corsproxy.io/?url=";

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const controls = ui.getControls();
    const player = controls.getPlayer();

    player.addEventListener('error', e => console.error('Player error:', e.detail));

    try {
        // Carichiamo la lista
        const response = await fetch('lista_privata.m3u');
        const data = await response.text();
        const container = document.getElementById('list');

        // Dividiamo la lista per blocchi (ogni blocco inizia con #EXTINF)
        const entries = data.split('#EXTINF');

        entries.forEach(entry => {
            if (entry.includes('license_key=')) {
                // Estraiamo il Nome
                const name = entry.split(',').pop().split('\n')[0].trim();
                
                // Estraiamo l'URL del video
                const urlMatch = entry.match(/https?:\/\/[^\s"|]+/);
                const url = urlMatch ? urlMatch[0] : null;

                // Estraiamo KID e KEY (license_key=KID:KEY)
                const keyMatch = entry.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                
                if (url && keyMatch) {
                    const kid = keyMatch[1];
                    const key = keyMatch[2];

                    // Creiamo il bottone
                    const btn = document.createElement('button');
                    btn.className = 'chan-btn';
                    btn.innerText = name;

                    btn.onclick = async () => {
                        document.getElementById('current-channel').innerText = name;
                        
                        // Configuriamo il player con le chiavi del canale cliccato
                        player.configure({
                            drm: { clearKeys: { [kid]: key } }
                        });

                        try {
                            // Carichiamo il flusso (usando il proxy come facevi prima per sicurezza)
                            await player.load(proxy + encodeURIComponent(url));
                            console.log('Caricato:', name);
                        } catch (e) {
                            console.error('Errore caricamento canale:', e);
                        }
                    };
                    container.appendChild(btn);
                }
            }
        });

    } catch (err) {
        console.error('Errore nel caricamento della lista m3u:', err);
    }
}

document.addEventListener('shaka-ui-loaded', init);
document.addEventListener('shaka-ui-load-failed', () => console.error('Errore caricamento Shaka UI'));
</script>
</body>
</html>
