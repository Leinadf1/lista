<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS PLAYER</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>

    <style>
        :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; --yellow: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        
        /* Schermata Login */
        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #lock input { padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px; margin-bottom: 10px; width: 220px; text-align: center; font-size: 16px; }
        #lock button { padding: 10px 40px; background: var(--blue); border: none; border-radius: 4px; font-weight: 900; cursor: pointer; color: #000; }

        /* Header stile nodrm */
        #app { display: none; }
        .header { display: flex; align-items: baseline; border-bottom: 1px solid #1e232d; margin-bottom: 25px; padding-bottom: 15px; }
        .header h1 { font-size: 20px; text-transform: uppercase; margin: 0; font-weight: 900; }
        
        /* Griglia Canali */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { 
            background: var(--card); border-radius: 6px; padding: 15px; border: 1px solid #1e232d; 
            cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; min-height: 150px; 
        }
        .card:hover { border-color: #3a4454; background: #1c222d; }
        .logo-box { height: 70px; margin-bottom: 12px; display: flex; align-items: center; justify-content: flex-start; }
        .logo-box img { max-width: 90%; max-height: 100%; object-fit: contain; }
        .name { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sub { font-size: 10px; color: var(--blue); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }

        /* Player Overlay */
        #player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; z-index: 10000; align-items: center; justify-content: center; }
        .player-container { width: 95%; max-width: 1000px; }
        .player-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { background: rgba(255,255,255,0.1); color: #ccc; border: 1px solid #444; padding: 6px 12px; cursor: pointer; font-size: 11px; font-weight: bold; border-radius: 3px; }
        
        /* Custom Shaka UI (Barra Gialla) */
        .shaka-video-container { width: 100%; aspect-ratio: 16/9; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .shaka-range-element { color: var(--yellow) !important; } 
        video { width: 100%; height: 100%; background: #000; }
    </style>
</head>
<body>

<div id="lock">
    <input type="password" id="pw" placeholder="INSERISCI PASSWORD">
    <button onclick="checkLogin()">ENTRA</button>
</div>

<div id="app">
    <div class="header"><h1>📺 CHANNELS</h1></div>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-container">
        <div class="player-nav">
            <div style="display:flex; align-items:center; gap:10px;">
                <h3 id="p-name" style="margin:0; font-size:18px;">Canale</h3>
                <span id="p-sub" class="sub"></span>
            </div>
            <button class="close-btn" onclick="closePlayer()">✕ CLOSE</button>
        </div>
        <div id="video-container" class="shaka-video-container">
            <video id="video" autoplay crossorigin="anonymous"></video>
        </div>
    </div>
</div>

<script>
    let player, ui;

    function checkLogin() {
        if(document.getElementById('pw').value === "1234") {
            document.getElementById('lock').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadChannels();
        } else {
            alert("Password Errata!");
        }
    }

    async function loadChannels() {
        try {
            const res = await fetch("./lista_privata.m3u");
            const data = await res.text();
            const grid = document.getElementById('grid');
            
            // Parsing avanzato per blocco KODIPROP
            const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
            
            blocks.forEach(block => {
                if (block.includes('#EXTINF')) {
                    const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                    const uaMatch = block.match(/user-agent=(.*?)\n/i);
                    const urlMatch = block.match(/https?:\/\/\S+/);
                    
                    if (keyMatch && urlMatch) {
                        const name = block.split(',').pop().split('\n')[0].trim();
                        const logo = block.match(/tvg-logo="(.*?)"/)?.[1] || "";
                        const group = block.match(/group-title="(.*?)"/)?.[1] || "WEB TV";
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => startPlayer(urlMatch[0], name, group, keyMatch[1], keyMatch[2], uaMatch ? uaMatch[1].trim() : "");
                        card.innerHTML = `
                            <div class="logo-box"><img src="${logo}"></div>
                            <div class="name">${name}</div>
                            <div class="sub">${group}</div>
                        `;
                        grid.appendChild(card);
                    }
                }
            });
        } catch(e) { console.error("Errore lista:", e); }
    }

    async function startPlayer(url, name, group, kid, key, ua) {
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('p-name').innerText = name;
        document.getElementById('p-sub').innerText = group;

        const video = document.getElementById('video');
        if (player) await player.destroy();
        
        player = new shaka.Player(video);
        ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);
        ui.configure({'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'fullscreen']});

        // Configurazione Chiavi DRM
        player.configure({
            drm: { clearKeys: { [kid]: key } }
        });

        // Prova caricamento (Usa proxy se fallisce per CORS/User-Agent)
        try {
            await player.load(url);
        } catch(e) {
            console.log("Tentativo con Proxy...");
            const proxiedUrl = `/api/proxy?url=${encodeURIComponent(url)}&ua=${encodeURIComponent(ua)}`;
            try {
                await player.load(proxiedUrl);
            } catch(err) {
                alert("Errore: " + err.code + ". Verifica il file api/proxy.js");
                closePlayer();
            }
        }
    }

    function closePlayer() {
        if(ui) ui.destroy();
        if(player) player.destroy();
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>

</body>
</html>
