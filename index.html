<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Single Stream Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
    .center { margin: auto; width: 60%; text-align: center; }
    video { width: 100%; height: 100%; border-radius: 8px; background: black; }
    .channels { margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; justify-content: center; }
    .btn { background: #2a2a2a; color: #eee; border: 1px solid #444; padding: 12px 5px; cursor: pointer; border-radius: 6px; font-size: 11px; font-weight: bold; transition: 0.2s; }
    .btn:hover { background: #00d2ff; color: black; border-color: white; }
</style>
</head>
<body>

<div class="center">
    <h2 id="title" style="color: #00d2ff; font-size: 1.2em;">Pronto</h2>
</div>

<div class="center" style="max-width:45em" data-shaka-player-container>
    <video autoplay data-shaka-player id="video"></video>
</div>

<div id="list" class="channels"></div>

<script>
async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    try {
        const res = await fetch('lista_privata.m3u');
        const data = await res.text();
        const container = document.getElementById('list');
        const items = data.split('#EXTINF');

        items.forEach(item => {
            if (item.includes('license_key=')) {
                // Pulizia nome: cerca solo la parte finale dopo l'ultima virgola
                let name = "Canale";
                const lines = item.split('\n');
                for (let line of lines) {
                    if (line.includes(',') && !line.includes('license_key') && !line.includes('user-agent')) {
                        name = line.split(',').pop().trim();
                        break;
                    }
                }

                const urlMatch = item.match(/https?:\/\/[^\s"|]+/);
                const url = urlMatch ? urlMatch[0] : null;
                const keys = item.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (url && keys) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = name;
                    
                    btn.onclick = async () => {
                        document.getElementById('title').innerText = "Tentativo caricamento: " + name;
                        
                        player.configure({
                            drm: { clearKeys: { [keys[1]]: keys[2] } }
                        });

                        // Funzione di caricamento con rotazione proxy
                        const tryLoad = async (proxyUrl) => {
                            try {
                                await player.load(proxyUrl + encodeURIComponent(url));
                                return true;
                            } catch (e) { return false; }
                        };

                        // Tentativo 1: Proxy Secondario (AllOrigins)
                        let success = await tryLoad("https://api.allorigins.win/raw?url=");
                        
                        // Tentativo 2: Se fallisce, prova Proxy Primario (CorsProxy con bypass)
                        if (!success) {
                            success = await tryLoad("https://corsproxy.io/?url=");
                        }

                        // Tentativo 3: Se fallisce, prova caricamento diretto (come F1 screen)
                        if (!success) {
                            try {
                                await player.load(url);
                                success = true;
                            } catch (e) { success = false; }
                        }

                        if (success) {
                            document.getElementById('title').innerText = "In riproduzione: " + name;
                        } else {
                            document.getElementById('title').innerText = "Errore di connessione (403/1001)";
                        }
                    };
                    container.appendChild(btn);
                }
            }
        });
    } catch (err) { console.error("Errore M3U"); }
}
document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
