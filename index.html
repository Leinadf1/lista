<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-shaka@1.1.1/dist/videojs-shaka.min.js"></script>
    <style>
        /* IL TUO STILE ATTUALE */
        body { background-color: #0b0e11; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .header img { width: 40px; margin-right: 15px; }
        .header h1 { font-size: 28px; letter-spacing: 1px; margin: 0; }
        
        .grid { display: flex; flex-direction: column; gap: 10px; }
        .card { 
            background-color: #1a1e26; 
            border-radius: 8px; 
            padding: 20px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid #2d3440;
            font-size: 16px;
        }

        /* OVERLAY PLAYER (STILE AMICO) */
        #player-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; align-items: center; 
            justify-content: center; z-index: 10000; 
        }
        .player-wrap { width: 95%; max-width: 900px; position: relative; }
        .close-btn { 
            position: absolute; top: -40px; right: 0; color: white; 
            background: #444; border: none; padding: 5px 15px; cursor: pointer; border-radius: 4px;
        }

        #lock { position: fixed; inset: 0; background: #0b0e11; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10001; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="lock">
    <h2 style="margin-bottom:20px;">ACCESS CONTROL</h2>
    <input type="password" id="pw" style="padding:12px; background:#1a1e26; color:white; border:1px solid #2d3440; border-radius:5px; text-align:center; margin-bottom:15px; width:250px;">
    <button onclick="login()" style="padding:12px 30px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">LOGIN</button>
</div>

<div id="app" class="hidden">
    <div class="header">
        <h1>📺 CHANNELS</h1>
    </div>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-wrap">
        <button class="close-btn" onclick="closePlayer()">✕ CLOSE</button>
        <video id="my-video" class="video-js vjs-default-skin vjs-16-9 vjs-big-play-centered" controls preload="auto"></video>
    </div>
</div>

<script>
    const PW_SECRET = "1234";
    const FILE_NAME = "lista_privata.m3u";
    let vjsPlayer;

    function login() {
        if(document.getElementById('pw').value === PW_SECRET) {
            document.getElementById('lock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            load();
        } else { alert("Access Denied"); }
    }

    async function load() {
        const res = await fetch("./" + FILE_NAME);
        const data = await res.text();
        const lines = data.split('\n');
        const container = document.getElementById('grid');

        for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes('#EXTINF')) {
                const info = lines[i];
                const name = info.split(',').pop().trim();
                const url = lines[i+1]?.trim();
                if(!url) continue;

                const kid = info.match(/#KID=([0-9a-fA-F]+)/)?.[1];
                const key = info.match(/#KEY=([0-9a-fA-F]+)/)?.[1];

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayer(url, kid, key);
                card.innerHTML = name;
                container.appendChild(card);
            }
        }
    }

    function openPlayer(url, kid, key) {
        document.getElementById('player-overlay').style.display = 'flex';
        
        // Se il player esiste già, lo distruggiamo per resettarlo
        if (vjsPlayer) { vjsPlayer.dispose(); }

        // Configurazione per MPD e Chiavi ClearKey
        const playerOptions = {
            autoplay: true,
            controls: true,
            techOrder: ['shaka'],
            shaka: {
                drm: {
                    clearKeys: (kid && key) ? { [kid]: key } : {}
                }
            }
        };

        // Creiamo il nuovo player
        vjsPlayer = videojs('my-video', playerOptions);
        vjsPlayer.src({ src: url, type: 'application/dash+xml' });
    }

    function closePlayer() {
        if (vjsPlayer) { vjsPlayer.pause(); }
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
