<!DOCTYPE html>
<html>
<head>
    <title>TV Privata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        .hidden { display: none; }
        #player { width: 100%; max-width: 700px; margin: 20px auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 20px; }
        button { background: #222; color: #fff; border: 1px solid #444; padding: 10px; cursor: pointer; border-radius: 5px; }
        input { padding: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <div id="login-section">
        <h2>Inserisci Accesso</h2>
        <input type="password" id="pw" placeholder="Password">
        <button onclick="check()">Entra</button>
    </div>

    <div id="main-section" class="hidden">
        <video id="video" controls autoplay></video>
        <div id="buttons" class="grid"></div>
    </div>

    <script>
        const passSegreta = "1234"; // CAMBIA QUESTA PASSWORD!
        const fileUrl = "lista.m3u";

        function check() {
            if(document.getElementById('pw').value === passSegreta) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                loadList();
            }
        }

        async function loadList() {
            const res = await fetch(fileUrl);
            const text = await res.text();
            const lines = text.split('\n');
            const btnContainer = document.getElementById('buttons');
            const video = document.getElementById('video');

            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF')) {
                    const name = lines[i].split(',')[1];
                    const url = lines[i+1];
                    let btn = document.createElement('button');
                    btn.innerText = name;
                    btn.onclick = () => {
                        if (Hls.isSupported()) {
                            var hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                        } else { video.src = url; }
                    };
                    btnContainer.appendChild(btn);
                }
            }
        }
    </script>
</body>
</html>
