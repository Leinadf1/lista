<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard PRO – Protected</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        /* --- STILI LOGIN (Sopra tutto) --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
        }
        .login-box {
            background: #161b22; padding: 30px; border-radius: 12px;
            border: 1px solid #30363d; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #psw-input {
            padding: 12px; width: 220px; border-radius: 6px; border: 1px solid #30363d;
            background: #0d1117; color: white; font-size: 16px; margin-bottom: 20px; outline: none;
        }
        #psw-input:focus { border-color: #58a6ff; }
        #login-btn {
            padding: 12px 30px; background: #238636; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px;
        }
        #login-btn:hover { background: #2ea043; }

        /* --- I TUOI STILI ORIGINALI --- */
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        h1 { font-size: 24px; color: #58a6ff; margin: 0; }
        #chan-count { color: #8b949e; font-weight: bold; }
        .player-container { width: 100%; max-width: 850px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 35px; border: 1px solid #30363d; }
        video { width: 100%; aspect-ratio: 16/9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .channel-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; cursor: pointer; transition: 0.2s; overflow: hidden; display: flex; flex-direction: column; }
        .channel-card:hover { transform: translateY(-5px); border-color: #58a6ff; }
        .channel-card.active { border: 2px solid #58a6ff; background-color: #21262d; }
        .logo-box { width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; background: #21262d; padding: 10px; box-sizing: border-box; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info-box { padding: 12px; text-align: center; border-top: 1px solid #30363d; }
        .name { font-size: 13px; font-weight: 600; color: #f0f6fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color: #58a6ff; margin-top: 0;">Accesso Privato</h2>
            <input type="password" id="psw-input" placeholder="Password"><br>
            <button id="login-btn" onclick="validaAccesso()">ENTRA</button>
            <p id="error-txt" style="color: #f85149; font-size: 14px; margin-top: 15px;"></p>
        </div>
    </div>

    <div id="header">
        <h1>Dashboard</h1>
        <div id="chan-count">In attesa di login...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="list" class="grid"></div>

<script>
// --- CONFIGURAZIONE PASSWORD ---
const PASSWORD_CORRETTA = "TuaPassword123"; // <--- CAMBIA QUESTA PASSWORD

function validaAccesso() {
    const input = document.getElementById('psw-input').value;
    const error = document.getElementById('error-txt');
    
    if (input === PASSWORD_CORRETTA) {
        document.getElementById('login-overlay').style.display = 'none';
        // Avvia la tua funzione init originale solo ora
        init(); 
    } else {
        error.innerText = "Password errata! Riprova.";
    }
}

// --- TUA LOGICA ORIGINALE (Inviata da te) ---
const SOURCE_URL = "https://nodrm.online/list/list2.m3u";
const PROXY_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(SOURCE_URL);

const CANALI_FISSI = [

    { name: "EUROSPORT 1", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/thumb.prod.front.tim.cptech.pro/http/unsafe/filters:format(png):anamorphosis(640,480)/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020000/tim-ouah/CHN43FN/MONOGRAM_ESP1_WHITE_V2-Lv2g", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport1)/manifest.mpd", kid: "46e559c2f9f645ce8d80c7fa20446bdb", key: "597d214d66342ee042bccffeb165e750" },
    { name: "EUROSPORT 2", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/thumb.prod.front.tim.cptech.pro/http/unsafe/filters:format(png):anamorphosis(640,480)/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020001/tim-ouah/CHN43FN/MONOGRAM_ESP2_WHITE_V2-Zp7E", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport2)/manifest.mpd", kid: "e8372283a523444c84646c4172b1bc0f", key: "969a90e1a1a6424a68fe4b5d776368ec" },
    { name: "EUROSPORT 3", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/thumb.prod.front.tim.cptech.pro/http/unsafe/filters:format(png):anamorphosis(640,480)/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020002/tim-ouah/CHN43FN/MONOGRAM_ESP360_WHITE_V4-yiID", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport3)/manifest.mpd", kid: "1e2398b0eeb04829b4711e14b4a91244", key: "11e26659ebfecf6a22ed56da340448cd" },
    { name: "EUROSPORT 4", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/thumb.prod.front.tim.cptech.pro/http/unsafe/filters:format(png):anamorphosis(640,480)/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020003/tim-ouah/CHN43FN/MONOGRAM_ESP360_WHITE_V4-3YSY", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport4)/manifest.mpd", kid: "9dd7be79e44f4d08a91ec5d1553f17b8", key: "8a62369f81a4b6e5f2d4846f7bd5e7d1" },

    { name: "EUROSPORT 6", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/thumb.prod.front.tim.cptech.pro/http/unsafe/filters:format(png):anamorphosis(640,480)/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020005/tim-ouah/CHN43FN/MONOGRAM_ESP360_WHITE_V4-H53i", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport6)/manifest.mpd", kid: "ead1c567a3df48619799b2e78b18fdfa", key: "1de9d9af5651296aa67913979ad8c694" }
];

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const container = document.getElementById('list');
    const countHeader = document.getElementById('chan-count');

    player.configure({ streaming: { jumpLargeGaps: true }, manifest: { dash: { clockSyncUri: '' } } });

    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Linux; Android 9; AFTKA Build/PS7702.4965N; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/136.0.7103.125 Mobile Safari/537.36';
    });

    function createCard(name, logo, url, drmConfig) {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `<div class="logo-box"><img src="${logo}" alt=""></div><div class="info-box"><div class="name">${name}</div></div>`;
        card.onclick = async () => {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            player.configure({ drm: { clearKeys: drmConfig } });
            try { await player.load(url); window.scrollTo({top:0, behavior:'smooth'}); } catch(e){ console.error(e); }
        };
        container.appendChild(card);
    }

    let liveCount = 0;
    try {
        const res = await fetch(PROXY_URL);
        const text = await res.text();
        const blocks = text.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');

        blocks.forEach(block => {
            if (block.includes('license_key=')) {
                const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                const urlMatch = block.match(/https?:\/\/[^\s"|]+\.mpd[^\s"|]*/i);
                const logoMatch = block.match(/tvg-logo="([^"]+)"/) || block.match(/tvg-logo=([^\s,]+)/);
                const nameMatch = block.match(/#EXTINF:[^,]+,(.*)/);

                if (keyMatch && urlMatch && nameMatch) {
                    liveCount++;
                    createCard(nameMatch[1].trim(), logoMatch ? logoMatch[1] : '', urlMatch[0], { [keyMatch[1]]: keyMatch[2] });
                }
            }
        });
    } catch (err) {
        console.error("Errore sincronizzazione live:", err);
    }

    CANALI_FISSI.forEach(ch => {
        const drm = ch.keys ? ch.keys : { [ch.kid]: ch.key };
        createCard(ch.name, ch.logo, ch.url, drm);
    });

    countHeader.innerText = (CANALI_FISSI.length + liveCount) + " CANALI CARICATI";
}

// Rimosso l'evento automatico: ora init() parte solo dopo il login
// document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
