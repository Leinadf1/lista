<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Dashboard PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">

<style>

body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }

#header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }

h1 { font-size: 24px; color: #58a6ff; margin: 0; }

#chan-count { color: #8b949e; font-size: 14px; font-weight: bold; }

.player-container { width: 100%; max-width: 850px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 40px; border: 1px solid #30363d; position: sticky; top: 10px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

video { width: 100%; aspect-ratio: 16/9; }

.category-section { width: 100%; max-width: 1200px; margin-bottom: 40px; }

.category-title { font-size: 18px; color: #f1e05a; margin-bottom: 15px; border-left: 4px solid #58a6ff; padding-left: 15px; text-transform: uppercase; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }

.card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; cursor: pointer; transition: 0.2s; overflow: hidden; display: flex; flex-direction: column; }

.card:hover { transform: translateY(-5px); border-color: #58a6ff; }

.card.active { border: 2px solid #58a6ff; background-color: #21262d; }

.logo-box { width: 100%; height: 90px; display: flex; justify-content: center; align-items: center; background: #21262d; padding: 10px; box-sizing: border-box; }

.logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

.info-box { padding: 10px; text-align: center; border-top: 1px solid #30363d; }

.name { font-size: 11px; font-weight: 600; color: #f0f6fc; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

</style>

</head>

<body>



<div id="header">

<h1>Dashboard</h1>

<div id="chan-count">SINCRONIZZAZIONE...</div>

</div>



<div class="player-container" data-shaka-player-container>

<video autoplay data-shaka-player id="video"></video>

</div>



<div id="categories-container"></div>



<script>

const SOURCE_URL = "/api/get-list";



const CANALI_FISSI = [

{ name: "EUROSPORT 4K", group: "SPORT", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/thumb.prod.front.tim.cptech.pro/http/unsafe/filters:format(png):anamorphosis(640,480)/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020019/tim-ouah/CHN43FN/MONOGRAM_ESP4K_WHITE_V2-BjK0", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport4k)/manifest.mpd", keys: {"9ceae06c6ad34aada83ba86c0b511452":"406862beb4af1ef8fe04ba15d9936360","fcd924bd2e45470fa2ae50ef05e357c0":"266db84d3572bc889185274a90ff31df","dea135e33341468f8a4e8da806d8a6e6":"fb7423db39e6fab75056f8c83f415847","31911db90ee3410f8b38e45659d01fb1":"ac316ab7dfd2b50faf6d44633e4fedd5","a16f2a39adbb4974b8910cec8a651a09":"c2d55e0111af955f47214af209a2c468"} }

// Aggiungi qui gli altri Eurosport se servono...

];



async function init() {

const video = document.getElementById('video');

const ui = video['ui'];

const player = ui.getControls().getPlayer();

const categoriesContainer = document.getElementById('categories-container');



player.configure({ streaming: { jumpLargeGaps: true } });



const categories = {};



function getOrCreateCategory(categoryName) {

const name = (categoryName || "TV").toUpperCase();

if (!categories[name]) {

const section = document.createElement('div');

section.className = 'category-section';

section.innerHTML = `<div class="category-title">${name}</div><div class="grid" id="grid-${name.replace(/\s+/g, '-')}"></div>`;

categoriesContainer.appendChild(section);

categories[name] = document.getElementById(`grid-${name.replace(/\s+/g, '-')}`);

}

return categories[name];

}



function createCard(name, logo, url, drmConfig, group) {

const grid = getOrCreateCategory(group);

const card = document.createElement('div');

card.className = 'card';

card.innerHTML = `<div class="logo-box"><img src="${logo}" onerror="this.src='https://via.placeholder.com/100x60?text=TV'"></div>

<div class="info-box"><div class="name">${name}</div></div>`;

card.onclick = async () => {

document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));

card.classList.add('active');

try {

await player.unload();

player.configure({ drm: { clearKeys: drmConfig } });

await player.load(url);

window.scrollTo({top: 0, behavior: 'smooth'});

} catch(e) { console.error("Errore:", e.code); }

};

grid.appendChild(card);

}



try {

const res = await fetch(SOURCE_URL + "?t=" + Date.now());

const text = await res.text();


// Divisione per #EXTINF (corregge il problema DAZN)

const blocks = text.split('#EXTINF');

let totalCount = 0;



blocks.forEach(block => {

if (!block.includes('.mpd')) return;



// Regex per trovare chiave e URL anche se invertiti

const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

const urlMatch = block.match(/https?:\/\/[^\s"|]+\.mpd[^\s"|]*/i);

const nameMatch = block.match(/,(.*)/);

const groupMatch = block.match(/group-title="([^"]+)"/i);

const logoMatch = block.match(/tvg-logo="([^"]+)"/i);



if (keyMatch && urlMatch && nameMatch) {

totalCount++;

const name = nameMatch[1].split('\n')[0].trim();

const drm = { [keyMatch[1].toLowerCase()]: keyMatch[2].toLowerCase() };

const group = groupMatch ? groupMatch[1] : "ALTRO";


createCard(name, logoMatch ? logoMatch[1] : '', urlMatch[0], drm, group);

}

});



CANALI_FISSI.forEach(ch => {

createCard(ch.name, ch.logo, ch.url, ch.keys ? ch.keys : { [ch.kid]: ch.key }, ch.group);

});



document.getElementById('chan-count').innerText = (totalCount + CANALI_FISSI.length) + " CANALI DISPONIBILI";

} catch(e) { console.error(e); }

}



document.addEventListener('shaka-ui-loaded', init);

</script>

</body>

</html>
