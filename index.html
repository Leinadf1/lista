<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard PRO – Live Sync</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        /* Stile scuro ispirato alle piattaforme professionali */
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
        }

        h1 { font-size: 24px; color: #58a6ff; margin: 0; text-transform: uppercase; }
        #chan-count { color: #8b949e; font-weight: bold; }

        /* Contenitore Video */
        .player-container {
            width: 100%;
            max-width: 850px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            margin-bottom: 35px;
            border: 1px solid #30363d;
        }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        /* Griglia Canali */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
        }

        /* Scheda Canale */
        .channel-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .channel-card:hover { 
            transform: translateY(-5px); 
            border-color: #58a6ff; 
            background-color: #21262d;
        }

        .channel-card.active { 
            border: 2px solid #58a6ff; 
            background-color: #21262d;
            box-shadow: 0 0 15px rgba(88,166,255,0.3);
        }

        /* Box Logo */
        .logo-box {
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #21262d;
            padding: 10px;
            box-sizing: border-box;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Info Canale */
        .info-box {
            padding: 12px;
            text-align: center;
            border-top: 1px solid #30363d;
        }

        .name { 
            font-size: 14px; 
            font-weight: 600; 
            color: #f0f6fc; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Dashboard Live</h1>
        <div id="chan-count">Sincronizzazione...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="list" class="grid"></div>

<script>
// URL della fonte tramite proxy CORS per permettere la lettura in tempo reale
const SOURCE_URL = "https://nodrm.online/list/list2.m3u";
const PROXY_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(SOURCE_URL);

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const container = document.getElementById('list');
    const countHeader = document.getElementById('chan-count');

    // Configurazione player
    player.configure({
        streaming: { jumpLargeGaps: true },
        manifest: { dash: { clockSyncUri: '' } }
    });

    // Impostazione User-Agent per simulare Firestick ed evitare blocchi
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Linux; Android 9; AFTKA Build/PS7702.4965N; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/136.0.7103.125 Mobile Safari/537.36';
    });

    try {
        // Recupero della lista in tempo reale
        const res = await fetch(PROXY_URL);
        const text = await res.text();
        
        container.innerHTML = ""; // Pulisce la griglia
        const blocks = text.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
        let channelsCount = 0;

        blocks.forEach(block => {
            if (block.includes('license_key=')) {
                // Estrazione dati
                const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                const urlMatch = block.match(/https?:\/\/[^\s"|]+\.mpd[^\s"|]*/i);
                const logoMatch = block.match(/tvg-logo="([^"]+)"/) || block.match(/tvg-logo=([^\s,]+)/);
                const nameMatch = block.match(/#EXTINF:[^,]+,(.*)/);

                if (keyMatch && urlMatch && nameMatch) {
                    channelsCount++;
                    const kid = keyMatch[1];
                    const key = keyMatch[2];
                    const url = urlMatch[0];
                    const logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150x100?text=TV';
                    const name = nameMatch[1].trim();

                    // Creazione elemento grafico (Card)
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.innerHTML = `
                        <div class="logo-box">
                            <img src="${logo}" alt="${name}" loading="lazy">
                        </div>
                        <div class="info-box">
                            <div class="name">${name}</div>
                        </div>
                    `;

                    // Gestione del click per caricare il canale
                    card.onclick = async () => {
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');

                        player.configure({
                            drm: { clearKeys: { [kid]: key } }
                        });

                        try {
                            await player.load(url);
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        } catch (e) {
                            console.error("Errore caricamento:", e.code);
                        }
                    };
                    container.appendChild(card);
                }
            }
        });
        countHeader.innerText = channelsCount + " CANALI SINCRONIZZATI";

    } catch (err) {
        countHeader.innerText = "ERRORE CONNESSIONE FONTE";
        console.error(err);
    }
}

// Avvio quando l'interfaccia Shaka è pronta
document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
