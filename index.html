<body id="mainBody" style="display:none;">

    <div id="header">

<script type="module">
let passwordGlobale = "";
let heartbeatInterval;
let lastM3UData = null;
const FAVORITES_KEY = 'favoriteChannels';
let favoriteIds = new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'));
let allChannels = [];

// -------------------- EPG --------------------
const EPG_URL = 'https://raw.githubusercontent.com/Leinadf1/lista/main/epg_ripper_IT1.xml';
let epgChannels = new Map();
let epgNames = new Set();
let epgReady = false;
let epgError = null;

function normalizeName(name) {
    return name.toLowerCase().replace(/[^a-z0-9]/gi, '');
}

function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m+1 }, () => Array(n+1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            dp[i][j] = Math.min(
                dp[i-1][j] + 1,
                dp[i][j-1] + 1,
                dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
            );
        }
    }
    return dp[m][n];
}

function parseXmltvTime(str) {
    const year = parseInt(str.substring(0,4));
    const month = parseInt(str.substring(4,6)) - 1;
    const day = parseInt(str.substring(6,8));
    const hour = parseInt(str.substring(8,10));
    const min = parseInt(str.substring(10,12));
    const sec = parseInt(str.substring(12,14));
    return Date.UTC(year, month, day, hour, min, sec);
}

async function loadEPG() {
    epgError = null;
    epgReady = false;
    try {
        console.log('Caricamento EPG...');
        const response = await fetch(EPG_URL);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        
        const text = await response.text();
        console.log('EPG scaricato, parsing...');
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(text, 'text/xml');
        
        if (xmlDoc.querySelectorAll('parsererror').length > 0) {
            throw new Error('XML non valido');
        }
        
        const channelMap = new Map();
        xmlDoc.querySelectorAll('channel').forEach(ch => {
            const id = ch.getAttribute('id');
            const displayNames = ch.querySelectorAll('display-name');
            let displayName = id;
            if (displayNames.length > 0) {
                displayName = displayNames[0].textContent.trim();
            }
            const normName = normalizeName(displayName);
            const normId = normalizeName(id);
            channelMap.set(id, normName);
            epgNames.add(normName);
            epgChannels.set(id, []);
            if (!epgChannels.has(normName)) epgChannels.set(normName, []);
            if (!epgChannels.has(normId)) epgChannels.set(normId, []);
        });
        
        xmlDoc.querySelectorAll('programme').forEach(prog => {
            const channelId = prog.getAttribute('channel');
            const startStr = prog.getAttribute('start');
            const stopStr = prog.getAttribute('stop');
            const titleEl = prog.querySelector('title');
            const descEl = prog.querySelector('desc');
            const title = titleEl ? titleEl.textContent.trim() : '';
            const desc = descEl ? descEl.textContent.trim() : '';
            const start = parseXmltvTime(startStr);
            const stop = parseXmltvTime(stopStr);
            const program = { start, stop, title, desc };
            if (epgChannels.has(channelId)) epgChannels.get(channelId).push(program);
            const normChannelId = normalizeName(channelId);
            if (epgChannels.has(normChannelId)) epgChannels.get(normChannelId).push(program);
            if (channelMap.has(channelId)) {
                const norm = channelMap.get(channelId);
                if (epgChannels.has(norm)) epgChannels.get(norm).push(program);
            }
        });
        
        for (const [key, programs] of epgChannels.entries()) {
            programs.sort((a, b) => a.start - b.start);
        }
        
        epgReady = true;
        console.log('EPG caricato con', epgChannels.size, 'voci');
    } catch (error) {
        console.error('Errore EPG:', error);
        epgReady = false;
        epgError = error.message || 'Errore sconosciuto';
    }
}

function getAliasesForChannel(ch) {
    const aliases = [];
    const normName = normalizeName(ch.name);
    
    if (normName.includes('eurosport')) {
        if (normName.includes('2')) {
            aliases.push('eurosport2italiait');
        } else {
            aliases.push('eurosportitaliait');
        }
    }
    
    const skyMatch = normName.match(/skysport(\d{1,3})/);
    if (skyMatch) {
        const num = skyMatch[1];
        aliases.push(`skysport${num}it`);
        aliases.push(`skysport${num}`);
    }
    
    if (normName.includes('dazn1warp')) {
        aliases.push('dazn1');
    }
    
    return aliases;
}

function getCurrentProgram(ch) {
    if (!epgReady) return { status: 'loading' };
    const now = Date.now();
    const candidates = [];
    if (ch.tvgId) {
        candidates.push(ch.tvgId);
        candidates.push(normalizeName(ch.tvgId));
    }
    const normName = normalizeName(ch.name);
    candidates.push(normName);
    
    const aliases = getAliasesForChannel(ch);
    candidates.push(...aliases.map(normalizeName));
    
    for (const key of candidates) {
        if (epgChannels.has(key)) {
            const programs = epgChannels.get(key);
            const currentIndex = programs.findIndex(p => p.start <= now && now < p.stop);
            if (currentIndex !== -1) {
                return { status: 'ok', programs, currentIndex, matchedKey: key, isLive: true };
            }
            const nextIndex = programs.findIndex(p => p.start > now);
            if (nextIndex !== -1) {
                return { status: 'ok', programs, currentIndex: nextIndex, matchedKey: key, isLive: false };
            }
        }
    }
    
    let bestKey = null;
    let bestDist = Infinity;
    for (const epgName of epgNames) {
        const dist = levenshtein(normName, epgName);
        if (dist < bestDist) {
            bestDist = dist;
            bestKey = epgName;
        }
    }
    if (bestKey && bestDist <= 2 && epgChannels.has(bestKey)) {
        const programs = epgChannels.get(bestKey);
        const currentIndex = programs.findIndex(p => p.start <= now && now < p.stop);
        if (currentIndex !== -1) return { status: 'ok', programs, currentIndex, matchedKey: bestKey, isLive: true };
        const nextIndex = programs.findIndex(p => p.start > now);
        if (nextIndex !== -1) return { status: 'ok', programs, currentIndex: nextIndex, matchedKey: bestKey, isLive: false };
    }
    
    return { status: 'notfound' };
}

let epgState = {
    channel: null,
    programs: [],
    currentIndex: -1,
    liveIndex: -1
};

function displayEPG(ch) {
    if (ch.group && ch.group.toLowerCase().includes('svizzeri')) {
        document.getElementById('epg-info').style.display = 'none';
        return;
    }
    
    const epgDiv = document.getElementById('epg-info');
    const result = getCurrentProgram(ch);
    
    if (result.status !== 'ok') {
        epgDiv.style.display = 'none';
        return;
    }
    
    epgState.channel = ch;
    epgState.programs = result.programs;
    epgState.currentIndex = result.currentIndex;
    epgState.liveIndex = result.isLive ? result.currentIndex : -1;
    
    renderEPG();
}

function renderEPG() {
    const epgDiv = document.getElementById('epg-info');
    if (!epgState.programs || epgState.currentIndex < 0 || epgState.currentIndex >= epgState.programs.length) {
        epgDiv.style.display = 'none';
        return;
    }
    
    const program = epgState.programs[epgState.currentIndex];
    const startDate = new Date(program.start);
    const stopDate = new Date(program.stop);
    const timeStr = `${startDate.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})} - ${stopDate.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}`;
    
    const isLive = epgState.currentIndex === epgState.liveIndex;
    
    const prevDisabled = epgState.currentIndex === 0;
    const nextDisabled = epgState.currentIndex === epgState.programs.length - 1;
    
    const navHtml = `
        <div class="epg-nav">
            <button id="epg-prev" class="epg-btn" ${prevDisabled ? 'disabled' : ''}>◀</button>
            <button id="epg-next" class="epg-btn" ${nextDisabled ? 'disabled' : ''}>▶</button>
        </div>
    `;
    
    epgDiv.style.display = 'block';
    epgDiv.innerHTML = `
        ${navHtml}
        <div class="program-title">${program.title}</div>
        ${isLive ? '<span class="live-badge">In onda</span>' : ''}
        <div class="program-time">${timeStr}</div>
        ${program.desc ? `<div class="program-desc">${program.desc}</div>` : ''}
    `;
    
    if (isLive) {
        epgDiv.classList.add('live');
    } else {
        epgDiv.classList.remove('live');
    }
    
    const prevBtn = epgDiv.querySelector('#epg-prev');
    const nextBtn = epgDiv.querySelector('#epg-next');
    if (prevBtn) prevBtn.addEventListener('click', () => navigateEPG(-1));
    if (nextBtn) nextBtn.addEventListener('click', () => navigateEPG(1));
}

function navigateEPG(direction) {
    const newIndex = epgState.currentIndex + direction;
    if (newIndex >= 0 && newIndex < epgState.programs.length) {
        epgState.currentIndex = newIndex;
        renderEPG();
    }
}
// -------------------- Fine EPG --------------------

// -------------------- Modalità TV --------------------
let tvModeActive = false;
let currentChannelIndex = -1;
let lastChannelIndex = -1;
let osdTimeout = null;
let numberBuffer = '';
let epgPanelOpen = false;
let numberBufferTimeout = null;

const tvModeOverlay = document.getElementById('tv-mode-overlay');
const tvOsd = document.getElementById('tv-osd');
const tvEpgPanel = document.getElementById('tv-epg-panel');
const tvVideo = document.getElementById('tv-mode-video');
let tvPlayer = null;

function enterTvMode() {
    tvModeActive = true;
    document.getElementById('main-list').style.display = 'none';
    document.getElementById('expiry-info').style.display = 'none';
    document.getElementById('epg-info').style.display = 'none';
    document.querySelector('.player-container').style.display = 'none';
    document.getElementById('header').style.display = 'none';
    tvModeOverlay.classList.add('active');
    
    tvVideo.src = '';
    tvVideo.autoplay = true;
    
    const mainVideo = document.getElementById('video');
    const mainPlayer = mainVideo.player;
    if (mainPlayer) mainPlayer.destroy();
    
    tvPlayer = new shaka.Player(tvVideo);
    
    if (currentChannelIndex >= 0 && currentChannelIndex < allChannels.length) {
        loadChannelInTv(currentChannelIndex);
    } else if (allChannels.length > 0) {
        currentChannelIndex = 0;
        loadChannelInTv(0);
    }
    
    document.addEventListener('keydown', handleTvKeys);
}

function exitTvMode() {
    tvModeActive = false;
    if (tvPlayer) {
        tvPlayer.destroy();
        tvPlayer = null;
    }
    tvModeOverlay.classList.remove('active');
    document.getElementById('main-list').style.display = '';
    document.getElementById('expiry-info').style.display = '';
    document.getElementById('header').style.display = '';
    document.querySelector('.player-container').style.display = '';
    document.getElementById('epg-info').style.display = 'none';
    document.removeEventListener('keydown', handleTvKeys);
}

function loadChannelInTv(index) {
    const ch = allChannels[index];
    if (!ch) return;
    currentChannelIndex = index;
    
    tvPlayer.configure({ drm: {} });
    if (ch.drm && Object.keys(ch.drm).length > 0) {
        tvPlayer.configure({ drm: { clearKeys: ch.drm } });
    }
    if (ch.streamHeaders && Object.keys(ch.streamHeaders).length > 0) {
        tvPlayer.configure({ streaming: { customHttpHeaders: ch.streamHeaders } });
    } else {
        tvPlayer.configure({ streaming: { customHttpHeaders: {} } });
    }
    
    tvPlayer.load(ch.url).catch(err => {
        console.error('Errore caricamento TV:', err);
        showOsd('Errore', 'Impossibile caricare il canale', '');
    });
    
    showOsdForChannel(ch);
}

function showOsdForChannel(ch) {
    const program = getCurrentProgram(ch);
    let progTitle = 'Nessuna informazione';
    let timeStr = '';
    let progress = 0;
    if (program.status === 'ok') {
        const p = program.programs[program.currentIndex];
        progTitle = p.title;
        const start = new Date(p.start);
        const stop = new Date(p.stop);
        timeStr = `${start.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})} - ${stop.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}`;
        const now = Date.now();
        if (p.start <= now && now < p.stop) {
            progress = ((now - p.start) / (p.stop - p.start)) * 100;
        }
    }
    showOsd({
        number: currentChannelIndex + 1,
        name: ch.name,
        logo: ch.logo,
        program: progTitle,
        time: timeStr,
        progress: progress
    });
}

function showOsd(data) {
    document.getElementById('tv-osd-num').textContent = data.number ? `${data.number}.` : '';
    document.getElementById('tv-osd-name').textContent = data.name || '';
    const logo = document.getElementById('tv-osd-logo');
    if (data.logo) {
        logo.src = data.logo;
        logo.style.display = 'inline';
    } else {
        logo.style.display = 'none';
    }
    document.getElementById('tv-osd-program').textContent = data.program || '';
    document.getElementById('tv-osd-time').textContent = data.time || '';
    document.getElementById('tv-osd-progress-bar').style.width = `${data.progress || 0}%`;
    tvOsd.classList.add('active');
    if (osdTimeout) clearTimeout(osdTimeout);
    osdTimeout = setTimeout(() => {
        tvOsd.classList.remove('active');
    }, 5000);
}

function toggleEpgPanel() {
    if (!epgPanelOpen) {
        epgPanelOpen = true;
        tvEpgPanel.classList.add('active');
        updateEpgPanel();
    } else {
        epgPanelOpen = false;
        tvEpgPanel.classList.remove('active');
    }
}

function updateEpgPanel() {
    if (!epgPanelOpen) return;
    const ch = allChannels[currentChannelIndex];
    if (!ch) return;
    const result = getCurrentProgram(ch);
    if (result.status !== 'ok') {
        tvEpgPanel.innerHTML = '<div style="padding:20px;">Nessun EPG disponibile</div>';
        return;
    }
    let html = `<div style="font-size:20px; font-weight:bold; margin-bottom:10px;">${ch.name} - Prossimi programmi</div>`;
    result.programs.forEach((p, idx) => {
        const start = new Date(p.start);
        const stop = new Date(p.stop);
        const timeStr = `${start.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})} - ${stop.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}`;
        html += `<div class="tv-epg-item ${idx === result.currentIndex ? 'current' : ''}">
            <span class="epg-title">${p.title}</span>
            <span class="epg-time">${timeStr}</span>
        </div>`;
    });
    tvEpgPanel.innerHTML = html;
    const currentItem = tvEpgPanel.querySelector('.tv-epg-item.current');
    if (currentItem) currentItem.scrollIntoView({ block: 'center' });
}

function handleTvKeys(e) {
    if (!tvModeActive) return;
    
    const key = e.key;
    
    if (epgPanelOpen) {
        if (key === 'Escape' || key === 'Backspace' || key === 'Enter') {
            e.preventDefault();
            toggleEpgPanel();
            return;
        }
        return;
    }
    
    switch(key) {
        case 'ArrowUp':
            e.preventDefault();
            changeChannel(-1);
            break;
        case 'ArrowDown':
            e.preventDefault();
            changeChannel(1);
            break;
        case 'Enter':
            e.preventDefault();
            toggleEpgPanel();
            break;
        case 'Escape':
        case 'Backspace':
            e.preventDefault();
            exitTvMode();
            break;
        case '0': case '1': case '2': case '3': case '4':
        case '5': case '6': case '7': case '8': case '9':
            e.preventDefault();
            handleNumberKey(key);
            break;
        case 'p': case 'P': case 'F2':
            e.preventDefault();
            toggleFavorite(currentChannelIndex);
            break;
        case 'i': case 'I': case 'F1':
            e.preventDefault();
            if (currentChannelIndex >= 0) {
                const ch = allChannels[currentChannelIndex];
                if (ch) showOsdForChannel(ch);
            }
            break;
        default:
            break;
    }
}

function changeChannel(delta) {
    const newIndex = currentChannelIndex + delta;
    if (newIndex >= 0 && newIndex < allChannels.length) {
        lastChannelIndex = currentChannelIndex;
        loadChannelInTv(newIndex);
    }
}

function handleNumberKey(num) {
    numberBuffer += num;
    clearTimeout(numberBufferTimeout);
    numberBufferTimeout = setTimeout(() => {
        const targetIndex = parseInt(numberBuffer) - 1;
        if (targetIndex >= 0 && targetIndex < allChannels.length) {
            lastChannelIndex = currentChannelIndex;
            loadChannelInTv(targetIndex);
        }
        numberBuffer = '';
    }, 1500);
}

function toggleFavorite(index) {
    const ch = allChannels[index];
    if (!ch) return;
    const id = ch.id;
    if (favoriteIds.has(id)) {
        favoriteIds.delete(id);
    } else {
        favoriteIds.add(id);
    }
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(favoriteIds)));
    showOsd({
        number: index + 1,
        name: ch.name,
        logo: ch.logo,
        program: favoriteIds.has(id) ? 'Aggiunto ai preferiti' : 'Rimosso dai preferiti',
        time: '',
        progress: 0
    });
}

// Fine Modalità TV

document.getElementById('tv-mode-btn').addEventListener('click', () => {
    if (!tvModeActive) {
        enterTvMode();
    } else {
        exitTvMode();
    }
});

if (document.fonts && document.fonts.load) {
    document.fonts.load('1em "Formula1 Display Bold"');
}

document.addEventListener('shaka-ui-loaded', () => {
    document.getElementById('reload-btn').addEventListener('click', reloadPlaylist);
    checkAccess();
});
</script>
