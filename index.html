<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS WEB</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">

    <style>
        :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; --accent: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Protezione Password */
        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20000; }
        #lock input { background: #000; border: 1px solid #222; color: white; padding: 12px; border-radius: 4px; text-align: center; width: 220px; margin-bottom: 10px; outline: none; }
        #lock button { background: var(--blue); color: #000; border: none; padding: 10px 40px; border-radius: 4px; cursor: pointer; font-weight: 900; }

        /* Header stile nodrm */
        .header { padding: 20px; display: flex; align-items: baseline; border-bottom: 1px solid #1e232d; margin-bottom: 20px; }
        .header h1 { font-size: 20px; text-transform: uppercase; margin: 0; font-weight: 900; letter-spacing: 1px; }
        .header .count { color: #3a4454; font-size: 11px; margin-left: 10px; font-weight: bold; }

        /* Griglia Canali */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 0 20px 40px 20px; }
        .card { 
            background: var(--card); border-radius: 4px; padding: 15px; text-align: left; 
            cursor: pointer; border: 1px solid #1e232d; transition: 0.2s;
            display: flex; flex-direction: column; min-height: 130px;
        }
        .card:hover { border-color: #333; background: #1a1f29; }
        .logo-box { height: 50px; width: 100%; display: flex; align-items: center; justify-content: flex-start; margin-bottom: 12px; }
        .logo-box img { max-width: 80%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .name { font-size: 13px; font-weight: bold; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub { font-size: 9px; color: var(--blue); font-weight: bold; text-transform: uppercase; }

        /* Player Overlay Fullscreen */
        #player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .player-wrap { width: 95%; max-width: 1000px; }
        .player-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .p-title { font-size: 16px; font-weight: bold; margin: 0; }
        .close-btn { background: rgba(255,255,255,0.05); color: #777; border: 1px solid #333; padding: 5px 12px; cursor: pointer; border-radius: 3px; font-size: 11px; font-weight: bold; }
        
        /* Shaka Custom */
        .shaka-video-container { width: 100%; aspect-ratio: 16/9; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .shaka-range-element { color: var(--accent) !important; } /* Barra Gialla */
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="lock">
    <h2 style="font-size: 14px; margin-bottom: 20px; letter-spacing: 2px; color: #444;">AREA RISERVATA</h2>
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()">ACCEDI</button>
</div>

<div id="app" class="hidden">
    <div class="header"><h1>📺 CHANNELS</h1> <div class="count" id="count">0 CANALI</div></div>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-wrap">
        <div class="player-nav">
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="playing-name" class="p-title">CANALE</span>
                <span id="playing-sub" style="font-size:10px; color:var(--blue); font-weight:bold;">LIVE</span>
            </div>
            <button class="close-btn" onclick="closePlayer()">✕ CHIUDI</button>
        </div>
        <div id="video-container" class="shaka-video-container" data-shaka-player-container>
            <video id="video" data-shaka-player autoplay style="width:100%; height:100%;"></video>
        </div>
    </div>
</div>

<script>
    const PASS = "1234";
    const M3U_FILE = "lista_privata.m3u";
    const PROXY = "https://corsproxy.io/?url=";
    let player, ui;

    function login() {
        if(document.getElementById('pw').value === PASS) {
            document.getElementById('lock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initApp();
        } else { alert("Password errata!"); }
    }

    async function initApp() {
        try {
            const res = await fetch("./" + M3U_FILE);
            const data = await res.text();
            const container = document.getElementById('grid');
            
            // Parsing per blocchi (più pulito per loghi e nomi)
            const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
            let count = 0;

            blocks.forEach(block => {
                if (block.includes('#EXTINF')) {
                    count++;
                    const name = block.split(',').pop().split('\n')[0].trim();
                    const logo = block.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                    const url = block.match(/https?:\/\/\S+/)?.[0];
                    const keys = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                    const group = block.match(/group-title="([^"]+)"/)?.[1] || "SKY IT";

                    if (url && keys) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => openPlayer(url, name, keys[1], keys[2], group);
                        card.innerHTML = `
                            <div class="logo-box"><img src="${logo}" onerror="this.style.display='none'"></div>
                            <div class="name">${name}</div>
                            <div class="sub">${group}</div>
                        `;
                        container.appendChild(card);
                    }
                }
            });
            document.getElementById('count').innerText = count + " CANALI DISPONIBILI";
        } catch(e) { console.error("Errore lista"); }
    }

    async function openPlayer(url, name, kid, key, group) {
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('playing-name').innerText = name;
        document.getElementById('playing-sub').innerText = group;
        
        const video = document.getElementById('video');
        ui = video['ui'];
        player = ui.getControls().getPlayer();

        player.configure({ drm: { clearKeys: { [kid]: key } } });

        try {
            // Usiamo la logica dello screenshot che ha funzionato
            await player.load(PROXY + encodeURIComponent(url));
        } catch (e) {
            // Fallback diretto se il proxy fallisce
            try { await player.load(url); } catch(e2) { alert("Flusso non disponibile."); }
        }
    }

    function closePlayer() {
        const video = document.getElementById('video');
        if (video['ui']) {
            const p = video['ui'].getControls().getPlayer();
            p.unload();
        }
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
