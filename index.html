<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Single Stream Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    body { background-color: #262626; color: white; font-family: Arial, sans-serif; }
    .center { margin: auto; width: 50%; text-align: center; }
    video { width: 100%; height: 100%; }
    .channels { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .btn { background: #444; color: white; border: 1px solid #666; padding: 10px; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .btn:hover { background: #666; }
</style>
</head>
<body>
<div class="center"><h2 id="title">Seleziona Canale</h2></div>
<div class="center" style="max-width:40em" data-shaka-player-container><video autoplay data-shaka-player id="video"></video></div>
<div class="center channels" id="list"></div>

<script>
async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    try {
        const res = await fetch('lista_privata.m3u');
        const data = await res.text();
        const container = document.getElementById('list');
        
        // Dividiamo la lista
        const items = data.split('#EXTINF');

        items.forEach(item => {
            if (item.includes('license_key=')) {
                // Estrazione nome
                const name = item.split(',').pop().split('\n')[0].trim();
                
                // --- FILTRO NOMI SPORCHI ---
                // Se il nome contiene lo User-Agent (Gecko/Chrome), lo saltiamo
                if (name.includes("Gecko") || name.includes("Version/")) return;

                const url = item.match(/https?:\/\/[^\s"|]+/)?.[0];
                const keys = item.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (url && keys) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = name;
                    
                    btn.onclick = async () => {
                        document.getElementById('title').innerText = "Caricamento: " + name;
                        
                        player.configure({
                            drm: { clearKeys: { [keys[1]]: keys[2] } }
                        });

                        try {
                            // --- NUOVO PROXY (AllOrigins) ---
                            // Sostituiamo corsproxy che dava errore 403
                            const proxy = "https://api.allorigins.win/raw?url=";
                            await player.load(proxy + encodeURIComponent(url));
                            document.getElementById('title').innerText = "In riproduzione: " + name;
                        } catch (e) {
                            // Fallback senza proxy (come nello screenshot F1 funzionante)
                            try {
                                await player.load(url);
                                document.getElementById('title').innerText = "In riproduzione: " + name;
                            } catch (e2) {
                                document.getElementById('title').innerText = "Errore: " + e2.code;
                            }
                        }
                    };
                    container.appendChild(btn);
                }
            }
        });
    } catch (err) { console.error("Errore M3U"); }
}
document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
