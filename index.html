<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TV Dashboard PRO – Sky Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background-color: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; text-align: center; }
        .center { margin: auto; width: 80%; max-width: 800px; }
        video { width: 100%; aspect-ratio: 16/9; background: black; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 30px; }
        .btn { background: #333; color: #ccc; border: 1px solid #444; padding: 15px 5px; cursor: pointer; border-radius: 8px; font-size: 12px; font-weight: 600; transition: all 0.3s; }
        .btn:hover { background: #00d2ff; color: #000; transform: translateY(-2px); }
        .btn.active { background: #00d2ff; color: #000; border: 2px solid #fff; box-shadow: 0 0 15px rgba(0,210,255,0.5); }
        #status { color: #00d2ff; margin-bottom: 20px; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="status">Caricamento canali in corso...</div>

    <div class="center" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="list" class="grid"></div>

<script>
const LISTA_URL = "lista_privata.m3u";

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const statusHeader = document.getElementById('status');
    const container = document.getElementById('list');

    // Configurazione per bypassare blocchi server (come Errore 1002)
    player.configure({
        streaming: { jumpLargeGaps: true },
        manifest: { dash: { clockSyncUri: '' } }
    });

    // Aggiungiamo lo User-Agent specifico richiesto dalla tua lista
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Linux; Android 9; AFTKA Build/PS7702.4965N; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/136.0.7103.125 Mobile Safari/537.36';
    });

    try {
        const res = await fetch(LISTA_URL);
        const text = await res.text();
        
        // Dividiamo la lista per blocchi corretti basandoci sulla tua struttura
        const blocks = text.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
        statusHeader.innerText = "Scegli un canale";

        blocks.forEach(block => {
            if (block.includes('license_key=')) {
                // 1. Estrazione Chiavi (KID:KEY)
                const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                
                // 2. Estrazione URL (.mpd)
                const urlMatch = block.match(/https?:\/\/[^\s"|]+\.mpd[^\s"|]*/i);
                
                // 3. Estrazione Nome (dopo la virgola in EXTINF)
                const nameMatch = block.match(/#EXTINF:.*,(.*)/);

                if (keyMatch && urlMatch && nameMatch) {
                    const kid = keyMatch[1];
                    const key = keyMatch[2];
                    const url = urlMatch[0];
                    const name = nameMatch[1].trim();

                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = name;
                    
                    btn.onclick = async () => {
                        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        statusHeader.innerText = "In riproduzione: " + name;

                        player.configure({
                            drm: { clearKeys: { [kid]: key } }
                        });

                        try {
                            await player.load(url);
                        } catch (e) {
                            statusHeader.innerText = "Errore: " + e.code;
                            console.error("Dettaglio:", e);
                        }
                    };
                    container.appendChild(btn);
                }
            }
        });
    } catch (err) {
        statusHeader.innerText = "Errore caricamento file m3u";
    }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
