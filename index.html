<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Single Stream Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; --border: #1e232d; }
    body { background-color: var(--bg); color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .center { margin: auto; width: 60%; text-align: center; }
    video { width: 100%; height: 100%; border-radius: 4px; }
    
    /* Login */
    #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    #lock input { background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 4px; margin-bottom: 10px; text-align: center; }
    #lock button { background: var(--blue); border: none; padding: 10px 25px; cursor: pointer; font-weight: bold; border-radius: 4px; color: black; }

    /* Griglia */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); padding: 15px; cursor: pointer; border-radius: 4px; text-align: center; font-size: 12px; font-weight: bold; transition: 0.2s; }
    .card:hover { border-color: var(--blue); background: #1c212a; }
    .hidden { display: none !important; }
</style>
</head>
<body>

<div id="lock">
    <h2 style="font-size: 14px; letter-spacing: 2px; color: var(--blue);">ACCESSO RISERVATO</h2>
    <input type="password" id="pw" placeholder="Inserisci Password">
    <button onclick="login()">ENTRA</button>
</div>

<div id="app" class="hidden">
    <div class="center"><h2 id="title" style="font-size: 18px; color: var(--blue);">Canale</h2></div>
    <div class="center" style="max-width:40em" data-shaka-player-container data-shaka-player-cast-receiver-id="07AEE832">
        <video autoplay data-shaka-player id="video"></video>
    </div>
    <div id="list" class="grid"></div>
</div>

<script>
const proxy = "https://corsproxy.io/?url=";
let playerGlobal;

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const controls = ui.getControls();
    playerGlobal = controls.getPlayer();
}

function login() {
    if(document.getElementById('pw').value === "1234") {
        document.getElementById('lock').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        loadList();
    } else { alert("Password Sbagliata"); }
}

async function loadList() {
    try {
        const res = await fetch('lista_privata.m3u');
        const data = await res.text();
        const container = document.getElementById('list');
        const items = data.split('#EXTINF');

        items.forEach(item => {
            if (item.includes('license_key=')) {
                // ESTRAZIONE NOME: Cerchiamo l'ultima riga che NON sia un URL o un parametro tecnico
                const lines = item.split('\n').map(l => l.trim()).filter(l => l !== "");
                let name = lines[0].split(',').pop().trim(); // Prova standard
                
                // Se il nome contiene "Gecko" o parametri lunghi, cerchiamo meglio
                if (name.includes("Version/") || name.length > 50) {
                   const cleanLine = lines.find(l => !l.startsWith('#') && !l.startsWith('http') && !l.includes('Version/'));
                   if (cleanLine) name = cleanLine;
                }

                // URL: prende la riga che inizia con http
                const url = item.match(/https?:\/\/[^\s"|]+/)?.[0];
                // KEY: prende KID:KEY
                const keys = item.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (url && keys) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerText = name;
                    card.onclick = async () => {
                        document.getElementById('title').innerText = "In riproduzione: " + name;
                        
                        // LOGICA PLAYER ORIGINALE
                        playerGlobal.configure({ drm: { clearKeys: { [keys[1]]: keys[2] } } });
                        try {
                            await playerGlobal.load(proxy + encodeURIComponent(url));
                        } catch (e) {
                            try { await playerGlobal.load(url); } catch (e2) {}
                        }
                    };
                    container.appendChild(card);
                }
            }
        });
    } catch (e) { console.error("Errore lista"); }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
