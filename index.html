<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Stream Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00d2ff; }
        /* Griglia dei player */
        #streams-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        .stream-card {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #333;
        }
        .stream-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #00d2ff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .video-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; }
        @media (max-width: 500px) {
            #streams-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>TV Dashboard</h1>
    <div id="streams-container"></div>

<script>
async function initDashboard() {
    const container = document.getElementById('streams-container');
    
    try {
        const response = await fetch('lista_privata.m3u');
        const text = await response.text();
        const blocks = text.split('#EXTINF');

        blocks.forEach((block, index) => {
            if (block.includes('license_key=')) {
                // 1. Estrazione Nome
                const lines = block.split('\n');
                let name = "Canale " + index;
                for (let line of lines) {
                    if (line.includes(',') && !line.includes('license')) {
                        name = line.split(',').pop().trim();
                        break;
                    }
                }

                // 2. Estrazione URL e Chiavi
                const urlMatch = block.match(/https?:\/\/[^\s"|]+/);
                const keysMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (urlMatch && keysMatch) {
                    createPlayer(container, name, urlMatch[0], keysMatch[1], keysMatch[2], index);
                }
            }
        });
    } catch (err) {
        console.error("Errore nel caricamento della lista M3U");
    }
}

function createPlayer(container, name, url, kid, key, index) {
    // Crea la struttura HTML per ogni singolo canale
    const card = document.createElement('div');
    card.className = 'stream-card';
    
    card.innerHTML = `
        <div class="stream-title">${name}</div>
        <div class="video-wrapper" data-shaka-player-container>
            <video data-shaka-player id="video-${index}" poster="https://via.placeholder.com/400x225/000/00d2ff?text=${encodeURIComponent(name)}"></video>
        </div>
    `;
    
    container.appendChild(card);

    // Inizializza Shaka per questo specifico video
    const video = document.getElementById(`video-${index}`);
    const player = new shaka.Player(video);

    // Configura DRM
    player.configure({
        drm: {
            clearKeys: { [kid]: key }
        }
    });

    // Carica lo stream
    player.load(url).catch(error => {
        console.warn(`Errore caricamento ${name}:`, error.code);
        // Se fallisce, mettiamo un avviso nel titolo
        card.querySelector('.stream-title').innerText += " (Errore: " + error.code + ")";
    });
}

document.addEventListener('DOMContentLoaded', initDashboard);
</script>
</body>
</html>
