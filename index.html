<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>
    <style>
        :root { --bg: #0b0e11; --accent: #ffcc00; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        #login { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        input { padding: 12px; background: #1a1d23; border: 1px solid #333; color: white; border-radius: 5px; margin-bottom: 10px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #1a1d23; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; border: 1px solid #2d3139; }
        .card img { max-width: 100%; height: 60px; object-fit: contain; }
        #player-layer { position: fixed; inset: 0; background: black; display: none; z-index: 100; flex-direction: column; }
        .shaka-range-element { color: var(--accent) !important; }
    </style>
</head>
<body>

<div id="login">
    <h2 style="color:var(--accent)">CHANNELS LOGIN</h2>
    <input type="password" id="pass" placeholder="Inserisci Password">
    <button onclick="check()" style="padding:10px 30px; background:var(--accent); border:none; font-weight:bold; border-radius:5px; cursor:pointer;">ENTRA</button>
</div>

<div id="grid" class="grid"></div>

<div id="player-layer">
    <div style="padding:15px; display:flex; justify-content:space-between; background:#111;">
        <span id="chan-name" style="font-weight:bold">Canale</span>
        <button onclick="location.reload()" style="color:red; background:none; border:none; font-weight:bold; cursor:pointer;">CHIUDI ✕</button>
    </div>
    <div id="video-container" style="width:100%; height:100%;"><video id="video" autoplay style="width:100%; height:100%;"></video></div>
</div>

<script>
    let player;
    // Usiamo un proxy pubblico professionale per evitare l'errore 1001 e 4000
    const P = "https://corsproxy.io/?url=";

    function check() {
        if(document.getElementById('pass').value === "1234") {
            document.getElementById('login').style.display = 'none';
            loadList();
        } else { alert("Sbagliata!"); }
    }

    async function loadList() {
        const res = await fetch("./lista_privata.m3u");
        const text = await res.text();
        const blocks = text.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
        
        blocks.forEach(b => {
            if (b.includes('#EXTINF')) {
                const url = b.match(/https?:\/\/\S+/)?.[0];
                const key = b.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                const name = b.split(',').pop().split('\n')[0].trim();
                const logo = b.match(/tvg-logo="(.*?)"/)?.[1] || "";
                const ua = b.match(/user-agent=(.*?)\n/i)?.[1]?.trim() || "";

                if (url && key) {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<img src="${logo}"><div>${name}</div>`;
                    div.onclick = () => start(url, name, key[1], key[2], ua);
                    document.getElementById('grid').appendChild(div);
                }
            }
        });
    }

    async function start(url, name, kid, key, ua) {
        document.getElementById('player-layer').style.display = 'flex';
        document.getElementById('chan-name').innerText = name;
        const v = document.getElementById('video');
        player = new shaka.Player(v);
        const ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), v);
        
        player.configure({ drm: { clearKeys: { [kid]: key } } });

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            const original = request.uris[0];
            if (!original.includes('corsproxy.io')) {
                request.uris = [P + encodeURIComponent(original)];
                if(ua) request.headers['User-Agent'] = ua;
            }
        });

        try { await player.load(url); } 
        catch(e) { alert("Errore caricamento: " + e.code); }
    }
</script>
</body>
</html>
