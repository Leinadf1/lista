<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- stili esistenti --- */
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        
        #header { 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #30363d; 
            padding-bottom: 15px; 
            box-sizing: border-box; 
        }
        
        h1 { font-size: 22px; font-weight: 700; color: #58a6ff; margin: 0; letter-spacing: -0.5px; }
        #chan-count { font-size: 13px; color: #8b949e; font-weight: 600; background: #21262d; padding: 4px 12px; border-radius: 20px; }
        
        .player-container { 
            width: 100%; 
            max-width: 820px; 
            background: #000; 
            margin-bottom: 10px; 
            z-index: 10; 
        }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        #expiry-info {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 25px;
            color: #f1e05a;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }

        .category-container { width: 100%; margin-bottom: 45px; box-sizing: border-box; }
        .category-title { 
            font-size: 16px; 
            color: #f1e05a; 
            margin-bottom: 20px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        .category-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: #58a6ff;
            margin-right: 12px;
            border-radius: 2px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            width: 100%;
        }
        
        .channel-card { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        .channel-card:hover { 
            transform: translateY(-5px); 
            border-color: #58a6ff; 
            background-color: #1c2128;
        }
        .channel-card.active { 
            border: 2px solid #58a6ff; 
            background-color: #21262d; 
        }
        
        .logo-box { 
            width: 100%; 
            height: 100px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #0d1117; 
            padding: 15px; 
            box-sizing: border-box; 
        }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .info-box { 
            padding: 12px; 
            text-align: center; 
            border-top: 1px solid #30363d; 
            background: #161b22; 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .name { 
            font-size: 13.5px; 
            font-weight: 600; 
            color: #f0f6fc; 
            text-transform: uppercase; 
            line-height: 1.3;
        }

        /* --- stili per la guida TV --- */
        #guide-section {
            width: 100%;
            max-width: 820px;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #guide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }
        #guide-back-btn {
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
            background: #21262d;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        #guide-loading {
            margin: 30px;
            font-size: 16px;
            color: #f1e05a;
        }
        .guide-channel-row {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            width: 100%;
        }
        .guide-channel-name {
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 6px;
        }
        .guide-program {
            font-size: 14px;
            margin: 2px 0;
        }
        .guide-program-time {
            color: #8b949e;
            display: inline-block;
            width: 70px;
        }
        .guide-program-title {
            color: #c9d1d9;
        }
        .guide-program-next {
            color: #58a6ff;
        }

        @media (max-width: 600px) {
            .grid { 
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
                gap: 12px; 
            }
            .logo-box { height: 80px; padding: 10px; }
            .name { font-size: 11.5px; }
            body { padding: 10px; }
        }
    </style>
</head>
<body id="mainBody" style="display:none;">

    <div id="header">
        <a href="#" id="guide-btn" style="text-decoration: none; font-size: 18px; font-weight: 700; color: #58a6ff; background: #21262d; padding: 8px 16px; border-radius: 20px;">GUIDA TV</a>
        <div id="chan-count">Caricamento...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>
    <div id="expiry-info"></div>

    <!-- Contenitore Guida TV (nascosto) -->
    <div id="guide-section">
        <div id="guide-header">
            <span style="font-size:20px; font-weight:700; color:#58a6ff;">GUIDA TV</span>
            <span id="guide-back-btn" onclick="showMainList()">← Torna alla Dashboard</span>
        </div>
        <div id="guide-loading">Caricamento programmazione...</div>
        <div id="guide-container" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <div id="main-list" style="width: 100%;"></div>

<script type="module">
let passwordGlobale = "";
let heartbeatInterval;
let allChannelNames = [];  // Array per salvare i nomi dei canali

const EPG_URL = "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz";
const PROXY_URL = "https://api.allorigins.win/raw?url=";

function startHeartbeat(password) {
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(async () => {
        try {
            await fetch("/api/get-list", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-heartbeat': 'true' },
                body: JSON.stringify({ password: password })
            });
        } catch (e) { console.warn("Sessione persa"); }
    }, 15000);
}

// Estrae scadenza (Sky o DAZN)
function getExpiryFromUrl(url) {
    let match = url.match(/e~(\d+)/);
    if (match) {
        const ts = parseInt(match[1]) * 1000;
        if (Date.now() > ts) return "Scaduto";
        return new Date(ts).toLocaleString('it-IT', { timeZone: 'Europe/Rome' });
    }
    match = url.match(/@(eyJ[A-Za-z0-9\-_]+?\.[A-Za-z0-9\-_]+?\.[A-Za-z0-9\-_]+)/);
    if (match) {
        try {
            const token = match[1];
            const payloadBase64 = token.split('.')[1];
            const payloadJson = atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'));
            const payload = JSON.parse(payloadJson);
            if (payload.exp) {
                const exp = payload.exp * 1000;
                if (Date.now() > exp) return "Scaduto";
                return new Date(exp).toLocaleString('it-IT', { timeZone: 'Europe/Rome' });
            }
        } catch (e) {}
    }
    return null;
}

// Mostra/nascondi la guida TV
let guideLoaded = false;
let guideData = [];

document.getElementById('guide-btn').addEventListener('click', () => {
    showGuide();
});

function showGuide() {
    document.getElementById('main-list').style.display = 'none';
    document.getElementById('guide-section').style.display = 'flex';
    if (!guideLoaded) {
        loadGuide();
    }
}

function showMainList() {
    document.getElementById('guide-section').style.display = 'none';
    document.getElementById('main-list').style.display = 'block';
}

async function loadGuide() {
    const loadingEl = document.getElementById('guide-loading');
    loadingEl.style.display = 'block';
    try {
        // Recupera EPG tramite proxy
        const response = await fetch(PROXY_URL + encodeURIComponent(EPG_URL));
        if (!response.ok) throw new Error('Errore nel download dell EPG');
        const arrayBuffer = await response.arrayBuffer();
        const decompressed = pako.ungzip(new Uint8Array(arrayBuffer));
        const xmlText = new TextDecoder('utf-8').decode(decompressed);
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

        // Mappa display-name per channel id
        const channelNames = {};
        const channelNodes = xmlDoc.getElementsByTagName('channel');
        for (let ch of channelNodes) {
            const id = ch.getAttribute('id');
            const display = ch.getElementsByTagName('display-name')[0]?.textContent;
            if (id && display) channelNames[id] = display;
        }

        // Raccogli i programmi
        const programmes = xmlDoc.getElementsByTagName('programme');
        const channelMap = new Map();

        for (let prog of programmes) {
            const channelId = prog.getAttribute('channel');
            const start = prog.getAttribute('start');
            const stop = prog.getAttribute('stop');
            const title = prog.getElementsByTagName('title')[0]?.textContent || 'Senza titolo';
            if (!channelId || !start || !stop) continue;
            if (!channelMap.has(channelId)) channelMap.set(channelId, []);
            channelMap.get(channelId).push({ start, stop, title });
        }

        const now = new Date();
        const filteredGuide = [];

        for (let [channelId, progs] of channelMap) {
            const name = channelNames[channelId] || channelId;
            // Filtra solo i canali presenti nella playlist
            if (!allChannelNames.some(ch => ch.toLowerCase() === name.toLowerCase())) continue;

            progs.sort((a, b) => a.start.localeCompare(b.start));
            let current = null, next = null;
            for (let i = 0; i < progs.length; i++) {
                const start = new Date(progs[i].start);
                const stop = new Date(progs[i].stop);
                if (start <= now && now < stop) {
                    current = progs[i];
                    if (i + 1 < progs.length) next = progs[i + 1];
                    break;
                }
            }
            if (current || next) filteredGuide.push({ name, current, next });
        }

        guideData = filteredGuide;
        renderGuide();
        guideLoaded = true;
    } catch (err) {
        loadingEl.textContent = 'Errore: ' + err.message;
    } finally {
        loadingEl.style.display = 'none';
    }
}

function renderGuide() {
    const container = document.getElementById('guide-container');
    container.innerHTML = '';
    if (guideData.length === 0) {
        container.innerHTML = '<p>Nessun programma trovato per i tuoi canali.</p>';
        return;
    }
    for (let ch of guideData) {
        const row = document.createElement('div');
        row.className = 'guide-channel-row';
        row.innerHTML = `
            <div class="guide-channel-name">${ch.name}</div>
            ${ch.current ? `<div class="guide-program"><span class="guide-program-time">${formatTime(ch.current.start)} - ${formatTime(ch.current.stop)}</span><span class="guide-program-title">${ch.current.title}</span></div>` : '<div class="guide-program">Nessun programma in onda</div>'}
            ${ch.next ? `<div class="guide-program guide-program-next"><span class="guide-program-time">${formatTime(ch.next.start)} - ${formatTime(ch.next.stop)}</span><span class="guide-program-title">${ch.next.title}</span></div>` : ''}
        `;
        container.appendChild(row);
    }
}

function formatTime(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

async function checkAccess() {
    const psw = prompt("Password:");
    if (!psw) return;

    try {
        const response = await fetch("/api/get-list", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: psw })
        });

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            alert(errorData.error || "Sessione già attiva o password errata!");
            window.location.reload();
            return;
        }

        const m3uEncoded = await response.text();
        const m3uData = atob(m3uEncoded);
        
        passwordGlobale = psw;
        sessionStorage.setItem('tv_password', psw);  // non serve più ma lasciamo
        document.getElementById('mainBody').style.display = "flex";
        document.getElementById('expiry-info').textContent = '';
        startHeartbeat(psw);
        init(m3uData);

    } catch (error) {
        alert("Errore server.");
    }
}

async function init(m3uContent) {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const mainList = document.getElementById('main-list');
    const countHeader = document.getElementById('chan-count');
    const expiryDiv = document.getElementById('expiry-info');

    player.configure({ streaming: { jumpLargeGaps: true } });

    function createCard(ch) {
        const name = (ch.group || "LISTA").toUpperCase().trim();
        let gridId = `grid-${name.replace(/[^a-z0-9]/gi, '-')}`;
        let grid = document.getElementById(gridId);
        
        if (!grid) {
            const container = document.createElement('div');
            container.className = 'category-container';
            container.innerHTML = `<div class="category-title">${name}</div><div class="grid" id="${gridId}"></div>`;
            mainList.appendChild(container);
            grid = document.getElementById(gridId);
        }

        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `
            <div class="logo-box"><img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150x80?text=TV'"></div>
            <div class="info-box"><div class="name">${ch.name}</div></div>
        `;
        
        card.onclick = async () => {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            if (expiryDiv) {
                const expiry = ch.expiry;
                if (expiry) {
                    expiryDiv.textContent = `⏳ ${expiry === "Scaduto" ? "Scaduto" : `Scade il: ${expiry}`}`;
                } else {
                    expiryDiv.textContent = '';
                }
            }
            await player.unload();
            player.configure({ drm: { clearKeys: ch.drm || {} } });
            if (ch.streamHeaders && Object.keys(ch.streamHeaders).length > 0) {
                player.configure({ streaming: { customHttpHeaders: ch.streamHeaders } });
            } else {
                player.configure({ streaming: { customHttpHeaders: {} } });
            }
            await player.load(ch.url);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        grid.appendChild(card);
    }

    const lines = m3uContent.split('\n');
    let currentChannel = { name: "", logo: "", group: "LISTA", drm: {}, url: "", streamHeaders: {} };
    let loadedCount = 0;
    allChannelNames = [];  // reset

    for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
            const val = line.split('=')[1];
            try {
                currentChannel.drm = JSON.parse(val);
            } catch (e) {
                const parts = val.split(':');
                if (parts.length === 2) currentChannel.drm[parts[0].toLowerCase()] = parts[1].toLowerCase();
            }
        } 
        else if (line.startsWith('#KODIPROP:inputstream.adaptive.stream_headers=')) {
            const val = line.split('=')[1];
            if (val) {
                const pairs = val.split('&');
                pairs.forEach(pair => {
                    const [headerKey, headerValue] = pair.split('=');
                    if (headerKey && headerValue) {
                        currentChannel.streamHeaders[headerKey.trim()] = headerValue.trim();
                    }
                });
            }
        }
        else if (line.startsWith('#EXTINF:')) {
            const logo = line.match(/tvg-logo="([^"]+)"/i);
            const group = line.match(/group-title="([^"]+)"/i);
            const name = line.match(/,(.*)/);
            if (logo) currentChannel.logo = logo[1];
            if (group) currentChannel.group = group[1];
            if (name) currentChannel.name = name[1].trim();
        } 
        else if (line.startsWith('http')) {
            currentChannel.url = line;
            currentChannel.expiry = getExpiryFromUrl(line);
            createCard(currentChannel);
            loadedCount++;
            // Salva il nome del canale per la guida
            allChannelNames.push(currentChannel.name);
            currentChannel = { name: "", logo: "", group: "LISTA", drm: {}, url: "", streamHeaders: {} };
        }
    }

    countHeader.innerText = loadedCount + " CANALI";
}

document.addEventListener('shaka-ui-loaded', checkAccess);
</script>
</body>
</html>
