<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Stream Player PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    body { background-color: #121212; color: white; font-family: sans-serif; padding: 20px; margin: 0; }
    .center { margin: auto; width: 95%; max-width: 900px; text-align: center; }
    .video-container { width: 100%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7); margin-bottom: 20px; }
    #title { color: #00d2ff; font-size: 18px; margin-bottom: 15px; font-weight: bold; }
    .channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .btn { background: #2a2a2a; color: #eee; border: 1px solid #444; padding: 12px 5px; cursor: pointer; border-radius: 6px; font-size: 11px; font-weight: bold; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn:hover { background: #00d2ff; color: black; border-color: white; }
    .btn.active { background: #00d2ff; color: black; border: 2px solid white; }
</style>
</head>
<body>

<div class="center">
    <div id="title">Seleziona Canale</div>
    <div class="video-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>
    <div id="list" class="channels"></div>
</div>

<script>
async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const titleDisplay = document.getElementById('title');

    // IL TUO PROXY PERSONALE SU CLOUDFLARE
    const MIO_PROXY = "https://still-dawn-7cbdfd.miniclashroyale3636.workers.dev/?url=";

    // FILTRO FONDAMENTALE: Forza TUTTE le richieste tramite proxy
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Se la richiesta non è già passata per il proxy, la reindirizziamo
        if (!request.uris[0].includes(MIO_PROXY) && request.uris[0].startsWith('http')) {
            request.uris[0] = MIO_PROXY + encodeURIComponent(request.uris[0]);
        }
    });

    try {
        const res = await fetch('lista_privata.m3u');
        const data = await res.text();
        const container = document.getElementById('list');
        const items = data.split('#EXTINF');

        items.forEach(item => {
            if (item.includes('license_key=')) {
                // Pulizia nome canale
                const lines = item.split('\n');
                let name = "Canale";
                for (let line of lines) {
                    if (line.includes(',') && !line.includes('license_key') && !line.includes('user-agent')) {
                        name = line.split(',').pop().trim();
                        break;
                    }
                }

                const url = item.match(/https?:\/\/[^\s"|]+/)?.[0];
                const keys = item.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (url && keys) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = name;
                    
                    btn.onclick = async () => {
                        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        titleDisplay.innerText = "Caricamento: " + name;

                        // Configurazione DRM ClearKey
                        player.configure({
                            drm: { clearKeys: { [keys[1]]: keys[2] } },
                            streaming: { retryParameters: { maxAttempts: 5 } }
                        });

                        try {
                            // Caricamento tramite proxy
                            await player.load(MIO_PROXY + encodeURIComponent(url));
                            titleDisplay.innerText = "In riproduzione: " + name;
                        } catch (e) {
                            console.error("Errore Shaka:", e);
                            titleDisplay.innerText = "Errore: " + e.code;
                        }
                    };
                    container.appendChild(btn);
                }
            }
        });
    } catch (err) {
        titleDisplay.innerText = "Errore caricamento lista";
    }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
