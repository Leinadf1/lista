<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TV Simple</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 20px; }
        .btn { background: #333; color: #00d2ff; border: 1px solid #444; padding: 10px 2px; cursor: pointer; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .btn:hover { background: #00d2ff; color: #000; }
        .video-win { width: 100%; max-width: 700px; margin: auto; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="chan-name">Seleziona Canale</div>
    <div class="video-win" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>
    <div id="list" class="grid"></div>

<script>
async function start() {
    const video = document.getElementById('video');
    const player = video['ui'].getControls().getPlayer();

    try {
        const res = await fetch('lista_privata.m3u');
        const data = await res.text();
        const items = data.split('#EXTINF');

        items.forEach(item => {
            if (item.includes('license_key=')) {
                const lines = item.split('\n');
                let name = "Canale";
                for (let l of lines) { if (l.includes(',') && !l.includes('license')) { name = l.split(',').pop().trim(); break; } }
                const url = item.match(/https?:\/\/[^\s"|]+/)?.[0];
                const keys = item.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (url && keys) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = name;
                    btn.onclick = async () => {
                        document.getElementById('chan-name').innerText = name;
                        player.configure({ drm: { clearKeys: { [keys[1]]: keys[2] } } });
                        try { await player.load(url); } catch (e) { alert("Errore: " + e.code); }
                    };
                    document.getElementById('list').appendChild(btn);
                }
            }
        });
    } catch (e) { console.error("Lista non trovata"); }
}
document.addEventListener('shaka-ui-loaded', start);
</script>
</body>
</html>
