<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>CHANNELS PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; --border: #1e232d; }
    body { background-color: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 0; }
    
    /* Login */
    #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
    #lock input { background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 4px; margin-bottom: 10px; text-align: center; }
    #lock button { background: var(--blue); color: black; border: none; padding: 10px 30px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    /* Layout */
    .container { padding: 20px; max-width: 1000px; margin: auto; }
    .video-box { margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    
    /* Bottoni stile nodrm */
    .chan-card { 
        background: var(--card); border: 1px solid var(--border); color: white; padding: 15px; 
        cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold; transition: 0.2s;
    }
    .chan-card:hover { border-color: #444; background: #1c212a; }
    .hidden { display: none !important; }
</style>
</head>
<body>

<div id="lock">
    <div style="margin-bottom: 20px; font-size: 20px; font-weight: 900; color: var(--blue);">AREA RISERVATA</div>
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()">ACCEDI</button>
</div>

<div id="app" class="hidden">
    <div class="container">
        <h2 id="title" style="font-size: 18px; margin-bottom: 15px;">Seleziona Canale</h2>
        
        <div class="video-box">
            <div data-shaka-player-container>
                <video autoplay data-shaka-player id="video" style="width:100%; height:100%;"></video>
            </div>
        </div>

        <div id="list" class="grid"></div>
    </div>
</div>

<script>
function login() {
    if(document.getElementById('pw').value === "1234") {
        document.getElementById('lock').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
    } else { alert("Sbagliata!"); }
}

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    try {
        const res = await fetch('lista_privata.m3u');
        const data = await res.text();
        const container = document.getElementById('list');
        
        // Parsing migliorato per evitare l'errore dello screenshot
        const blocks = data.split('#EXTINF');

        blocks.forEach(block => {
            if (block.includes('license_key=')) {
                // Prende il nome pulito ignorando i parametri extra
                const name = block.split(',').pop().split('\n')[0].trim();
                const url = block.match(/https?:\/\/[^\s"|]+/)?.[0];
                const keys = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (url && keys) {
                    const btn = document.createElement('div');
                    btn.className = 'chan-card';
                    btn.innerText = name;
                    
                    btn.onclick = async () => {
                        document.getElementById('title').innerText = "Caricamento: " + name;
                        player.configure({ drm: { clearKeys: { [keys[1]]: keys[2] } } });
                        try {
                            await player.load("https://corsproxy.io/?url=" + encodeURIComponent(url));
                            document.getElementById('title').innerText = name;
                        } catch (e) {
                            try { await player.load(url); document.getElementById('title').innerText = name; } catch (e2) {}
                        }
                    };
                    container.appendChild(btn);
                }
            }
        });
    } catch (err) { console.error("Errore M3U"); }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
