<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Single Stream Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    body { background-color: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
    .center { margin: auto; width: 60%; text-align: center; }
    video { width: 100%; height: 100%; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    /* Griglia canali pulita */
    .channels { margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; justify-content: center; }
    .btn { background: #333; color: white; border: 1px solid #444; padding: 15px 5px; cursor: pointer; border-radius: 6px; font-size: 12px; font-weight: bold; transition: 0.3s; }
    .btn:hover { background: #00d2ff; color: black; }
</style>
</head>
<body>

<div class="center">
    <h2 id="title" style="color: #00d2ff;">Seleziona Canale</h2>
</div>

<div class="center" style="max-width:45em" data-shaka-player-container>
    <video autoplay data-shaka-player id="video"></video>
</div>

<div id="list" class="channels"></div>

<script>
async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    try {
        const res = await fetch('lista_privata.m3u');
        const data = await res.text();
        const container = document.getElementById('list');
        
        // Dividiamo per blocco EXTINF
        const items = data.split('#EXTINF');

        items.forEach(item => {
            if (item.includes('license_key=')) {
                // ESTRAZIONE NOME: Cerchiamo la riga che ha la virgola e il nome vero
                const lines = item.split('\n');
                let name = "Canale";
                for (let line of lines) {
                    // Evitiamo le righe tecniche come Gecko o license_key
                    if (line.includes(',') && !line.includes('license_key') && !line.includes('user-agent')) {
                        name = line.split(',').pop().trim();
                        break;
                    }
                }

                // Estraiamo URL e Chiavi ClearKey
                const urlMatch = item.match(/https?:\/\/[^\s"|]+/);
                const url = urlMatch ? urlMatch[0] : null;
                const keys = item.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (url && keys) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = name;
                    
                    btn.onclick = async () => {
                        document.getElementById('title').innerText = "Caricamento: " + name;
                        
                        // Configurazione DRM
                        player.configure({
                            drm: { clearKeys: { [keys[1]]: keys[2] } }
                        });

                        // NUOVO PROXY: Risolve l'errore 403 Forbidden di corsproxy
                        const proxy = "https://api.allorigins.win/raw?url=";
                        
                        try {
                            // Tentativo 1 con Proxy AllOrigins
                            await player.load(proxy + encodeURIComponent(url));
                            document.getElementById('title').innerText = "In riproduzione: " + name;
                        } catch (e) {
                            // Tentativo 2 diretto (fallback)
                            try {
                                await player.load(url);
                                document.getElementById('title').innerText = "In riproduzione: " + name;
                            } catch (e2) {
                                document.getElementById('title').innerText = "Errore: " + e2.code;
                            }
                        }
                    };
                    container.appendChild(btn);
                }
            }
        });
    } catch (err) {
        console.error("Errore caricamento lista");
    }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
