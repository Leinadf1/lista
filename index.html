<script>
const SOURCE_URL = "https://nodrm.online/list/list2.m3u";

async function fetchList() {
    // Ho messo per primi i proxy che passano meglio su mobile
    const proxies = [
        "https://api.codetabs.com/v1/proxy/?quest=",
        "https://cors-proxy.htmldriven.com/?url=",
        "https://api.allorigins.win/raw?url="
    ];

    for (let proxy of proxies) {
        try {
            console.log("Provando proxy:", proxy);
            const res = await fetch(proxy + encodeURIComponent(SOURCE_URL));
            const text = await res.text();
            if (text && text.includes('#EXTM3U')) {
                console.log("Sincronizzazione riuscita con:", proxy);
                return text;
            }
        } catch (e) { console.warn("Proxy fallito:", proxy); }
    }
    return null;
}

// ... il resto della funzione init() rimane identico a prima ...
async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const container = document.getElementById('list');
    const countHeader = document.getElementById('chan-count');
    player.configure({ streaming: { jumpLargeGaps: true } });

    function createCard(name, logo, url, drmConfig) {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `<div class="logo-box"><img src="${logo}"></div><div class="info-box"><div class="name">${name}</div></div>`;
        card.onclick = async () => {
            player.configure({ drm: { clearKeys: drmConfig } });
            await player.load(url);
            window.scrollTo({top: 0, behavior: 'smooth'});
        };
        container.appendChild(card);
    }

    const listData = await fetchList();
    let liveCount = 0;

    if (listData) {
        const blocks = listData.split('#EXTINF');
        blocks.forEach(block => {
            const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
            const urlMatch = block.match(/https?:\/\/[^\s"|]+\.mpd/i);
            const nameMatch = block.match(/,(.*)/);
            if (keyMatch && urlMatch && nameMatch) {
                liveCount++;
                const logoMatch = block.match(/tvg-logo="([^"]+)"/i);
                createCard(nameMatch[1].trim(), logoMatch ? logoMatch[1] : '', urlMatch[0], { [keyMatch[1]]: keyMatch[2] });
            }
        });
    }

    // Qui aggiungi i tuoi 7 canali fissi (EUROSPORT ecc.)
    // ...
    countHeader.innerText = (liveCount + 7) + " CANALI CARICATI";
}
document.addEventListener('shaka-ui-loaded', init);
