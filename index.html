<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard PRO - Categorie</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        h1 { font-size: 24px; color: #58a6ff; margin: 0; }
        #chan-count { color: #8b949e; font-weight: bold; }
        
        .player-container { width: 100%; max-width: 850px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 35px; border: 1px solid #30363d; position: sticky; top: 10px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        video { width: 100%; aspect-ratio: 16/9; }

        .category-container { width: 100%; max-width: 1200px; margin-bottom: 40px; }
        .category-title { font-size: 18px; color: #f1e05a; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; border-left: 4px solid #58a6ff; padding-left: 10px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .channel-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; cursor: pointer; transition: 0.2s; overflow: hidden; display: flex; flex-direction: column; }
        .channel-card:hover { transform: translateY(-5px); border-color: #58a6ff; }
        .channel-card.active { border: 2px solid #58a6ff; background-color: #21262d; }
        
        .logo-box { width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; background: #21262d; padding: 10px; box-sizing: border-box; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .info-box { padding: 12px; text-align: center; border-top: 1px solid #30363d; background: #161b22; }
        .name { font-size: 13px; font-weight: 600; color: #f0f6fc; text-transform: uppercase; word-wrap: break-word; }
    </style>
</head>
<body>

    <div id="header">
        <h1>Dashboard</h1>
        <div id="chan-count">Caricamento...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="main-list"></div>

<script>
const SOURCE_URL = "https://raw.githubusercontent.com/Leinadf1/lista/main/lista_privata.m3u";

const CANALI_FISSI = [
    { name: "EUROSPORT 4K", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020019/tim-ouah/CHN43FN/MONOGRAM_ESP4K_WHITE_V2-BjK0", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport4k)/manifest.mpd", drm: {"9ceae06c6ad34aada83ba86c0b511452":"406862beb4af1ef8fe04ba15d9936360","fcd924bd2e45470fa2ae50ef05e357c0":"266db84d3572bc889185274a90ff31df","dea135e33341468f8a4e8da806d8a6e6":"fb7423db39e6fab75056f8c83f415847","31911db90ee3410f8b38e45659d01fb1":"ac316ab7dfd2b50faf6d44633e4fedd5","a16f2a39adbb4974b8910cec8a651a09":"c2d55e0111af955f47214af209a2c468"} },
    { name: "EUROSPORT 1", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020000/tim-ouah/CHN43FN/MONOGRAM_ESP1_WHITE_V2-Lv2g", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport1)/manifest.mpd", drm: {"46e559c2f9f645ce8d80c7fa20446bdb":"597d214d66342ee042bccffeb165e750"} }
];

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const mainList = document.getElementById('main-list');
    const countHeader = document.getElementById('chan-count');

    player.configure({ streaming: { jumpLargeGaps: true } });

    const categories = {};

    function getCategoryGrid(groupName) {
        const name = (groupName || "ALTRI").toUpperCase().trim();
        if (!categories[name]) {
            const container = document.createElement('div');
            container.className = 'category-container';
            container.innerHTML = `<div class="category-title">${name}</div><div class="grid" id="grid-${name.replace(/[^a-z0-9]/gi, '-')}"></div>`;
            mainList.appendChild(container);
            categories[name] = document.getElementById(`grid-${name.replace(/[^a-z0-9]/gi, '-')}`);
        }
        return categories[name];
    }

    function createCard(ch) {
        const grid = getCategoryGrid(ch.group);
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `
            <div class="logo-box"><img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/100x50?text=TV'"></div>
            <div class="info-box"><div class="name">${ch.name}</div></div>
        `;
        
        card.onclick = async () => {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            try {
                await player.unload();
                player.configure({ drm: { clearKeys: (ch.drm && Object.keys(ch.drm).length > 0) ? ch.drm : {} } });
                await player.load(ch.url);
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch(e) { console.error("Errore Shaka:", e.code); }
        };
        grid.appendChild(card);
    }

    try {
        const response = await fetch(SOURCE_URL + "?t=" + Date.now());
        const text = await response.text();
        const lines = text.split('\n');

        let currentChannel = { name: "", logo: "", group: "ALTRI", drm: {}, url: "" };
        let loadedCount = 0;

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
                const keyData = line.split('=')[1];
                if (keyData.startsWith('{')) {
                    try { currentChannel.drm = JSON.parse(keyData); } catch(e) {}
                } else {
                    const parts = keyData.split(':');
                    if (parts.length === 2) currentChannel.drm[parts[0].toLowerCase()] = parts[1].toLowerCase();
                }
            } 
            else if (line.startsWith('#EXTINF:')) {
                const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                const groupMatch = line.match(/group-title="([^"]+)"/i);
                const nameMatch = line.match(/,(.*)/);
                
                if (logoMatch) currentChannel.logo = logoMatch[1];
                if (groupMatch) currentChannel.group = groupMatch[1];
                if (nameMatch) currentChannel.name = nameMatch[1].trim();
            } 
            else if (line.startsWith('http')) {
                currentChannel.url = line;
                // Una volta trovato l'URL, il canale è completo: lo creiamo
                createCard(currentChannel);
                loadedCount++;
                // Resetta per il prossimo canale
                currentChannel = { name: "", logo: "", group: "ALTRI", drm: {}, url: "" };
            }
        }

        CANALI_FISSI.forEach(ch => {
            createCard({ ...ch, group: "EUROSPORT" });
        });

        countHeader.innerText = (loadedCount + CANALI_FISSI.length) + " CANALI PRONTI";

    } catch(e) { console.error("Errore lista:", e); }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
