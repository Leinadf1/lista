<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard ULTRA</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        /* Stile Generale scuro basato sullo screenshot */
        body { 
            background-color: #0d1017; /* Sfondo pagina scuro */
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* Container Player fisso */
        .player-container { 
            width: 100%; 
            max-width: 850px; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #21262d; 
            position: sticky; 
            top: 10px; 
            z-index: 100; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
            margin-bottom: 30px; 
        }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        /* Griglia Canali */
        .category-section { width: 100%; max-width: 1300px; margin-bottom: 35px; }
        
        /* Titolo Categoria giallo come nello screen */
        .category-title { 
            font-size: 16px; 
            color: #f1e05a; 
            margin-bottom: 18px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }

        /* Configurazione Griglia per Box compatti */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); 
            gap: 12px; 
        }

        /* STILE DEL BOX CANALE (CARD) simile allo screenshot */
        .card { 
            background-color: #1c2128; /* Sfondo scuro e unito per il box */
            border: 1px solid #21262d; 
            border-radius: 8px; /* Angoli leggermente arrotondati */
            cursor: pointer; 
            padding: 12px; 
            transition: all 0.2s ease-in-out; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; /* Allineamento a sinistra del testo */
            justify-content: flex-start;
            min-height: 100px; /* Altezza minima compact */
            position: relative;
        }

        /* Hover effect */
        .card:hover { 
            border-color: #4a5a7a; 
            background-color: #21262d; 
            transform: translateY(-2px); 
        }

        /* Canale Attivo con bordo giallo */
        .card.active { 
            border: 2px solid #f1e05a; 
            background-color: #21262d; 
            box-shadow: 0 0 15px rgba(241, 224, 90, 0.2);
        }

        /* Logo Canale compatto e centrato */
        .card img { 
            width: 100%; 
            height: 45px; /* Altezza fissa compact */
            object-fit: contain; 
            margin-bottom: 10px; 
            display: block;
        }

        /* Container Testo */
        .card-info {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: auto; /* Sposta il testo in fondo */
        }

        /* Nome Canale pulito (es. "Sky Uno") */
        .name { 
            font-size: 11px; 
            font-weight: 600; 
            color: #f0f6fc; 
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Sotto-testo Categoria grigio (es. "SKY IT CINEMA") */
        .group-tag {
            font-size: 9px;
            color: #8b949e; /* Grigio come nello screenshot */
            text-transform: uppercase;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Icona TV opzionale nel titolo */
        .tv-icon {
            font-size: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }

    </style>
</head>
<body>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="categories-container"></div>

            const section = document.createElement('div');
            section.className = 'category-section';
            // Aggiunta opzionale di un'icona TV prima del titolo
            section.innerHTML = `<div class="category-title"><span class="tv-icon">📺</span>${name}</div><div class="grid" id="grid-${name.replace(/\s+/g, '-')}"></div>`;

            categories[name] = document.getElementById(`grid-${name.replace(/\s+/g, '-')}`);
