<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV PLAYER FINAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>
    <style>
        :root { --bg: #0b0e11; --blue: #00d2ff; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #app { display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .card { background: #151921; border-radius: 8px; padding: 10px; border: 1px solid #333; text-align: center; cursor: pointer; }
        .card img { width: 100%; height: 50px; object-fit: contain; }
        #player-overlay { position: fixed; inset: 0; background: #000; display: none; z-index: 10000; flex-direction: column; }
        #debug-log { position: absolute; bottom: 50px; left: 10px; font-size: 10px; color: yellow; pointer-events: none; }
    </style>
</head>
<body>

<div id="lock">
    <input type="password" id="pw" placeholder="PASSWORD" style="padding:10px; margin-bottom:10px;">
    <button onclick="login()" style="padding:10px 30px; background:var(--blue); border:none; font-weight:bold;">ENTRA</button>
</div>

<div id="app">
    <h3 style="border-bottom:1px solid #333; padding-bottom:10px;">📺 LISTA CANALI</h3>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div style="display:flex; justify-content:space-between; padding:10px; background:#111;">
        <b id="p-name">Canale</b>
        <button onclick="closePlayer()" style="color:red; background:none; border:none; font-weight:bold;">CHIUDI ✕</button>
    </div>
    <div id="video-container" style="width:100%; height:100%;">
        <video id="video" autoplay crossorigin="anonymous" style="width:100%; height:100%;"></video>
    </div>
    <div id="debug-log"></div>
</div>

<script>
    let player;

    function log(msg) { document.getElementById('debug-log').innerText = msg; }

    function login() {
        if(document.getElementById('pw').value === "1234") {
            document.getElementById('lock').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadM3U();
        }
    }

    async function loadM3U() {
        const res = await fetch("./lista_privata.m3u");
        const data = await res.text();
        const grid = document.getElementById('grid');
        const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');

        blocks.forEach(block => {
            if (block.includes('#EXTINF')) {
                const url = block.match(/https?:\/\/\S+/)?.[0];
                const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                const name = block.split(',').pop().split('\n')[0].trim();
                const logo = block.match(/tvg-logo="(.*?)"/)?.[1] || "";
                const ua = block.match(/user-agent=(.*?)\n/i)?.[1]?.trim() || "";

                if (url && keyMatch) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => play(url, name, keyMatch[1], keyMatch[2], ua);
                    card.innerHTML = `<img src="${logo}"><div>${name}</div>`;
                    grid.appendChild(card);
                }
            }
        });
    }

    async function play(url, name, kid, key, ua) {
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('p-name').innerText = name;
        log("Inizializzazione...");

        const video = document.getElementById('video');
        if (player) await player.destroy();
        
        player = new shaka.Player(video);
        const ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);
        ui.configure({'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'fullscreen']});

        // Configurazione DRM obbligatoria
        player.configure({ drm: { clearKeys: { [kid]: key } } });

        // FILTRO RETE FORZATO: Passa tutto dal proxy Vercel
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            const originalUrl = request.uris[0];
            if (!originalUrl.includes('/api/proxy')) {
                request.uris = [window.location.origin + '/api/proxy?url=' + encodeURIComponent(originalUrl) + '&ua=' + encodeURIComponent(ua)];
            }
        });

        try {
            log("Caricamento flusso via proxy...");
            await player.load(url);
            log("Riproduzione in corso");
        } catch(e) {
            log("Errore: " + e.code);
            console.error(e);
            if(e.code === 4000) alert("Errore 4000: Il server Vercel ha rifiutato la connessione.");
        }
    }

    function closePlayer() {
        if(player) player.destroy();
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
