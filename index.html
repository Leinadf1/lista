<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        
        #header { 
            width: 100%; 
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px; 
            border-bottom: 1px solid #30363d; 
            padding-bottom: 15px; 
            box-sizing: border-box; 
        }
        
        #reload-btn { 
            font-size: 22px; 
            font-weight: 700; 
            color: #58a6ff; 
            background: none; 
            border: none; 
            cursor: pointer; 
            padding: 0; 
            margin: 0; 
            letter-spacing: -0.5px; 
            justify-self: start;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #reload-btn:hover { opacity: 0.8; }
        #reload-btn:disabled { opacity: 0.5; cursor: wait; }
        #reload-icon { font-size: 18px; }
        
        #search-container {
            display: flex;
            justify-content: center;
            justify-self: center;
            width: 100%;
            max-width: 400px;
        }
        #search-input {
            width: 100%;
            max-width: 400px;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #30363d;
            background-color: #161b22;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        #search-input:focus {
            border-color: #58a6ff;
        }
        
        #chan-count { 
            font-size: 13px; 
            color: #8b949e; 
            font-weight: 600; 
            background: #21262d; 
            padding: 4px 12px; 
            border-radius: 20px; 
            justify-self: end;
        }
        
        .player-container { 
            position: relative;
            width: 100%; 
            max-width: 820px; 
            margin: 0 auto 10px;
            background: #000; 
            z-index: 10; 
        }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20;
            display: none;
            overflow: hidden;
        }
        .iframe-container.active {
            display: block;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            overflow: hidden;
        }

        #expiry-info {
            text-align: center;
            margin: 5px auto 25px;
            color: #f1e05a;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
            width: 100%;
        }

        .category-container { 
            width: 100%; 
            margin: 0 auto 45px;
            box-sizing: border-box; 
        }
        .category-title { 
            font-size: 16px; 
            color: #f1e05a; 
            margin-bottom: 20px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        .category-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: #58a6ff;
            margin-right: 12px;
            border-radius: 2px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            width: 100%;
        }
        
        .channel-card { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            position: relative; /* per la stella */
        }
        .channel-card:hover { 
            transform: translateY(-5px); 
            border-color: #58a6ff; 
            background-color: #1c2128;
        }
        .channel-card.active { 
            border: 2px solid #58a6ff; 
            background-color: #21262d; 
        }
        
        .fav-star {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 18px;
            color: #8b949e;
            cursor: pointer;
            z-index: 5;
            user-select: none;
            transition: color 0.2s;
        }
        .fav-star.active {
            color: #f1c40f;
        }
        .fav-star:hover {
            color: #f1c40f;
        }
        
        .logo-box { 
            width: 100%; 
            height: 100px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #0d1117; 
            padding: 15px; 
            box-sizing: border-box; 
        }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .info-box { 
            padding: 12px; 
            text-align: center; 
            border-top: 1px solid #30363d; 
            background: #161b22; 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .name { 
            font-size: 13.5px; 
            font-weight: 600; 
            color: #f0f6fc; 
            text-transform: uppercase; 
            line-height: 1.3;
        }

        @media (max-width: 600px) {
            .grid { 
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
                gap: 12px; 
            }
            .logo-box { height: 80px; padding: 10px; }
            .name { font-size: 11.5px; }
            body { padding: 10px; }
            
            #header {
                grid-template-columns: 1fr auto;
                grid-template-rows: auto auto;
                gap: 10px;
            }
            #reload-btn { justify-self: start; }
            #chan-count { justify-self: end; }
            #search-container {
                grid-column: 1 / -1;
                grid-row: 2;
                width: 100%;
                max-width: 100%;
                padding: 0;
            }
        }
    </style>
</head>
<body id="mainBody" style="display:none;">

    <div id="header">
        <button id="reload-btn" title="Ricarica playlist">
            <span id="reload-icon">🔄</span> DASHBOARD TV
        </button>
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Cerca canali o categorie...">
        </div>
        <div id="chan-count">Caricamento...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="expiry-info"></div>

    <div id="main-list" style="width: 100%;"></div>

<script type="module">
let passwordGlobale = "";
let heartbeatInterval;
const FAVORITES_KEY = 'favoriteChannels';
let favoriteIds = new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'));
let allChannels = []; // array di oggetti canale per i preferiti

function startHeartbeat(password) {
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(async () => {
        try {
            await fetch("/api/get-list", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-heartbeat': 'true' },
                body: JSON.stringify({ password: password })
            });
        } catch (e) { console.warn("Sessione persa"); }
    }, 15000);
}

function getExpiryFromUrl(url) {
    let match = url.match(/e~(\d+)/);
    if (match) {
        const ts = parseInt(match[1]) * 1000;
        const now = Date.now();
        if (now > ts) return "Scaduto";
        return new Date(ts).toLocaleString('it-IT', { timeZone: 'Europe/Rome' });
    }

    match = url.match(/@(eyJ[A-Za-z0-9\-_]+?\.[A-Za-z0-9\-_]+?\.[A-Za-z0-9\-_]+)/);
    if (match) {
        try {
            const token = match[1];
            const payloadBase64 = token.split('.')[1];
            const payloadJson = atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'));
            const payload = JSON.parse(payloadJson);
            if (payload.exp) {
                const exp = payload.exp * 1000;
                const now = Date.now();
                if (now > exp) return "Scaduto";
                return new Date(exp).toLocaleString('it-IT', { timeZone: 'Europe/Rome' });
            }
        } catch (e) {}
    }

    return null;
}

function getKidKey(drm) {
    if (!drm || typeof drm !== 'object') return null;
    const entries = Object.entries(drm);
    if (entries.length === 0) return null;
    const [kid, key] = entries[0];
    return { kid, key };
}

async function checkAccess() {
    const psw = prompt("Password:");
    if (!psw) return;

    try {
        const response = await fetch("/api/get-list", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: psw })
        });

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            alert(errorData.error || "Sessione già attiva o password errata!");
            window.location.reload();
            return;
        }

        const m3uEncoded = await response.text();
        const m3uData = atob(m3uEncoded);
        
        passwordGlobale = psw;
        document.getElementById('mainBody').style.display = "flex";
        document.getElementById('expiry-info').textContent = '';
        startHeartbeat(psw);
        
        fetch('https://dazn-ua-proxy.stefanoaccuont.workers.dev/', { mode: 'no-cors' })
            .catch(() => {});

        init(m3uData);

    } catch (error) {
        alert("Errore server.");
    }
}

async function reloadPlaylist() {
    if (!passwordGlobale) return;
    const btn = document.getElementById('reload-btn');
    btn.disabled = true;
    btn.querySelector('#reload-icon').textContent = '⏳';
    try {
        const response = await fetch("/api/get-list", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordGlobale })
        });
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            alert(errorData.error || "Errore nel ricaricamento");
            return;
        }
        const m3uEncoded = await response.text();
        const m3uData = atob(m3uEncoded);
        // Pulisci la lista attuale
        document.getElementById('main-list').innerHTML = '';
        // Rimuovi eventuali categorie preferiti precedenti
        // (verrà ricreata da renderFavorites)
        allChannels = [];
        init(m3uData);
    } catch (e) {
        alert("Errore di rete");
    } finally {
        btn.disabled = false;
        btn.querySelector('#reload-icon').textContent = '🔄';
    }
}

async function init(m3uContent) {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const mainList = document.getElementById('main-list');
    const countHeader = document.getElementById('chan-count');
    const expiryDiv = document.getElementById('expiry-info');
    const playerContainer = document.querySelector('.player-container');

    player.configure({ streaming: { jumpLargeGaps: true } });

    // Funzione per creare l'elemento card (senza aggiungerlo al DOM)
    function createCardElement(ch) {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.dataset.id = ch.id;
        card.innerHTML = `
            <span class="fav-star ${favoriteIds.has(ch.id) ? 'active' : ''}">★</span>
            <div class="logo-box"><img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150x80?text=TV'"></div>
            <div class="info-box"><div class="name">${ch.name}</div></div>
        `;
        
        // Listener stella preferiti
        const star = card.querySelector('.fav-star');
        star.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFavorite(ch.id);
        });

        card.addEventListener('click', async () => {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            
            if (expiryDiv) {
                const expiry = ch.expiry;
                if (expiry) {
                    expiryDiv.textContent = `⏳ ${expiry === "Scaduto" ? "Scaduto" : `Scade il: ${expiry}`}`;
                } else {
                    expiryDiv.textContent = '';
                }
            }

            const oldIframeContainer = playerContainer.querySelector('.iframe-container');
            if (oldIframeContainer) oldIframeContainer.remove();

            const groupName = (ch.group || '').toUpperCase();
            if (groupName === 'PRIME VIDEO') {
                const { kid, key } = getKidKey(ch.drm);
                if (kid && key && ch.url) {
                    const iframeContainer = document.createElement('div');
                    iframeContainer.className = 'iframe-container active';
                    const iframe = document.createElement('iframe');
                    iframe.id = 'prime-iframe';
                    iframe.setAttribute('scrolling', 'no');
                    iframe.setAttribute('allowfullscreen', '');
                    iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
                    iframe.src = `https://hugoedgar.com/drm-player/?embed-url=${encodeURIComponent(ch.url)}&kid=${encodeURIComponent(kid)}&key=${encodeURIComponent(key)}`;
                    iframeContainer.appendChild(iframe);
                    playerContainer.appendChild(iframeContainer);
                    await player.unload();
                } else {
                    alert("Canale Prime Video non valido");
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            player.configure({ drm: { clearKeys: ch.drm || {} } });

            if (ch.streamHeaders && Object.keys(ch.streamHeaders).length > 0) {
                player.configure({ streaming: { customHttpHeaders: ch.streamHeaders } });
            } else {
                player.configure({ streaming: { customHttpHeaders: {} } });
            }

            await player.load(ch.url);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        return card;
    }

    function toggleFavorite(id) {
        if (favoriteIds.has(id)) {
            favoriteIds.delete(id);
        } else {
            favoriteIds.add(id);
        }
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(favoriteIds)));
        updateFavoriteUI();
        renderFavorites();
    }

    function updateFavoriteUI() {
        document.querySelectorAll('.channel-card').forEach(card => {
            const star = card.querySelector('.fav-star');
            if (star) {
                const id = card.dataset.id;
                if (favoriteIds.has(id)) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            }
        });
    }

    function renderFavorites() {
        // Rimuovi eventuale categoria Preferiti esistente
        const existingFav = document.getElementById('favorites-category');
        if (existingFav) existingFav.remove();

        const favChannels = allChannels.filter(ch => favoriteIds.has(ch.id));
        if (favChannels.length === 0) return;

        const container = document.createElement('div');
        container.className = 'category-container';
        container.id = 'favorites-category';
        container.innerHTML = `
            <div class="category-title">Preferiti</div>
            <div class="grid" id="favorites-grid"></div>
        `;
        mainList.prepend(container);
        const grid = container.querySelector('#favorites-grid');
        favChannels.forEach(ch => {
            grid.appendChild(createCardElement(ch));
        });
    }

    // Parsing M3U
    const lines = m3uContent.split('\n');
    let currentChannel = { 
        name: "", 
        logo: "", 
        group: "LISTA", 
        drm: {}, 
        url: "", 
        streamHeaders: {},
        userAgent: null,
        id: ""
    };
    let loadedCount = 0;

    for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
            const val = line.split('=')[1];
            try {
                currentChannel.drm = JSON.parse(val);
            } catch (e) {
                const parts = val.split(':');
                if (parts.length === 2) currentChannel.drm[parts[0].toLowerCase()] = parts[1].toLowerCase();
            }
        } 
        else if (line.startsWith('#KODIPROP:inputstream.adaptive.stream_headers=')) {
            const val = line.split('=')[1];
            if (val) {
                const pairs = val.split('&');
                pairs.forEach(pair => {
                    const [headerKey, headerValue] = pair.split('=');
                    if (headerKey && headerValue) {
                        currentChannel.streamHeaders[headerKey.trim()] = headerValue.trim();
                    }
                });
            }
        }
        else if (line.startsWith('#EXTVLCOPT:http-user-agent=')) {
            currentChannel.userAgent = line.substring(line.indexOf('=') + 1).trim();
        }
        else if (line.startsWith('#EXTINF:')) {
            const logo = line.match(/tvg-logo="([^"]+)"/i);
            const group = line.match(/group-title="([^"]+)"/i);
            const name = line.match(/,(.*)/);
            if (logo) currentChannel.logo = logo[1];
            if (group) currentChannel.group = group[1];
            if (name) currentChannel.name = name[1].trim();
        } 
        else if (line.startsWith('http')) {
            let url = line;
            const targetUA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36 Edg/151.0.0.0';
            
            const isNeroZone = currentChannel.group && currentChannel.group.toLowerCase().includes('nerozone');
            const isDazn1Lineare = 
                currentChannel.name && currentChannel.name.toLowerCase() === 'dazn 1' &&
                currentChannel.group && currentChannel.group.toLowerCase() === 'dazn lineari';
            
            if (!isNeroZone && !isDazn1Lineare && 
                (url.includes('dca-fs-live-dazn-cdn.dazn.com') || currentChannel.userAgent === targetUA)) {
                url = 'https://dazn-ua-proxy.stefanoaccuont.workers.dev/' + url;
            }
            
            currentChannel.url = url;
            currentChannel.expiry = getExpiryFromUrl(line);
            // Genera ID univoco
            currentChannel.id = `${currentChannel.name}|${currentChannel.group}|${url}`;
            
            // Salva nei preferiti per uso successivo
            allChannels.push({ ...currentChannel });
            
            // Crea la card nella categoria originale
            createCardElement(currentChannel);
            loadedCount++;
            
            currentChannel = { 
                name: "", 
                logo: "", 
                group: "LISTA", 
                drm: {}, 
                url: "", 
                streamHeaders: {},
                userAgent: null,
                id: ""
            };
        }
    }

    // Ora crea le categorie con le card già pronte
    // (abbiamo già aggiunto le card direttamente alle griglie? No, dobbiamo ancora farlo)
    // Riscriviamo la logica di creazione categorie:
    // In realtà prima chiamavamo createCard che aggiungeva alla griglia della categoria.
    // Ora createCardElement non aggiunge alla griglia. Dobbiamo creare le griglie e poi appendere le card.
    // Per semplicità, rifacciamo il parsing con createCard che fa tutto.
    // Ma per non riscrivere troppo, possiamo mantenere createCard ma separare.
    // Però ho già scritto createCardElement, quindi lo uso.
    
    // NOTA: La parte sopra non aggiunge le card alle griglie! Dobbiamo correggere.
    // Semplice soluzione: ricreo la funzione createCard che usi createCardElement.
    
    // Svuoto mainList e riparto da zero per evitare duplicati
    mainList.innerHTML = '';
    allChannels = [];
    loadedCount = 0;
    // Riprocesso la M3U con la funzione corretta
    processM3U(m3uContent);
    
    countHeader.innerText = loadedCount + " CANALI";
    renderFavorites();
    
    // Aggiungi listener ricerca
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase().trim();
        const categories = document.querySelectorAll('.category-container');
        
        categories.forEach(cat => {
            const categoryTitle = cat.querySelector('.category-title').textContent.toLowerCase();
            const cards = cat.querySelectorAll('.channel-card');
            let categoryMatches = categoryTitle.includes(query);
            
            if (query === '') {
                cat.style.display = '';
                cards.forEach(card => card.style.display = '');
                return;
            }
            
            if (categoryMatches) {
                cat.style.display = '';
                cards.forEach(card => card.style.display = '');
            } else {
                let anyCardMatch = false;
                cards.forEach(card => {
                    const cardName = card.querySelector('.name').textContent.toLowerCase();
                    if (cardName.includes(query)) {
                        card.style.display = '';
                        anyCardMatch = true;
                    } else {
                        card.style.display = 'none';
                    }
                });
                cat.style.display = anyCardMatch ? '' : 'none';
            }
        });
    });

    // Funzione processM3U definita dentro init
    function processM3U(content) {
        const lines = content.split('\n');
        let currentChannel = { name: "", logo: "", group: "LISTA", drm: {}, url: "", streamHeaders: {}, userAgent: null, id: "" };
        
        for (let line of lines) {
            line = line.trim();
            if (line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
                const val = line.split('=')[1];
                try {
                    currentChannel.drm = JSON.parse(val);
                } catch (e) {
                    const parts = val.split(':');
                    if (parts.length === 2) currentChannel.drm[parts[0].toLowerCase()] = parts[1].toLowerCase();
                }
            } 
            else if (line.startsWith('#KODIPROP:inputstream.adaptive.stream_headers=')) {
                const val = line.split('=')[1];
                if (val) {
                    const pairs = val.split('&');
                    pairs.forEach(pair => {
                        const [headerKey, headerValue] = pair.split('=');
                        if (headerKey && headerValue) {
                            currentChannel.streamHeaders[headerKey.trim()] = headerValue.trim();
                        }
                    });
                }
            }
            else if (line.startsWith('#EXTVLCOPT:http-user-agent=')) {
                currentChannel.userAgent = line.substring(line.indexOf('=') + 1).trim();
            }
            else if (line.startsWith('#EXTINF:')) {
                const logo = line.match(/tvg-logo="([^"]+)"/i);
                const group = line.match(/group-title="([^"]+)"/i);
                const name = line.match(/,(.*)/);
                if (logo) currentChannel.logo = logo[1];
                if (group) currentChannel.group = group[1];
                if (name) currentChannel.name = name[1].trim();
            } 
            else if (line.startsWith('http')) {
                let url = line;
                const targetUA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36 Edg/151.0.0.0';
                
                const isNeroZone = currentChannel.group && currentChannel.group.toLowerCase().includes('nerozone');
                const isDazn1Lineare = currentChannel.name && currentChannel.name.toLowerCase() === 'dazn 1' && currentChannel.group && currentChannel.group.toLowerCase() === 'dazn lineari';
                
                if (!isNeroZone && !isDazn1Lineare && (url.includes('dca-fs-live-dazn-cdn.dazn.com') || currentChannel.userAgent === targetUA)) {
                    url = 'https://dazn-ua-proxy.stefanoaccuont.workers.dev/' + url;
                }
                
                currentChannel.url = url;
                currentChannel.expiry = getExpiryFromUrl(line);
                currentChannel.id = `${currentChannel.name}|${currentChannel.group}|${url}`;
                
                allChannels.push({ ...currentChannel });
                
                // Crea categoria se non esiste
                const catName = (currentChannel.group || "LISTA").toUpperCase().trim();
                let gridId = `grid-${catName.replace(/[^a-z0-9]/gi, '-')}`;
                let grid = document.getElementById(gridId);
                if (!grid) {
                    const container = document.createElement('div');
                    container.className = 'category-container';
                    container.innerHTML = `<div class="category-title">${catName}</div><div class="grid" id="${gridId}"></div>`;
                    mainList.appendChild(container);
                    grid = document.getElementById(gridId);
                }
                const cardElement = createCardElement(currentChannel);
                grid.appendChild(cardElement);
                
                loadedCount++;
                currentChannel = { name: "", logo: "", group: "LISTA", drm: {}, url: "", streamHeaders: {}, userAgent: null, id: "" };
            }
        }
    }
}

document.addEventListener('shaka-ui-loaded', () => {
    // Aggiungi listener al pulsante di reload
    document.getElementById('reload-btn').addEventListener('click', reloadPlaylist);
    checkAccess();
});
</script>
</body>
</html>
