<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>TV Dashboard – Final Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background-color: #262626; color: white; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .center { margin: auto; width: 60%; }
        video { width: 100%; aspect-ratio: 16/9; background: black; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 30px; }
        .btn { background: #3d3d3d; color: white; border: 1px solid #555; padding: 15px 5px; cursor: pointer; border-radius: 5px; font-size: 11px; font-weight: bold; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn:hover { background: #00d2ff; color: black; }
        .btn.active { background: #00d2ff; color: black; border: 2px solid white; }
        #status { color: #00d2ff; margin-bottom: 15px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

    <div id="status">Caricamento canali...</div>

    <div class="center" style="max-width:40em" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="list" class="grid"></div>

<script>
const LISTA_URL = "lista_privata.m3u";

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const statusHeader = document.getElementById('status');
    const container = document.getElementById('list');

    // Configurazione anti-blocco identica a Eurosport
    player.configure({
        streaming: { jumpLargeGaps: true },
        manifest: { dash: { clockSyncUri: '' } }
    });

    try {
        const res = await fetch(LISTA_URL);
        if (!res.ok) throw new Error("File M3U non trovato");
        
        const data = await res.text();
        const items = data.split('#EXTINF');
        statusHeader.innerText = "Seleziona un Canale";

        items.forEach(item => {
            if (item.includes('license_key=')) {
                // 1. Estrazione Nome
                const lines = item.split('\n');
                let name = "Canale";
                for (let l of lines) { 
                    if (l.includes(',') && !l.includes('license')) { 
                        name = l.split(',').pop().trim(); 
                        break; 
                    } 
                }

                // 2. Filtro URL: Cerca l'MPD ed evita i loghi NowTV/Sky
                const urls = item.match(/https?:\/\/[^\s"|]+/g);
                let videoUrl = null;
                if (urls) {
                    videoUrl = urls.find(u => u.includes('.mpd') || (u.includes('/channel(') && !u.includes('logo')));
                }

                // 3. Estrazione Chiavi KID:KEY
                const keys = item.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (videoUrl && keys) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = name;
                    
                    btn.onclick = async () => {
                        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        statusHeader.innerText = "Verifica licenza: " + name;

                        // Configurazione DRM ClearKey
                        player.configure({
                            drm: { clearKeys: { [keys[1]]: keys[2] } }
                        });

                        try {
                            await player.load(videoUrl);
                            statusHeader.innerText = "In onda: " + name;
                        } catch (e) {
                            // Diagnostica specifica per chiavi errate
                            if (e.code == 6007 || e.code == 6008) {
                                statusHeader.innerText = "ERRORE: CHIAVI SCADUTE O ERRATE";
                            } else {
                                statusHeader.innerText = "Errore: " + e.code;
                            }
                            console.error("Dettaglio errore:", e);
                        }
                    };
                    container.appendChild(btn);
                }
            }
        });
    } catch (err) {
        statusHeader.innerText = "Errore caricamento lista.m3u";
    }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
