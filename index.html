<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; --yellow: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 15px; }
        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #lock input { padding: 12px; background: #000; border: 1px solid #333; color: #fff; margin-bottom: 10px; text-align: center; }
        #app { display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .card { background: var(--card); border-radius: 6px; padding: 12px; border: 1px solid #1e232d; cursor: pointer; text-align: center; }
        .card img { max-width: 100%; height: 50px; object-fit: contain; margin-bottom: 8px; }
        #player-overlay { position: fixed; inset: 0; background: #000; display: none; z-index: 10000; flex-direction: column; }
        .shaka-video-container { width: 100%; height: 100%; }
        .shaka-range-element { color: var(--yellow) !important; }
    </style>
</head>
<body>

<div id="lock">
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()" style="padding: 10px 30px; background: var(--blue); border: none; font-weight: bold;">ENTRA</button>
</div>

<div id="app">
    <h2 style="border-bottom: 1px solid #333; padding-bottom: 10px;">📺 LISTA CANALI</h2>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div style="padding: 10px; display: flex; justify-content: space-between; background: #111;">
        <span id="p-name" style="font-weight: bold;">Canale</span>
        <button onclick="closePlayer()" style="color: #ff4444; background: none; border: none; font-weight: bold; cursor: pointer;">CHIUDI ✕</button>
    </div>
    <div id="video-container" class="shaka-video-container">
        <video id="video" autoplay crossorigin="anonymous" style="width: 100%; height: 100%;"></video>
    </div>
</div>

<script>
    let player, ui;

    function login() {
        if(document.getElementById('pw').value === "1234") {
            document.getElementById('lock').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadList();
        } else { alert("Sbagliata!"); }
    }

    async function loadList() {
        const res = await fetch("./lista_privata.m3u");
        const data = await res.text();
        const grid = document.getElementById('grid');
        const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');

        blocks.forEach(block => {
            if (block.includes('#EXTINF')) {
                const url = block.match(/https?:\/\/\S+/)?.[0];
                const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                const name = block.split(',').pop().split('\n')[0].trim();
                const logo = block.match(/tvg-logo="(.*?)"/)?.[1] || "";
                const ua = block.match(/user-agent=(.*?)\n/i)?.[1]?.trim() || "";

                if (url && keyMatch) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => start(url, name, keyMatch[1], keyMatch[2], ua);
                    card.innerHTML = `<img src="${logo}"><div>${name}</div>`;
                    grid.appendChild(card);
                }
            }
        });
    }

    async function start(url, name, kid, key, ua) {
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('p-name').innerText = name;
        const video = document.getElementById('video');

        if (player) await player.destroy();
        player = new shaka.Player(video);
        ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);
        
        // Configurazione barra gialla
        ui.configure({'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'fullscreen']});

        // Configurazione DRM
        player.configure({ drm: { clearKeys: { [kid]: key } } });

        // FILTRO PROXY (Per risolvere Errore 4000/7000)
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            const originalUrl = request.uris[0];
            // Protezione contro loop: se l'URL non contiene già il proxy, lo aggiungiamo
            if (!originalUrl.includes('/api/proxy')) {
                request.uris = [window.location.origin + '/api/proxy?url=' + encodeURIComponent(originalUrl) + '&ua=' + encodeURIComponent(ua)];
            }
        });

        try {
            await player.load(url);
        } catch(e) {
            alert("Errore Shaka: " + e.code);
            closePlayer();
        }
    }

    function closePlayer() {
        if(player) player.destroy();
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
