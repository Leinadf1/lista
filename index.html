<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Single Stream Player</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">

<style>
body {
background-color: #262626;
color: white;
font-family: Arial, sans-serif;
}
.center {
margin: auto;
width: 50%;
text-align: center;
}
video {
width: 100%;
height: 100%;
}
/* Ho aggiunto solo questo per i bottoni dei canali */
.channel-list { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.chan-btn { background: #444; color: white; border: 1px solid #666; padding: 10px; cursor: pointer; border-radius: 4px; }
.chan-btn:hover { background: #ffcc00; color: black; }
</style>
</head>

<body>
<div class="center">
<h2 id="title">Seleziona un Canale</h2>
</div>

<div
class="center"
style="max-width:40em"
data-shaka-player-container
data-shaka-player-cast-receiver-id="07AEE832"
>
<video autoplay data-shaka-player id="video"></video>
</div>

<div class="center channel-list" id="list"></div>

<script>
async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const controls = ui.getControls();
    const player = controls.getPlayer();

    // Carica la lista e crea i bottoni
    const res = await fetch("./lista_privata.m3u");
    const data = await res.text();
    const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');

    blocks.forEach(block => {
        if (block.includes('#EXTINF')) {
            const name = block.split(',').pop().split('\n')[0].trim();
            const url = block.match(/https?:\/\/\S+/)?.[0];
            const keys = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

            if (url && keys) {
                const btn = document.createElement('button');
                btn.className = 'chan-btn';
                btn.innerText = name;
                btn.onclick = async () => {
                    document.getElementById('title').innerText = name;
                    player.configure({ drm: { clearKeys: { [keys[1]]: keys[2] } } });
                    try {
                        await player.load(url);
                    } catch (e) {
                        alert("Errore 4000: Il browser blocca il flusso.");
                    }
                };
                document.getElementById('list').appendChild(btn);
            }
        }
    });
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
