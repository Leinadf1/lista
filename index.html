<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        h1 { font-size: 24px; color: #58a6ff; margin: 0; }
        .player-container { width: 100%; max-width: 850px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 35px; border: 1px solid #30363d; }
        video { width: 100%; aspect-ratio: 16/9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; cursor: pointer; transition: 0.2s; overflow: hidden; display: flex; flex-direction: column; text-align: center; }
        .card:hover { border-color: #58a6ff; transform: translateY(-3px); }
        .logo-box { width: 100%; height: 90px; display: flex; justify-content: center; align-items: center; background: #21262d; padding: 5px; box-sizing: border-box; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .name { padding: 10px; font-size: 12px; font-weight: bold; color: #f0f6fc; }
    </style>
</head>
<body>

    <div id="header">
        <h1>Dashboard Live</h1>
        <div id="chan-count">Sincronizzazione...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="list" class="grid"></div>

<script>
const SOURCE_URL = "/api/get-list";

const CANALI_FISSI = [
    { name: "EUROSPORT 4K", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/thumb.prod.front.tim.cptech.pro/http/unsafe/filters:format(png):anamorphosis(640,480)/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020019/tim-ouah/CHN43FN/MONOGRAM_ESP4K_WHITE_V2-BjK0", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport4k)/manifest.mpd", keys: {"9ceae06c6ad34aada83ba86c0b511452":"406862beb4af1ef8fe04ba15d9936360","fcd924bd2e45470fa2ae50ef05e357c0":"266db84d3572bc889185274a90ff31df","dea135e33341468f8a4e8da806d8a6e6":"fb7423db39e6fab75056f8c83f415847","31911db90ee3410f8b38e45659d01fb1":"ac316ab7dfd2b50faf6d44633e4fedd5","a16f2a39adbb4974b8910cec8a651a09":"c2d55e0111af955f47214af209a2c468"} }
];

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const container = document.getElementById('list');

    player.configure({
        streaming: { jumpLargeGaps: true },
        drm: { retryParameters: { maxAttempts: 4, timeout: 8000 } }
    });

    function createCard(name, logo, url, drmKeys) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="logo-box"><img src="${logo}"></div><div class="name">${name}</div>`;
        
        card.onclick = async () => {
            try {
                await player.unload();
                // Pulizia maniacale delle chiavi
                const cleanKeys = {};
                for (let k in drmKeys) {
                    cleanKeys[k.replace(/\s/g, '').toLowerCase()] = drmKeys[k].replace(/\s/g, '').toLowerCase();
                }
                
                player.configure({ drm: { clearKeys: cleanKeys } });
                await player.load(url.trim());
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch(e) { console.error("Errore Shaka:", e.code); }
        };
        container.appendChild(card);
    }

    try {
        const res = await fetch(SOURCE_URL);
        const text = await res.text();
        const blocks = text.split('#EXTINF');
        let count = 0;

        blocks.forEach(block => {
            const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
            const urlMatch = block.match(/https?:\/\/[^\s"|]+\.mpd/i);
            const nameMatch = block.match(/,(.*)/);

            if (keyMatch && urlMatch && nameMatch) {
                count++;
                const logoMatch = block.match(/tvg-logo="([^"]+)"/i);
                const keys = { [keyMatch[1]]: keyMatch[2] };
                createCard(nameMatch[1].trim(), logoMatch ? logoMatch[1] : '', urlMatch[0], keys);
            }
        });
        document.getElementById('chan-count').innerText = count + " CANALI CARICATI";
    } catch (e) { document.getElementById('chan-count').innerText = "ERRORE API"; }

    CANALI_FISSI.forEach(c => createCard(c.name, c.logo, c.url, c.keys));
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
