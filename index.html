<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Riservata TV</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .hidden { display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-width: 1000px; margin: 30px auto; }
        button { background: #1e1e1e; color: white; border: 1px solid #333; padding: 15px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        button:hover { background: #0078d4; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: white; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login-section">
        <h1>🔐 Accesso Privato</h1>
        <input type="password" id="pw" placeholder="Password"><br>
        <button onclick="check()">ENTRA</button>
    </div>

    <div id="main-section" class="hidden">
        <h1>📺 I Tuoi Canali</h1>
        <div id="buttons" class="grid"></div>
    </div>

    <script>
        const passSegreta = "1234"; 
        const idEstensione = "opmeopcambhflmffbomjgemehjkbbmji";

        // IMPORTANTE: Incolla qui tra le virgolette il link che hai copiato al punto 1
        const urlListaRaw = "https://raw.githubusercontent.com/Leinadf1/lista/main/lista_privata.m3u";

        function check() {
            if(document.getElementById('pw').value === passSegreta) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                loadList();
            } else { alert("Password errata"); }
        }

        async function loadList() {
            try {
                // Proviamo il caricamento diretto (ora che la repo è pubblica dovrebbe andare)
                const res = await fetch(urlListaRaw);
                if (!res.ok) throw new Error();
                const text = await res.text();
                
                const lines = text.split('\n');
                const btnContainer = document.getElementById('buttons');
                btnContainer.innerHTML = ''; 

                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('#EXTINF')) {
                        const name = lines[i].split(',').pop().trim();
                        // L'estensione ha bisogno del link RAW per funzionare
                        const extensionLink = `chrome-extension://${idEstensione}/iptv/player.html#${urlListaRaw}`;

                        let btn = document.createElement('button');
                        btn.innerText = name;
                        btn.onclick = () => { window.open(extensionLink, '_blank'); };
                        btnContainer.appendChild(btn);
                    }
                }
            } catch (err) {
                // Se fallisce il caricamento diretto, usa questo piano B automatico
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(urlListaRaw);
                const resProxy = await fetch(proxyUrl);
                const textProxy = await resProxy.text();
                // (Ripete la logica di creazione bottoni...)
                location.reload(); // Forza un refresh se fallisce tutto
            }
        }
    </script>
</body>
</html>
