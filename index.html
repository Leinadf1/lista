<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>

    <style>
        :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        
        /* Stile Header nodrm */
        .header { display: flex; align-items: baseline; border-bottom: 1px solid #1e232d; margin-bottom: 25px; padding-bottom: 15px; }
        .header h1 { font-size: 20px; text-transform: uppercase; margin: 0; font-weight: 900; }
        .header .count { color: #3a4454; font-size: 11px; margin-left: 10px; font-weight: bold; }

        /* Griglia Canali identica a nodrm */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        .card { 
            background: var(--card); border-radius: 4px; padding: 15px; text-align: left; 
            cursor: pointer; border: 1px solid #1e232d; transition: 0.2s;
            display: flex; flex-direction: column; min-height: 140px;
        }
        .card:hover { border-color: #333; background: #1a1f29; }
        
        .logo-box { height: 60px; width: 100%; display: flex; align-items: center; justify-content: flex-start; margin-bottom: 15px; }
        .logo-box img { max-width: 80%; max-height: 100%; object-fit: contain; }
        
        .name { font-size: 13px; font-weight: bold; margin-bottom: 2px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub { font-size: 9px; color: var(--blue); font-weight: bold; text-transform: uppercase; }

        /* Overlay Player */
        #player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .player-container { width: 95%; max-width: 900px; }
        
        .player-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .player-title-wrap { display: flex; align-items: center; gap: 10px; }
        .player-title-wrap h3 { font-size: 15px; margin: 0; }
        .player-title-wrap .cat { font-size: 10px; color: var(--blue); font-weight: bold; text-transform: uppercase; }
        
        .close-btn { background: rgba(255,255,255,0.05); color: #777; border: 1px solid #333; padding: 4px 10px; cursor: pointer; border-radius: 3px; font-size: 10px; font-weight: bold; }
        
        /* Container Shaka UI */
        .shaka-video-container { width: 100%; aspect-ratio: 16/9; border-radius: 2px; overflow: hidden; }
        video { width: 100%; height: 100%; }
        
        /* Forza Barra Gialla */
        .shaka-range-element { color: #ffcc00 !important; }

        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10001; }
        input { background: #000; border: 1px solid #222; color: white; padding: 12px; border-radius: 4px; text-align: center; width: 220px; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="lock">
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()" style="background:var(--blue); color:#000; border:none; padding:10px 30px; border-radius:4px; cursor:pointer; font-weight:900;">ACCEDI</button>
</div>

<div id="app" class="hidden">
    <div class="header"><h1>📺 CHANNELS</h1> <div class="count" id="count">0 CHANNELS</div></div>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-container">
        <div class="player-nav">
            <div class="player-title-wrap">
                <h3 id="playing-name">CANALE</h3>
                <span class="cat">SKY IT INTRATTENIMENTO</span>
            </div>
            <button class="close-btn" onclick="closePlayer()">✕ CLOSE</button>
        </div>
        <div id="video-container" class="shaka-video-container">
            <video id="video" autoplay></video>
        </div>
    </div>
</div>

<script>
    const PW_SECRET = "1234";
    const FILE_NAME = "lista_privata.m3u";
    let player, ui;

    function login() {
        if(document.getElementById('pw').value === PW_SECRET) {
            document.getElementById('lock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            load();
        } else { alert("Accesso Negato"); }
    }

    async function load() {
        try {
            const res = await fetch("./" + FILE_NAME);
            const data = await res.text();
            const lines = data.split('\n');
            const container = document.getElementById('grid');
            let count = 0;

            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('#EXTINF')) {
                    count++;
                    const info = lines[i];
                    const name = info.split(',').pop().trim();
                    const logo = info.match(/tvg-logo="([^"]+)"/)?.[1] || "";
                    
                    let kid = "", key = "", url = "";
                    // Estrazione KID e KEY da KODIPROP
                    for(let j=1; j<=4; j++){
                        let line = lines[i+j]?.trim() || "";
                        if(line.includes('license_key=')){
                            const val = line.split('license_key=')[1];
                            [kid, key] = val.split(':');
                        }
                        if(line.startsWith('http')) url = line;
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openPlayer(url, name, kid, key);
                    card.innerHTML = `
                        <div class="logo-box"><img src="${logo}"></div>
                        <div class="name">${name}</div>
                        <div class="sub">SKY IT INTRATTENIMENTO</div>
                    `;
                    container.appendChild(card);
                }
            }
            document.getElementById('count').innerText = count + " CHANNELS";
        } catch (e) { console.error("Errore caricamento lista", e); }
    }

    async function openPlayer(url, name, kid, key) {
        if(!url) return;
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('playing-name').innerText = name;
        
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');

        player = new shaka.Player(video);
        ui = new shaka.ui.Overlay(player, videoContainer, video);
        
        // Configurazione UI identica a nodrm
        ui.configure({ 
            'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'fullscreen'],
            'seekBarColors': { base: 'rgba(255,255,255,.2)', buffered: 'rgba(255,255,255,.4)', played: '#ffcc00' }
        });

        if (kid && key) {
            player.configure({ drm: { clearKeys: { [kid.trim()]: key.trim() } } });
        }

        try {
            await player.load(url);
        } catch (e) {
            console.error("Errore Shaka:", e);
            alert("Errore caricamento MPD. Controlla chiavi o restrizioni CORS.");
            closePlayer();
        }
    }

    function closePlayer() {
        if (ui) ui.destroy();
        if (player) player.destroy();
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
