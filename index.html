<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS PRO</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>

    <style>
        :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; --yellow: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        /* Login */
        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #lock input { padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px; margin-bottom: 10px; width: 220px; text-align: center; }
        #lock button { padding: 10px 40px; background: var(--blue); border: none; border-radius: 4px; font-weight: 900; cursor: pointer; color: #000; }

        /* App UI */
        #app { display: none; }
        .header { border-bottom: 1px solid #1e232d; margin-bottom: 25px; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: var(--card); border-radius: 6px; padding: 15px; border: 1px solid #1e232d; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: #3a4454; }
        .logo-box { height: 60px; margin-bottom: 10px; display: flex; align-items: center; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Player */
        #player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; z-index: 10000; align-items: center; justify-content: center; }
        .player-container { width: 95%; max-width: 1000px; }
        .shaka-video-container { width: 100%; aspect-ratio: 16/9; }
        .shaka-range-element { color: var(--yellow) !important; } 
    </style>
</head>
<body>

<div id="lock">
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="checkLogin()">ENTRA</button>
</div>

<div id="app">
    <div class="header"><h1>📺 CHANNELS</h1></div>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-container">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h3 id="p-name" style="margin:0;">Canale</h3>
            <button onclick="closePlayer()" style="background:#333; color:#ccc; border:none; padding:5px 15px; cursor:pointer; border-radius:3px;">✕ CLOSE</button>
        </div>
        <div id="video-container" class="shaka-video-container">
            <video id="video" autoplay crossorigin="anonymous"></video>
        </div>
    </div>
</div>

<script>
    let player, ui;

    function checkLogin() {
        if(document.getElementById('pw').value === "1234") {
            document.getElementById('lock').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadM3U();
        } else { alert("Password Errata!"); }
    }

    async function loadM3U() {
        try {
            const res = await fetch("./lista_privata.m3u");
            const data = await res.text();
            const grid = document.getElementById('grid');
            const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
            
            blocks.forEach(block => {
                if (block.includes('#EXTINF')) {
                    const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                    const uaMatch = block.match(/user-agent=(.*?)\n/i);
                    const urlMatch = block.match(/https?:\/\/\S+/);
                    
                    if (keyMatch && urlMatch) {
                        const name = block.split(',').pop().split('\n')[0].trim();
                        const logo = block.match(/tvg-logo="(.*?)"/)?.[1] || "";
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => startPlay(urlMatch[0], name, keyMatch[1], keyMatch[2], uaMatch ? uaMatch[1].trim() : "");
                        card.innerHTML = `<div class="logo-box"><img src="${logo}"></div><div style="font-size:14px; font-weight:bold">${name}</div>`;
                        grid.appendChild(card);
                    }
                }
            });
        } catch(e) { console.error(e); }
    }

    async function startPlay(url, name, kid, key, ua) {
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('p-name').innerText = name;
        const video = document.getElementById('video');

        if (player) await player.destroy();
        player = new shaka.Player(video);
        
        // UI Gialla
        ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);
        ui.configure({'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'fullscreen']});

        // FILTRO PROXY: Forza ogni richiesta (manifesto e segmenti) tramite Vercel
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
                const originalUrl = request.uris[0];
                if (!originalUrl.includes('/api/proxy')) {
                    request.uris = [window.location.origin + '/api/proxy?url=' + encodeURIComponent(originalUrl) + '&ua=' + encodeURIComponent(ua)];
                }
            }
        });

        player.configure({ drm: { clearKeys: { [kid]: key } } });

        try {
            await player.load(url);
        } catch(e) {
            console.error(e.code);
            alert("Errore: " + e.code + ". Verifica che il file api/proxy.js sia su GitHub.");
            closePlayer();
        }
    }

    function closePlayer() {
        if(player) player.destroy();
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
