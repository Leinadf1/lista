<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>TV WEB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; --border: #1e232d; }
    body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    
    /* Login Screen */
    #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
    #lock input { background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 4px; margin-bottom: 10px; text-align: center; outline: none; }
    #lock button { background: var(--blue); color: black; border: none; padding: 10px 30px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    /* Main App */
    .container { padding: 20px; max-width: 1000px; margin: auto; }
    .header { border-bottom: 1px solid var(--border); margin-bottom: 20px; padding-bottom: 10px; }
    .video-container { width: 100%; max-width: 800px; margin: 0 auto 25px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    /* Griglia canali migliorata */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card { 
        background: var(--card); border: 1px solid var(--border); color: white; padding: 15px; 
        cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold; transition: 0.2s;
        text-align: center;
    }
    .card:hover { border-color: #444; background: #1c212a; color: var(--blue); }
    .hidden { display: none !important; }
</style>
</head>
<body>

<div id="lock">
    <div style="margin-bottom: 20px; font-size: 22px; font-weight: bold; color: var(--blue);">CHANNELS ACCESS</div>
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()">ENTRA</button>
</div>

<div id="app" class="hidden">
    <div class="container">
        <div class="header"><h2 id="title" style="margin:0; font-size:18px;">Seleziona un Canale</h2></div>
        
        <div class="video-container">
            <div data-shaka-player-container>
                <video autoplay data-shaka-player id="video" style="width:100%; height:100%;"></video>
            </div>
        </div>

        <div id="list" class="grid"></div>
    </div>
</div>

<script>
function login() {
    if(document.getElementById('pw').value === "1234") {
        document.getElementById('lock').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
    } else { alert("Password Errata!"); }
}

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    try {
        const res = await fetch('lista_privata.m3u');
        const data = await res.text();
        const container = document.getElementById('list');
        
        // PARSING ROBUSTO: Evita le scritte lunghe dello User-Agent
        const items = data.split('#EXTINF');

        items.forEach(item => {
            if (item.includes('license_key=')) {
                // Pulizia del nome: prende solo l'ultima parte dopo la virgola e prima della riga successiva
                const lines = item.split('\n');
                const firstLine = lines[0];
                const name = firstLine.split(',').pop().trim();
                
                const url = item.match(/https?:\/\/[^\s"|]+/)?.[0];
                const keys = item.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

                if (url && keys && name && !name.includes('Version/')) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerText = name;
                    
                    card.onclick = async () => {
                        document.getElementById('title').innerText = "In riproduzione: " + name;
                        player.configure({ drm: { clearKeys: { [keys[1]]: keys[2] } } });
                        try {
                            // Prova col proxy (come nello screenshot che andava)
                            await player.load("https://corsproxy.io/?url=" + encodeURIComponent(url));
                        } catch (e) {
                            // Fallback senza proxy
                            try { await player.load(url); } catch (e2) {}
                        }
                    };
                    container.appendChild(card);
                }
            }
        });
    } catch (err) { console.error("Errore caricamento lista"); }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
