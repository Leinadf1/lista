<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TV Dashboard PRO – Visual Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; max-width: 1200px; display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        h1 { font-size: 24px; color: #58a6ff; margin: 0; }
        #chan-count { color: #8b949e; }
        .player-container { width: 100%; max-width: 800px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 30px; border: 1px solid #30363d; }
        video { width: 100%; aspect-ratio: 16/9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .channel-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; cursor: pointer; transition: 0.2s; overflow: hidden; display: flex; flex-direction: column; }
        .channel-card:hover { transform: translateY(-3px); border-color: #58a6ff; }
        .channel-card.active { border: 2px solid #58a6ff; background: #21262d; }
        .logo-box { width: 100%; height: 90px; display: flex; justify-content: center; align-items: center; background: #21262d; padding: 10px; box-sizing: border-box; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info-box { padding: 10px; text-align: center; border-top: 1px solid #30363d; }
        .name { font-size: 13px; font-weight: bold; color: #f0f6fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div id="header">
        <h1>DASHBOARD</h1>
        <div id="chan-count">Inizializzazione...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="list" class="grid"></div>

<script>
const LISTA_URL = "lista_privata.m3u";

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const container = document.getElementById('list');
    const countHeader = document.getElementById('chan-count');

    player.configure({ streaming: { jumpLargeGaps: true }, manifest: { dash: { clockSyncUri: '' } } });
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Linux; Android 9; AFTKA Build/PS7702.4965N; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/136.0.7103.125 Mobile Safari/537.36';
    });

    try {
        const res = await fetch(LISTA_URL);
        const text = await res.text();
        
        // Dividiamo la lista per blocchi KODIPROP
        const blocks = text.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
        let channelsCount = 0;

        blocks.forEach(block => {
            if (block.includes('license_key=')) {
                // Estrazione dati con Regex flessibili
                const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                const urlMatch = block.match(/https?:\/\/[^\s"|]+\.mpd[^\s"|]*/i);
                
                // Estraiamo il logo cercando tra le virgolette dopo tvg-logo
                const logoMatch = block.match(/tvg-logo="([^"]+)"/) || block.match(/tvg-logo=([^\s,]+)/);
                
                // Estraiamo il nome (tutto ciò che sta dopo l'ultima virgola nella riga #EXTINF)
                const nameMatch = block.match(/#EXTINF:[^,]+,(.*)/);

                if (keyMatch && urlMatch && nameMatch) {
                    channelsCount++;
                    const kid = keyMatch[1];
                    const key = keyMatch[2];
                    const url = urlMatch[0];
                    const logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150x90?text=No+Logo';
                    const name = nameMatch[1].trim();

                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.innerHTML = `
                        <div class="logo-box"><img src="${logo}" alt=""></div>
                        <div class="info-box"><div class="name">${name}</div></div>
                    `;

                    card.onclick = async () => {
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        player.configure({ drm: { clearKeys: { [kid]: key } } });
                        try { await player.load(url); } catch (e) { alert("Errore: " + e.code); }
                    };
                    container.appendChild(card);
                }
            }
        });
        countHeader.innerText = channelsCount + " CANALI CARICATI";
    } catch (err) {
        countHeader.innerText = "ERRORE CARICAMENTO";
    }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
