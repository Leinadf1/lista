<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Single Stream Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
<style>
    :root { --bg: #0b0e11; --card: #151921; --blue: #00d2ff; }
    body { background-color: var(--bg); color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .center { margin: auto; width: 50%; text-align: center; }
    video { width: 100%; height: 100%; }
    /* Griglia */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 20px; }
    .card { background: var(--card); border: 1px solid #1e232d; padding: 10px; cursor: pointer; border-radius: 4px; font-size: 12px; }
    .card:hover { border-color: #444; }
    .card img { max-width: 100%; height: 35px; object-fit: contain; margin-bottom: 5px; display: block; }
    /* Overlay */
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    /* Password */
    #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    input { background: #000; border: 1px solid #333; color: white; padding: 10px; margin-bottom: 10px; text-align: center; }
    .hidden { display: none !important; }
</style>
</head>
<body>

<div id="lock">
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()" style="padding:10px 20px; cursor:pointer;">ENTRA</button>
</div>

<div id="app" class="hidden">
    <div class="center"><h2>📺 CHANNELS</h2></div>
    <div id="grid" class="grid center" style="max-width:40em"></div>
</div>

<div id="overlay">
    <div class="center" style="max-width:40em; position:relative;">
        <button onclick="closePlayer()" style="position:absolute; right:0; top:-30px; background:red; color:white; border:none; cursor:pointer;">CHIUDI X</button>
        <div data-shaka-player-container data-shaka-player-cast-receiver-id="07AEE832">
            <video autoplay data-shaka-player id="video"></video>
        </div>
    </div>
</div>

<script>
const proxy = "https://corsproxy.io/?url=";
let playerGlobal;

// FUNZIONE DI CARICAMENTO - UGUALE A EUROSPORT
async function play(manifest, kid, key) {
    document.getElementById('overlay').style.display = 'flex';
    
    playerGlobal.configure({
        drm: { clearKeys: { [kid]: key } }
    });

    try {
        // Logica Proxy che ha funzionato
        await playerGlobal.load(proxy + encodeURIComponent(manifest.trim()));
    } catch (e) {
        console.error('Errore:', e);
    }
}

// INIZIALIZZAZIONE - UGUALE A EUROSPORT
async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const controls = ui.getControls();
    playerGlobal = controls.getPlayer();

    playerGlobal.addEventListener('error', e => console.error('Player error:', e.detail));
}

function login() {
    if(document.getElementById('pw').value === "1234") {
        document.getElementById('lock').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        loadList();
    }
}

async function loadList() {
    const res = await fetch("lista_privata.m3u");
    const data = await res.text();
    const blocks = data.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');
    const grid = document.getElementById('grid');

    blocks.forEach(b => {
        if (b.includes('#EXTINF')) {
            const name = b.split(',').pop().split('\n')[0].trim();
            const logo = b.match(/tvg-logo="([^"]+)"/)?.[1] || "";
            const url = b.match(/https?:\/\/\S+/)?.[0];
            const keys = b.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);

            if (url && keys) {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => play(url, keys[1], keys[2]);
                card.innerHTML = `<img src="${logo}"><div class="name">${name}</div>`;
                grid.appendChild(card);
            }
        }
    });
}

function closePlayer() {
    playerGlobal.unload();
    document.getElementById('overlay').style.display = 'none';
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
