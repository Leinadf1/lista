<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS PRO</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>

    <style>
        /* IL TUO STILE ORIGINALE - NON TOCCATO */
        :root { --bg: #0b0e11; --card: #151921; --blue: #007bff; --text: #f0f0f0; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 28px; letter-spacing: 1px; margin: 0; }
        
        .grid { display: flex; flex-direction: column; gap: 10px; }
        .card { 
            background-color: #1a1e26; 
            border-radius: 8px; 
            padding: 20px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid #2d3440;
            font-size: 16px;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--blue); background-color: #202632; }

        /* OVERLAY PLAYER STILE NODRM */
        #player-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; align-items: center; 
            justify-content: center; z-index: 10000; 
        }
        .player-wrap { width: 95%; max-width: 1000px; position: relative; }
        
        .player-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 8px; color: white;
        }
        .player-header h3 { font-size: 14px; margin: 0; font-weight: bold; }
        
        .close-btn { 
            background: #222; color: #ccc; border: 1px solid #444; 
            padding: 4px 12px; cursor: pointer; border-radius: 4px; font-size: 11px; 
        }

        /* Container per Shaka UI */
        .shaka-video-container { width: 100%; aspect-ratio: 16/9; border-radius: 4px; overflow: hidden; }
        video { width: 100%; height: 100%; }

        /* Colore Giallo per la barra Shaka (come nodrm) */
        .shaka-range-element { color: #ffcc00 !important; }

        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10001; }
        #lock input { padding: 12px; background: #1a1e26; color: white; border: 1px solid #2d3440; border-radius: 5px; margin-bottom: 10px; width: 250px; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="lock">
    <h2 style="margin-bottom:20px; font-size: 18px; color: #555;">ACCESS CONTROL</h2>
    <input type="password" id="pw" placeholder="Password">
    <button onclick="login()" style="padding:12px 35px; background:var(--blue); color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">LOGIN</button>
</div>

<div id="app" class="hidden">
    <div class="header">
        <h1>📺 CHANNELS</h1>
    </div>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-wrap">
        <div class="player-header">
            <h3 id="playing-title">LIVE</h3>
            <button class="close-btn" onclick="closePlayer()">✕ CLOSE</button>
        </div>
        <div id="video-container" class="shaka-video-container">
            <video id="video" autoplay></video>
        </div>
    </div>
</div>

<script>
    const PW_SECRET = "1234";
    const FILE_NAME = "lista_privata.m3u";
    let player;
    let ui;

    function login() {
        if(document.getElementById('pw').value === PW_SECRET) {
            document.getElementById('lock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            load();
        } else { alert("Password Errata"); }
    }

    async function load() {
        const res = await fetch("./" + FILE_NAME);
        const data = await res.text();
        const lines = data.split('\n');
        const container = document.getElementById('grid');

        for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes('#EXTINF')) {
                const info = lines[i];
                const name = info.split(',').pop().trim();
                
                let kid = "", key = "", url = "";
                
                // Cerca chiavi KODIPROP e URL nelle righe successive
                for(let j=1; j<=4; j++) {
                    let line = lines[i+j] ? lines[i+j].trim() : "";
                    if(line.includes('license_key=')) {
                        const val = line.split('license_key=')[1];
                        [kid, key] = val.split(':');
                    }
                    if(line.startsWith('http')) url = line;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayer(url, name, kid, key);
                card.innerHTML = name;
                container.appendChild(card);
            }
        }
    }

    async function openPlayer(url, name, kid, key) {
        if(!url) return;
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('playing-title').innerText = name;
        
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');

        // Inizializza Shaka UI
        player = new shaka.Player(video);
        ui = new shaka.ui.Overlay(player, videoContainer, video);
        
        // Configura controlli (identici a nodrm)
        const config = {
            'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'fullscreen'],
            'addLanguageControls': false
        };
        ui.configure(config);

        // Applica chiavi ClearKey
        if (kid && key) {
            player.configure({
                drm: { clearKeys: { [kid]: key.trim() } }
            });
        }

        try {
            await player.load(url);
        } catch (e) {
            console.error("Errore Shaka:", e);
            alert("Errore MPD: Verifica le chiavi nella lista.");
            closePlayer();
        }
    }

    function closePlayer() {
        if (ui) ui.destroy();
        if (player) player.destroy();
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
