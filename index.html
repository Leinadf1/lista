<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS PRO App</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        :root { --bg: #0b0e11; --card: #151921; --blue: #007bff; --text: #f0f0f0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; border: 1px solid #1e232d; transition: 0.3s; }
        .card:hover { border-color: var(--blue); transform: translateY(-5px); }
        
        /* Overlay Player */
        #player-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .player-wrap { width: 90%; max-width: 1000px; position: relative; }
        .close-btn { position: absolute; top: -40px; right: 0; color: white; background: #ff4444; border: none; padding: 5px 15px; cursor: pointer; border-radius: 5px; }
        
        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10001; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="lock">
    <h2>AREA RISERVATA</h2>
    <input type="password" id="pw" style="padding:10px; margin-bottom:10px;">
    <button onclick="login()" style="padding:10px 20px; background:var(--blue); color:white; border:none;">ENTRA</button>
</div>

<div id="app" class="hidden">
    <div class="header"><h1>📺 CHANNELS</h1></div>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div class="player-wrap">
        <button class="close-btn" onclick="closePlayer()">✕ CLOSE</button>
        <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" width="960" height="540"></video>
    </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-shaka@1.1.1/dist/videojs-shaka.min.js"></script>

<script>
    const PW_SECRET = "1234";
    const FILE_NAME = "lista_privata.m3u";
    let vjsPlayer;

    function login() {
        if(document.getElementById('pw').value === PW_SECRET) {
            document.getElementById('lock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            load();
        } else { alert("Password errata"); }
    }

    async function load() {
        const res = await fetch("./" + FILE_NAME);
        const data = await res.text();
        const lines = data.split('\n');
        const container = document.getElementById('grid');

        for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes('#EXTINF')) {
                const info = lines[i];
                const name = info.split(',').pop().trim();
                const url = lines[i+1]?.trim();
                if(!url) continue;

                const kid = info.match(/#KID=([0-9a-fA-F]+)/)?.[1];
                const key = info.match(/#KEY=([0-9a-fA-F]+)/)?.[1];

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayer(url, kid, key);
                card.innerHTML = `<div class="name">${name}</div>`;
                container.appendChild(card);
            }
        }
    }

    function openPlayer(url, kid, key) {
        document.getElementById('player-overlay').style.display = 'flex';
        
        if (vjsPlayer) { vjsPlayer.dispose(); }

        const playerOptions = {
            autoplay: true,
            controls: true,
            techOrder: ['shaka'],
            shaka: {
                drm: {
                    clearKeys: (kid && key) ? { [kid]: key } : {}
                }
            }
        };

        vjsPlayer = videojs('my-video', playerOptions);
        vjsPlayer.src({ src: url, type: 'application/dash+xml' });
    }

    function closePlayer() {
        if (vjsPlayer) { vjsPlayer.pause(); }
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
