<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard – Debug Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .player-container { width: 100%; max-width: 850px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 30px; border: 1px solid #30363d; }
        video { width: 100%; aspect-ratio: 16/9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; font-size: 12px; }
        .card:hover { border-color: #58a6ff; }
        .card img { max-width: 100%; height: 50px; object-fit: contain; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="list" class="grid"></div>

<script>
const API_URL = "/api/get-list";

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const container = document.getElementById('list');

    player.configure({ streaming: { jumpLargeGaps: true } });

    async function play(url, keys) {
        try {
            await player.unload();
            // Pulizia estrema delle chiavi: rimuoviamo ogni possibile spazio o carattere strano
            const cleanKeys = {};
            for (let k in keys) {
                cleanKeys[k.trim().toLowerCase()] = keys[k].trim().toLowerCase();
            }
            player.configure({ drm: { clearKeys: cleanKeys } });
            await player.load(url.trim());
        } catch(e) { console.error("Error Code:", e.code); }
    }

    try {
        const res = await fetch(API_URL);
        const text = await res.text();
        const blocks = text.split('#EXTINF');

        blocks.forEach(block => {
            const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
            const urlMatch = block.match(/https?:\/\/[^\s"|]+\.mpd/i);
            const nameMatch = block.match(/,(.*)/);
            const logoMatch = block.match(/tvg-logo="([^"]+)"/i);

            if (keyMatch && urlMatch && nameMatch) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${logoMatch ? logoMatch[1] : ''}"><div>${nameMatch[1].trim()}</div>`;
                
                const drm = { [keyMatch[1]]: keyMatch[2] };
                card.onclick = () => {
                    play(urlMatch[0], drm);
                    window.scrollTo({top: 0, behavior: "smooth"});
                };
                container.appendChild(card);
            }
        });
    } catch(e) { console.error("API Error"); }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
