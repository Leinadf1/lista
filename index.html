<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard – Fix Chiavi Incrociate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .player-container { width: 100%; max-width: 850px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; }
        video { width: 100%; aspect-ratio: 16/9; }
        #debug-box { width: 100%; max-width: 850px; background: #1c2128; border: 1px solid #f1e05a; border-radius: 8px; margin: 15px 0; padding: 10px; font-family: monospace; font-size: 11px; color: #f1e05a; white-space: pre-wrap; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; cursor: pointer; text-align: center; padding: 10px; }
        .card img { max-height: 50px; margin-bottom: 8px; }
        .name { font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="debug-box">Seleziona un canale...</div>

    <div id="list" class="grid"></div>

<script>
const API_URL = "/api/get-list";

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const container = document.getElementById('list');
    const debugBox = document.getElementById('debug-box');

    player.configure({ streaming: { jumpLargeGaps: true } });

    try {
        const res = await fetch(API_URL + "?t=" + Date.now());
        const data = await res.text();

        // LOGICA NUOVA: Dividiamo la lista in base a dove iniziano i gruppi di chiavi
        // Cerchiamo i blocchi che contengono le info e l'URL
        const entries = data.split(/#KODIPROP:inputstream\.adaptive\.license_type=clearkey/);
        
        entries.forEach(entry => {
            if (!entry.includes('.mpd')) return;

            // Estraiamo KID e KEY dal blocco attuale
            const keyMatch = entry.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
            const urlMatch = entry.match(/https?:\/\/[^\s"|]+\.mpd[^\s"|]*/i);
            const nameMatch = entry.match(/,(.*)/);
            const logoMatch = entry.match(/tvg-logo="([^"]+)"/i);

            if (keyMatch && urlMatch && nameMatch) {
                const name = nameMatch[1].split('\n')[0].trim();
                const kid = keyMatch[1].toLowerCase().trim();
                const key = keyMatch[2].toLowerCase().trim();
                const url = urlMatch[0].trim();
                const drm = { [kid]: key };

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${logoMatch ? logoMatch[1] : ''}"><div class="name">${name}</div>`;
                
                card.onclick = async () => {
                    debugBox.innerHTML = `DEBUG:\nCanale: ${name}\nURL: ${url}\nKID: ${kid}\nKEY: ${key}`;
                    try {
                        await player.unload();
                        player.configure({ drm: { clearKeys: drm } });
                        await player.load(url);
                    } catch(e) { debugBox.innerHTML += `\nERROR: ${e.code}`; }
                };
                container.appendChild(card);
            }
        });
    } catch(e) { debugBox.innerText = "Errore caricamento API"; }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
