<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANNELS PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/controls.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.ui.js"></script>
    <style>
        :root { --bg: #0b0e11; --blue: #00d2ff; --yellow: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 15px; }
        #lock { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #lock input { padding: 12px; background: #000; border: 1px solid #333; color: #fff; margin-bottom: 10px; text-align: center; border-radius: 4px; }
        #app { display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .card { background: #151921; border-radius: 6px; padding: 12px; border: 1px solid #1e232d; cursor: pointer; text-align: center; }
        .card img { max-width: 100%; height: 50px; object-fit: contain; margin-bottom: 8px; }
        #player-overlay { position: fixed; inset: 0; background: #000; display: none; z-index: 10000; flex-direction: column; }
        .shaka-video-container { width: 100%; height: 100%; }
        .shaka-range-element { color: var(--yellow) !important; }
    </style>
</head>
<body>

<div id="lock">
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="login()" style="padding: 10px 30px; background: var(--blue); border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">ENTRA</button>
</div>

<div id="app">
    <h2 style="border-bottom: 1px solid #333; padding-bottom: 10px;">📺 LIVE TV</h2>
    <div id="grid" class="grid"></div>
</div>

<div id="player-overlay">
    <div style="padding: 10px; display: flex; justify-content: space-between; background: #111; align-items: center;">
        <span id="p-name" style="font-weight: bold; font-size: 14px;">Canale</span>
        <button onclick="closePlayer()" style="color: #ff4444; background: rgba(255,0,0,0.1); border: 1px solid #ff4444; padding: 5px 10px; font-weight: bold; cursor: pointer; border-radius: 3px;">CHIUDI ✕</button>
    </div>
    <div id="video-container" class="shaka-video-container">
        <video id="video" autoplay crossorigin="anonymous" style="width: 100%; height: 100%;"></video>
    </div>
</div>

<script>
    let player, ui;

    function login() {
        if(document.getElementById('pw').value === "1234") {
            document.getElementById('lock').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadM3U();
        } else { alert("Password Errata"); }
    }

    async function loadM3U() {
        try {
            const res = await fetch("./lista_privata.m3u");
            const text = await res.text();
            const grid = document.getElementById('grid');
            // Splitta i canali basandosi sulla chiave ClearKey
            const blocks = text.split('#KODIPROP:inputstream.adaptive.license_type=clearkey');

            blocks.forEach(block => {
                if (block.includes('#EXTINF')) {
                    const url = block.match(/https?:\/\/\S+/)?.[0];
                    const keyMatch = block.match(/license_key=([a-f0-9]{32}):([a-f0-9]{32})/i);
                    const name = block.split(',').pop().split('\n')[0].trim();
                    const logo = block.match(/tvg-logo="(.*?)"/)?.[1] || "";
                    const ua = block.match(/user-agent=(.*?)\n/i)?.[1]?.trim() || "";

                    if (url && keyMatch) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => startStream(url, name, keyMatch[1], keyMatch[2], ua);
                        card.innerHTML = `<img src="${logo}"><div>${name}</div>`;
                        grid.appendChild(card);
                    }
                }
            });
        } catch(e) { alert("Errore caricamento lista M3U"); }
    }

    async function startStream(url, name, kid, key, ua) {
        document.getElementById('player-overlay').style.display = 'flex';
        document.getElementById('p-name').innerText = name;
        const video = document.getElementById('video');

        if (player) await player.destroy();
        player = new shaka.Player(video);
        
        // UI e Barra Gialla
        ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);
        ui.configure({'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'fullscreen']});

        // Configurazione ClearKey
        player.configure({ drm: { clearKeys: { [kid]: key } } });

        // LOGICA PROXY AVANZATA: Intercetta ogni singola richiesta di rete
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            const originalUrl = request.uris[0];
            
            // Non applichiamo il proxy se l'URL è già quello del proxy o se è una licenza locale
            if (!originalUrl.includes('/api/proxy') && originalUrl.startsWith('http')) {
                // Costruiamo l'URL del proxy assoluto per evitare errori di percorso
                const proxyBase = window.location.origin + '/api/proxy';
                request.uris = [proxyBase + '?url=' + encodeURIComponent(originalUrl) + '&ua=' + encodeURIComponent(ua)];
            }
        });

        try {
            await player.load(url);
            console.log("Riproduzione avviata correttamente");
        } catch(e) {
            console.error("Errore Shaka:", e.code);
            // Se l'errore è 4000, il proxy non ha risposto correttamente
            alert("Errore " + e.code + ": Il server non risponde. Attendi 30 secondi e riprova.");
            closePlayer();
        }
    }

    function closePlayer() {
        if(player) player.destroy();
        document.getElementById('player-overlay').style.display = 'none';
    }
</script>
</body>
</html>
