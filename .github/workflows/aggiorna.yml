name: Auto Update
on:
  workflow_dispatch:   # attivabile manualmente o via API esterna (cron-job)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 1. Lista principale
      - name: Download base list
        run: |
          # Inserisce sempre #EXTM3U come prima riga
          echo "#EXTM3U" > lista_privata.m3u
          curl -sL -k \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36" \
            "${{ secrets.URL_LISTA }}" >> lista_privata.m3u
          echo "# Ultimo aggiornamento: $(date)" >> lista_privata.m3u

      # 2. Scarica il sky.m3u attuale dal Gist (così lo script può aggiornarlo)
      - name: Fetch current sky.m3u from Gist
        run: |
          curl -sL "https://gist.githubusercontent.com/Leinadf1/${{ secrets.GIST_ID }}/raw/sky.m3u" -o sky.m3u
          echo "File scaricato:"
          head -5 sky.m3u

      # 3. Genera sky.m3u (aggiorna solo URL/DRM, non tocca loghi)
      - name: Update sky.m3u (Supabase)
        run: |
          pip install requests
          python sky_lc.py

      # 4. Genera sky2.m3u (Node)
      - name: Generate sky2.m3u (AutoDecrypt)
        run: node AutoDecrypt.js
        env:
          SKY_DECRYPT_PASSWORD: ${{ secrets.SKY_DECRYPT_PASSWORD }}
          SKY_SOURCE_URL: ${{ secrets.SKY_SOURCE_URL }}

      # 5. Carica i file aggiornati sui Gist
      - name: Deploy lista_privata.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: lista_privata.m3u
          file_type: text

      - name: Deploy sky.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: sky.m3u
          file_type: text

      - name: Deploy sky2.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: sky2.m3u
          file_type: text
