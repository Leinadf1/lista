name: Auto Update
on:
  workflow_dispatch:   # attivabile manualmente o via API esterna (cron-job)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Installiamo Cloudflare WARP per cambiare l'IP di GitHub Actions
      - name: Setup Cloudflare WARP (VPN)
        uses: fscarmen/warp-on-actions@v1.1
        with:
          mode: bridge # Configura un proxy socks5 locale su porta 40000

      - name: Download base list via WARP
        run: |
          echo "Download in corso tramite la rete Cloudflare WARP..."
          
          # Forziamo curl a passare per il proxy locale di WARP (porta 40000)
          curl -sL -k --max-time 50 \
            --socks5-hostname 127.0.0.1:40000 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "${{ secrets.URL_LISTA }}" > lista_privata.m3u

          echo "# Ultimo aggiornamento: $(date)" >> lista_privata.m3u

      - name: Save
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lista_privata.m3u
          git commit -m "Update list $(date +'%H:%M')" || echo "No changes"
          git push origin main
