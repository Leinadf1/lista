name: Auto Update
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: curl -s https://nodrm.online/list/list2.m3u -o lista.m3u
      - name: Save
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update" && git push)
