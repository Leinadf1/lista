name: Auto Update
on:
  schedule:
    - cron: '*/30 * * * *' # 5 minuti è troppo poco, GitHub ti blocca. 30 è meglio.
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          # Scarichiamo la lista
          curl -sL https://nodrm.online/list/list2.m3u -o lista_privata.m3u
      - name: Save Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista_privata.m3u
          
          # Se il file è cambiato, fai il commit. Se non è cambiato, non fa nulla.
          if ! git diff --staged --quiet; then
            git commit -m "Lista aggiornata: $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "La lista sul server è identica a quella attuale. Nessun aggiornamento necessario."
          fi
