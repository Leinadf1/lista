name: Auto Update
on:
  schedule:
    - cron: '*/15 * * * *'   # ogni 15 minuti
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 1. Lista principale
      - name: Download base list
        continue-on-error: true
        run: |
          echo "#EXTM3U" > lista_privata.m3u
          curl -sL -k \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36" \
            "${{ secrets.URL_LISTA }}" >> lista_privata.m3u

      # 2. Scarica gli script dal Gist privato
      - name: Download scripts from private Gist
        run: |
          curl -sL -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            "https://gist.githubusercontent.com/Leinadf1/${{ secrets.SKY_SCRIPTS_GIST_ID }}/raw/AutoDecrypt.js" -o AutoDecrypt.js
          curl -sL -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            "https://gist.githubusercontent.com/Leinadf1/${{ secrets.SKY_SCRIPTS_GIST_ID }}/raw/sky_lc.py" -o sky_lc.py
          curl -sL -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            "https://gist.githubusercontent.com/Leinadf1/${{ secrets.SKY_SCRIPTS_GIST_ID }}/raw/dazn_nerozone.py" -o dazn_nerozone.py
          if [ ! -s AutoDecrypt.js ]; then echo "Errore: AutoDecrypt.js vuoto"; exit 1; fi
          if [ ! -s sky_lc.py ]; then echo "Errore: sky_lc.py vuoto"; exit 1; fi
          if [ ! -s dazn_nerozone.py ]; then echo "Errore: dazn_nerozone.py vuoto"; exit 1; fi

      # 3. Scarica il sky.m3u attuale dal Gist delle liste
      - name: Fetch current sky.m3u from Gist
        continue-on-error: true
        run: |
          curl -sL "https://gist.githubusercontent.com/Leinadf1/${{ secrets.GIST_ID }}/raw/sky.m3u" -o sky.m3u
          head -5 sky.m3u

      # 4. Genera sky.m3u, z_dazn_swiss.m3u e z_primevideo.m3u
      - name: Update lists from Supabase
        continue-on-error: true
        run: |
          pip install requests
          python sky_lc.py

      # 5. Genera sky2.m3u
      - name: Generate sky2.m3u (AutoDecrypt)
        continue-on-error: true
        run: node AutoDecrypt.js
        env:
          SKY_DECRYPT_PASSWORD: ${{ secrets.SKY_DECRYPT_PASSWORD }}
          SKY_SOURCE_URL: ${{ secrets.SKY_SOURCE_URL }}

      # 6. Genera z_dazn_nerozone.m3u
      - name: Generate z_dazn_nerozone.m3u
        continue-on-error: true
        run: |
          pip install requests cryptography
          python dazn_nerozone.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Controllo ultimo aggiornamento EPG
      - name: Check if EPG was updated today
        id: check_epg
        run: |
          today=$(date -u +%F)
          if [ -f epg_last_update.txt ]; then
            last_update=$(cat epg_last_update.txt)
          else
            last_update=""
          fi
          echo "Today: $today, Last: $last_update"
          if [ "$last_update" = "$today" ]; then
            echo "EPG already updated today, skipping."
            echo "should_update=false" >> $GITHUB_OUTPUT
          else
            echo "EPG needs update."
            echo "should_update=true" >> $GITHUB_OUTPUT
          fi

      # 8. Download e aggiornamento EPG (solo se necessario)
      - name: Download and update EPG
        if: steps.check_epg.outputs.should_update == 'true'
        run: |
          curl -L -o epg_ripper_IT1.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz"
          if [ -s epg_ripper_IT1.xml.gz ]; then
            gunzip -f epg_ripper_IT1.xml.gz
            # Aggiorna il file di stato con la data di oggi
            date -u +%F > epg_last_update.txt
            echo "EPG updated successfully."
          else
            echo "Failed to download EPG, leaving status unchanged."
          fi

      # 9. Commit e push di EPG e file di stato (solo se c'è modifica)
      - name: Commit and push EPG if needed
        if: steps.check_epg.outputs.should_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg_ripper_IT1.xml epg_last_update.txt
          if git diff --cached --quiet; then
            echo "No changes in EPG or status file, skipping commit."
          else
            git commit -m "Auto-update EPG"
            git push
          fi

      # 10. Deploy dei file sui Gist (invariati)
      - name: Deploy lista_privata.m3u to Gist
        continue-on-error: true
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: lista_privata.m3u
          file_type: text

      - name: Deploy sky.m3u to Gist
        continue-on-error: true
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: sky.m3u
          file_type: text

      - name: Deploy sky2.m3u to Gist
        continue-on-error: true
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: sky2.m3u
          file_type: text

      - name: Deploy z_dazn_swiss.m3u to Gist
        continue-on-error: true
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: z_dazn_swiss.m3u
          file_type: text

      - name: Deploy z_primevideo.m3u to Gist
        continue-on-error: true
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: z_primevideo.m3u
          file_type: text

      - name: Deploy z_dazn_nerozone.m3u to Gist
        continue-on-error: true
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: z_dazn_nerozone.m3u
          file_type: text
