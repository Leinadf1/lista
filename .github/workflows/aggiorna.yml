name: Auto Update
on:
  workflow_dispatch:   # attivabile manualmente o via API esterna (cron-job)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 1. Lista principale (momentaneamente disattivata)
      - name: Download base list
        if: false   # <-- rimuovi per riattivare
        run: |
          curl -sL -k --url "${{ secrets.URL_LISTA }}" > lista_privata.m3u
          echo "# Ultimo aggiornamento: $(date)" >> lista_privata.m3u

      # 2. Sky primaria (Python)
      - name: Generate sky.m3u (Supabase)
        run: |
          pip install requests
          python sky_lc.py

      # 3. Sky secondaria (Node)
      - name: Generate sky2.m3u (AutoDecrypt)
        run: node AutoDecrypt.js
        env:
          SKY_DECRYPT_PASSWORD: ${{ secrets.SKY_DECRYPT_PASSWORD }}
          SKY_SOURCE_URL: ${{ secrets.SKY_SOURCE_URL }}

      # 4. Carica TUTTO sullo stesso Gist segreto
      - name: Deploy lista_privata.m3u to Gist
        if: false   # <-- rimuovi per riattivare (insieme a quello sopra)
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: lista_privata.m3u
          file_type: text

      - name: Deploy sky.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: sky.m3u
          file_type: text

      - name: Deploy sky2.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: sky2.m3u
          file_type: text
