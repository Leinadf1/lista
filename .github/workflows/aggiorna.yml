name: Auto Update
on:
  workflow_dispatch:   # attivabile manualmente o via API esterna (cron-job)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download base list
        run: |
          curl -sL -k --url "${{ secrets.URL_LISTA }}" > lista_privata.m3u
          echo "# Ultimo aggiornamento: $(date)" >> lista_privata.m3u

      - name: Aggiorna il Gist Segreto
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: 6683b8b70c663778105f98b0266979a3
          file_path: lista_privata.m3u
          file_type: text
