name: Auto Update
on:
  workflow_dispatch:   # attivabile manualmente o via API esterna (cron-job)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # -------- LISTA PRINCIPALE (invariata) --------
      - name: Download base list
        run: |
          curl -sL -k --url "${{ secrets.URL_LISTA }}" > lista_privata.m3u
          echo "# Ultimo aggiornamento: $(date)" >> lista_privata.m3u

      # -------- NUOVO: genera sky.m3u da Supabase --------
      - name: Generate sky.m3u (Supabase)
        run: |
          pip install requests
          python sky_lc.py

      # -------- GIST (momentaneamente disattivato) --------
      - name: Aggiorna il Gist Segreto
        if: false   # rimuovi questa riga per riattivare
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: lista_privata.m3u
          file_type: text

      # -------- COMMIT E PUSH DI sky.m3u --------
      - name: Save sky.m3u to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sky.m3u
          if git diff --staged --quiet; then
            echo "No changes to sky.m3u"
          else
            git commit -m "Update sky.m3u $(date +'%H:%M')"
            git push origin main
          fi
