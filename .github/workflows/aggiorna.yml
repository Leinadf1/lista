name: Auto Update
on:
  workflow_dispatch:   # attivabile manualmente o via API esterna (cron-job)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Lista principale
      - name: Download base list
        run: |
          curl -sL -k --url "${{ secrets.URL_LISTA }}" > lista_privata.m3u
          echo "# Ultimo aggiornamento: $(date)" >> lista_privata.m3u

      # Sky primaria (Python)
      - name: Generate sky.m3u (Supabase)
        run: |
          pip install requests
          python sky_lc.py

      # Sky secondaria (Node)
      - name: Generate sky2.m3u (AutoDecrypt)
        run: node AutoDecrypt.js
        env:
          SKY_DECRYPT_PASSWORD: ${{ secrets.SKY_DECRYPT_PASSWORD }}
          SKY_SOURCE_URL: ${{ secrets.SKY_SOURCE_URL }}

      # Gist disattivato (puoi riattivarlo rimuovendo if: false)
      - name: Aggiorna il Gist Segreto
        if: false
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: lista_privata.m3u
          file_type: text

      # Commit di entrambi i file Sky
      - name: Save sky files to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sky.m3u sky2.m3u
          if git diff --staged --quiet; then
            echo "No changes to sky files"
          else
            git commit -m "Update sky lists $(TZ='Europe/Rome' date +'%H:%M')"
            git push origin main
          fi
