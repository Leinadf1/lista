name: Auto Update
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 1. Lista principale
      - name: Download base list
        run: |
          echo "#EXTM3U" > lista_privata.m3u
          curl -sL -k \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36" \
            "${{ secrets.URL_LISTA }}" >> lista_privata.m3u

      # 2. Scarica gli script dal Gist privato
      - name: Download scripts from private Gist
        run: |
          curl -sL -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            "https://gist.githubusercontent.com/Leinadf1/${{ secrets.SKY_SCRIPTS_GIST_ID }}/raw/AutoDecrypt.js" -o AutoDecrypt.js
          curl -sL -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            "https://gist.githubusercontent.com/Leinadf1/${{ secrets.SKY_SCRIPTS_GIST_ID }}/raw/sky_lc.py" -o sky_lc.py
          # Verifica che i file siano stati scaricati correttamente
          if [ ! -s AutoDecrypt.js ]; then echo "Errore: AutoDecrypt.js vuoto"; exit 1; fi
          if [ ! -s sky_lc.py ]; then echo "Errore: sky_lc.py vuoto"; exit 1; fi

      # 3. Scarica il sky.m3u attuale dal Gist delle liste
      - name: Fetch current sky.m3u from Gist
        run: |
          curl -sL "https://gist.githubusercontent.com/Leinadf1/${{ secrets.GIST_ID }}/raw/sky.m3u" -o sky.m3u
          head -5 sky.m3u

      # 4. Genera sky.m3u, z_dazn_swiss.m3u e z_primevideo.m3u
      - name: Update lists from Supabase
        run: |
          pip install requests
          python sky_lc.py

      # 5. Genera sky2.m3u
      - name: Generate sky2.m3u (AutoDecrypt)
        run: node AutoDecrypt.js
        env:
          SKY_DECRYPT_PASSWORD: ${{ secrets.SKY_DECRYPT_PASSWORD }}
          SKY_SOURCE_URL: ${{ secrets.SKY_SOURCE_URL }}

      # 6. Deploy dei file sui Gist
      - name: Deploy lista_privata.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: lista_privata.m3u
          file_type: text

      - name: Deploy sky.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: sky.m3u
          file_type: text

      - name: Deploy sky2.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: sky2.m3u
          file_type: text

      - name: Deploy z_dazn_swiss.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: z_dazn_swiss.m3u
          file_type: text

      - name: Deploy z_primevideo.m3u to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: z_primevideo.m3u
          file_type: text
