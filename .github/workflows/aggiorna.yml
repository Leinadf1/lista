name: Auto Update
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

            - name: Download and Merge
        run: |
          # Scarica la lista base
          curl -sL "https://nodrm.online/list/list2.m3u" > lista_privata.m3u
          
          # Scarica il canale DAZN1
          curl -sL "https://nodrm.online/list/dz1.txt" > dz1.txt
          
          # Rimuove l'header #EXTM3U da dz1.txt (se presente)
          sed -i '/^#EXTM3U/d' dz1.txt
          
          # Cerca l'ultimo link dopo una riga con "CHAMPIONS LEAGUE"
          # Utilizziamo awk per trovare l'ultimo URL della CL e inserire dopo di esso
          awk -v dazn="$(cat dz1.txt)" '
            /CHAMPIONS LEAGUE/ { flag=1 }
            /^http/ && flag { last_cl = NR; flag=0 }
            { lines[NR] = $0 }
            END {
              for (i=1; i<=NR; i++) {
                print lines[i];
                if (i == last_cl) print "";
                if (i == last_cl) print dazn;
                if (i == last_cl) print "";
              }
              if (!last_cl) {
                # Se non c’è Champions League, appende in fondo
                print "";
                print dazn;
              }
            }
          ' lista_privata.m3u > lista_tmp.m3u
          
          mv lista_tmp.m3u lista_privata.m3u
          
          # Aggiunge la data in fondo (come facevi prima) per forzare il cambiamento
          echo "# Ultimo aggiornamento: $(date)" >> lista_privata.m3u
          
          # Log opzionale
          echo "Aggiornato il: $(date)" > last_sync.txt

      - name: Save
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lista_privata.m3u last_sync.txt
          # Il commit ora troverà sempre modifiche grazie alla riga aggiunta sopra
          git commit -m "Update list $(date +'%H:%M')" || echo "No changes"
          git push origin main
